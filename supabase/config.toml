project_id = "aralearn"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "128MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4182"
additional_redirect_urls = [
  "http://127.0.0.1:4182/**",
  "https://appassets.androidplatform.net/**",
  "aralearn://auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/aralearn_mcp_access_token_hook"

[auth.oauth_server]
enabled = true
authorization_url_path = "/"
allow_dynamic_registration = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.aralearn-authoring-mcp]
verify_jwt = false

[functions.aralearn-authoring-action]
verify_jwt = false

[functions.aralearn-course-revisions]
verify_jwt = false
