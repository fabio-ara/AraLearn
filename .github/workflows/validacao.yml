name: Validar repositório

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacao-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validacao:
    name: Testar e validar
    runs-on: windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Analisar código
        run: npm run lint

      - name: Validar runtime de Curso
        run: npm run validate:course-runtime

      - name: Instalar Chromium para testes de interface
        run: npx playwright install chromium

      - name: Gerar e testar o artefato web no navegador
        run: npm run test:e2e

      - name: Examinar o runtime web
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\verifyDeploymentArtifacts.ps1 -Target Pages

      - name: Compilar aplicativo Android
        run: npm run android:debug

      - name: Examinar o runtime Android
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\verifyDeploymentArtifacts.ps1 -Target Android

      - name: Analisar aplicativo Android
        working-directory: android
        run: .\gradlew.bat :app:lintDebug --no-daemon

      - name: Validar exemplo público
        run: npm run validate:example

  supabase:
    name: Testar Supabase local
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Preparar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Testar e conferir a Edge Function
        run: |
          deno test --config supabase/functions/deno.json supabase/functions/tests/aralearn-authoring-mcp.test.ts
          deno check --config supabase/functions/deno.json supabase/functions/aralearn-authoring-mcp/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/aralearn-course-api/index.ts

      - name: Iniciar stack Supabase
        shell: bash
        run: |
          npx --yes supabase@2.109.1 stop --no-backup || true
          for attempt in 1 2 3; do
            if npx --yes supabase@2.109.1 start; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "A stack Supabase não iniciou após $attempt tentativas." >&2
              exit 1
            fi
            echo "::warning::Falha transitória ao iniciar Supabase (tentativa $attempt/3); limpando a stack local."
            ss -ltnp '( sport = :54322 )' || true
            docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}' || true
            npx --yes supabase@2.109.1 stop --no-backup || true
            sleep $((attempt * 3))
          done

      - name: Reaplicar migration e seed
        run: npx --yes supabase@2.109.1 db reset

      - name: Executar testes pgTAP
        run: npx --yes supabase@2.109.1 test db

      - name: Conferir paridade vertical no banco real
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          {
            psql "$DB_URL" -At -F '|' -c "
              select case
                when c.relkind in ('r', 'p') then 'table'
                when c.relkind = 'v' then 'view'
                when c.relkind = 'm' then 'materialized_view'
              end,
              n.nspname || '.' || c.relname
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
                and c.relkind in ('r', 'p', 'v', 'm')
              order by 1, 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'function',
                n.nspname || '.' || p.proname || '(' ||
                pg_get_function_identity_arguments(p.oid) || ')'
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'index',
                n.nspname || '.' || t.relname || '/' || i.relname
              from pg_index x
              join pg_class t on t.oid = x.indrelid
              join pg_class i on i.oid = x.indexrelid
              join pg_namespace n on n.oid = t.relnamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'constraint',
                n.nspname || '.' || c.relname || '/' || k.conname || '[' ||
                case k.contype
                  when 'c' then 'check'
                  when 'f' then 'foreign_key'
                  when 'p' then 'primary_key'
                  when 'u' then 'unique'
                  when 'x' then 'exclusion'
                  when 'n' then 'not_null'
                  else k.contype::text
                end || ']'
              from pg_constraint k
              join pg_class c on c.oid = k.conrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'trigger',
                n.nspname || '.' || c.relname || '/' || t.tgname
              from pg_trigger t
              join pg_class c on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
                and not t.tgisinternal
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'policy',
                n.nspname || '.' || c.relname || '/' || p.polname
              from pg_policy p
              join pg_class c on c.oid = p.polrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'rls',
                n.nspname || '.' || c.relname || '=' ||
                case
                  when c.relforcerowsecurity then 'forced'
                  when c.relrowsecurity then 'enabled'
                  else 'disabled'
                end
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
                and c.relkind in ('r', 'p')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'bucket', 'storage.' || id
              from storage.buckets
              order by id;
            "
          } | node scripts/auditVerticalParity.mjs --database-inventory -

      - name: Conferir o lint do banco
        shell: bash
        run: |
          lint_json="$(mktemp)"
          trap 'rm -f "$lint_json"' EXIT
          set +e
          npx --yes supabase@2.109.1 db lint --local --level warning \
            --output-format json > "$lint_json"
          lint_status=$?
          set -e
          if [ "$lint_status" -ne 0 ]; then
            exit "$lint_status"
          fi
          node scripts/auditLegacyDbLint.mjs "$lint_json"

      - name: Testar concorrência real dos pedidos de Curso
        shell: bash
        run: |
          command -v psql
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          export ARALEARN_TEST_DATABASE_URL="$DB_URL"
          node --test ./tests/runtime/course-postgres-concurrency.test.js

      - name: Servir e testar a API, o PostgREST e o RLS de Curso
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          npx --yes supabase@2.109.1 functions serve aralearn-course-api --no-verify-jwt > /tmp/aralearn-course-api.log 2>&1 &
          COURSE_API_PID=$!
          cleanup_course_api() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Log da API de Curso"
              tail -n 400 /tmp/aralearn-course-api.log \
                | sed -E 's/(eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.)[A-Za-z0-9_-]+/[credencial JWT omitida]/g'
              echo "::endgroup::"
            fi
            kill "$COURSE_API_PID" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup_course_api EXIT
          COURSE_API_URL='http://127.0.0.1:54321/functions/v1/aralearn-course-api/app/listarCursos'
          COURSE_API_PROBE_BODY='/tmp/aralearn-course-api-readiness.json'
          COURSE_API_PROBE_HEADERS='/tmp/aralearn-course-api-readiness.headers'
          COURSE_API_READY=false
          for attempt in $(seq 1 60); do
            status_code="$(curl --silent --output "$COURSE_API_PROBE_BODY" \
              --dump-header "$COURSE_API_PROBE_HEADERS" --write-out '%{http_code}' \
              --request GET \
              --header 'Origin: http://127.0.0.1:4182' \
              "$COURSE_API_URL" || true)"
            if [ "$status_code" = 405 ] && \
              grep --fixed-strings --quiet '"code":"method_not_allowed"' "$COURSE_API_PROBE_BODY" && \
              grep --ignore-case --fixed-strings --quiet \
                'content-type: application/json; charset=utf-8' "$COURSE_API_PROBE_HEADERS" && \
              grep --ignore-case --fixed-strings --quiet \
                'access-control-allow-origin: http://127.0.0.1:4182' "$COURSE_API_PROBE_HEADERS"; then
              COURSE_API_READY=true
              break
            fi
            if ! kill -0 "$COURSE_API_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$COURSE_API_READY" != true ]; then
            echo "A API de Curso não ficou pronta após 60 tentativas." >&2
            exit 1
          fi
          npm run test:supabase:smoke

      - name: Testar confirmação e recuperação por e-mail
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          node ./supabase/tests/auth-email-smoke.mjs

      - name: Servir e testar o gateway MCP de autoria
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          npx --yes supabase@2.109.1 functions serve aralearn-authoring-mcp --no-verify-jwt > /tmp/aralearn-mcp.log 2>&1 &
          MCP_PID=$!
          cleanup_mcp() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Log do gateway MCP"
              tail -n 400 /tmp/aralearn-mcp.log \
                | sed -E 's/(eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.)[A-Za-z0-9_-]+/[credencial JWT omitida]/g'
              echo "::endgroup::"
            fi
            kill "$MCP_PID" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup_mcp EXIT
          MCP_METADATA_URL='http://127.0.0.1:54321/functions/v1/aralearn-authoring-mcp/.well-known/oauth-protected-resource'
          MCP_READY=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --output /dev/null \
              "$MCP_METADATA_URL"; then
              MCP_READY=true
              break
            fi
            if ! kill -0 "$MCP_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$MCP_READY" != true ]; then
            echo "O endpoint de metadata OAuth do MCP não ficou pronto após 60 tentativas." >&2
            exit 1
          fi
          npm run test:authoring:mcp:local:oauth

      - name: Encerrar stack Supabase
        if: always()
        run: npx --yes supabase@2.109.1 stop --no-backup
