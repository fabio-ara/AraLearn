name: Validar repositório

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validacao:
    name: Testar e validar
    runs-on: windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Preparar correções de estabilidade
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/android-release-v2-signer-parser'
        shell: pwsh
        run: |
          git fetch origin fix/android-release-v2-signer-parser
          git checkout -B fix/android-release-v2-signer-parser origin/fix/android-release-v2-signer-parser
          @'
          from pathlib import Path

          android = Path('.github/workflows/android-release.yml')
          source = android.read_text(encoding='utf-8')
          old = r"(?im)^Signer[^\r\n]* certificate SHA-256 digest:\s*([a-f0-9:]+)\s*$"
          new = r"(?im)^(?:V\d+\s+)?Signer[^\r\n]*:?\s*certificate SHA-256 digest:\s*([a-f0-9:]+)\s*$"
          if old in source:
              android.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('Regex Android esperado não encontrado.')

          pages = Path('.github/workflows/pages.yml')
          source = pages.read_text(encoding='utf-8')
          old = '      - name: Conferir o endereço publicado\n        run: node ./scripts/verifyPublishedSite.mjs --url "${{ steps.deployment.outputs.page_url }}"\n'
          new = '''      - name: Conferir o endereço publicado\n        shell: pwsh\n        run: |\n          $attempts = 4\n          for ($attempt = 1; $attempt -le $attempts; $attempt++) {\n            node ./scripts/verifyPublishedSite.mjs --url "${{ steps.deployment.outputs.page_url }}"\n            if ($LASTEXITCODE -eq 0) { exit 0 }\n            if ($attempt -eq $attempts) { exit $LASTEXITCODE }\n            Start-Sleep -Seconds (5 * $attempt)\n          }\n'''
          if old in source:
              pages.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('Etapa de verificação do Pages esperada não encontrada.')

          sync = Path('src/sync/RelationalSyncEngine.js')
          source = sync.read_text(encoding='utf-8')
          old = '        await this.store.removeOfficialCourseReplica(entry.courseId);\n        this.#unavailableCourseRevisions.push({'
          new = '        // Preserve a última réplica oficial válida: uma revisão incompatível não pode apagar conteúdo já estudável.\n        this.#unavailableCourseRevisions.push({'
          if old in source:
              sync.write_text(source.replace(old, new, 1), encoding='utf-8')
          elif new not in source:
              raise SystemExit('Tratamento de revisão incompatível esperado não encontrado.')
          '@ | python -

          New-Item -ItemType Directory -Force .autonomous | Out-Null
          npm run catalog:validate *>&1 | Tee-Object -FilePath .autonomous/catalog-validate.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (Test-Path .github/workflows/autonomous-stability-fix.yml) {
            Remove-Item .github/workflows/autonomous-stability-fix.yml
          }
          git config user.name "AraLearn Stability Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/android-release.yml .github/workflows/pages.yml src/sync/RelationalSyncEngine.js .autonomous/catalog-validate.txt .github/workflows/autonomous-stability-fix.yml
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Corrige estabilidade de publicação e réplica local"
          git push origin HEAD:fix/android-release-v2-signer-parser

      - name: Executar testes
        run: npm test

      - name: Analisar código
        run: npm run lint

      - name: Validar corte relacional e fixtures
        run: |
          npm run validate:cutover
          npm run catalog:validate

      - name: Instalar Chromium para testes de interface
        run: npx playwright install chromium

      - name: Gerar e testar o artefato web no navegador
        run: npm run test:e2e

      - name: Examinar o runtime web
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\verifyDeploymentArtifacts.ps1 -Target Pages

      - name: Compilar aplicativo Android
        run: npm run android:debug

      - name: Examinar o runtime Android
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\verifyDeploymentArtifacts.ps1 -Target Android

      - name: Analisar aplicativo Android
        working-directory: android
        run: .\gradlew.bat :app:lintDebug --no-daemon

      - name: Validar exemplo público
        run: npm run validate:example

  supabase:
    name: Testar Supabase local
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Testar e conferir a Edge Function
        run: |
          deno test --config supabase/functions/deno.json supabase/functions/tests/aralearn-authoring-mcp.test.ts
          deno test --config supabase/functions/deno.json supabase/functions/tests/aralearn-course-revisions.test.ts
          deno check --config supabase/functions/deno.json supabase/functions/aralearn-authoring-mcp/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/aralearn-authoring-action/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/aralearn-course-revisions/index.ts

      - name: Iniciar stack Supabase
        run: npx --yes supabase@2.109.1 start

      - name: Reaplicar migration e seed
        run: npx --yes supabase@2.109.1 db reset

      - name: Conferir o lint do banco
        run: npx --yes supabase@2.109.1 db lint --local --level warning --fail-on warning

      - name: Executar testes pgTAP
        run: npx --yes supabase@2.109.1 test db

      - name: Testar concorrência real dos pedidos de workspace
        shell: bash
        run: |
          command -v psql
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          export ARALEARN_TEST_DATABASE_URL="$DB_URL"
          node --test ./tests/runtime/workspace-postgres-concurrency.test.js

      # A jornada conserva um owner técnico da stack local. A fixture seguinte
      # usa essa autoridade para conceder somente o papel editorial necessário.
      - name: Testar jornada real da Custom GPT Action
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          npm run test:authoring:action:local

      - name: Publicar fixture oficial temporária para smoke
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          export ARALEARN_SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          publisher="$(
            node ./supabase/tests/prepare-local-catalog-publisher.mjs
          )"
          publisher_id="$(jq -erR 'select(test("^[0-9a-f-]{36}$"))' <<<"$publisher")"
          export ARALEARN_CATALOG_OWNER_ID="$publisher_id"
          node ./scripts/publishCatalogFixtures.mjs --publish --course fundamentos-ia-analise-dados-seed-course.json

      - name: Testar Auth, PostgREST, RPCs e RLS
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          npm run test:supabase:smoke

      - name: Testar confirmação e recuperação por e-mail
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          node ./supabase/tests/auth-email-smoke.mjs

      - name: Servir e testar o gateway MCP de autoria
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          npx --yes supabase@2.109.1 functions serve aralearn-authoring-mcp --no-verify-jwt > /tmp/aralearn-mcp.log 2>&1 &
          MCP_PID=$!
          cleanup_mcp() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Log do gateway MCP"
              tail -n 400 /tmp/aralearn-mcp.log \
                | sed -E 's/(eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.)[A-Za-z0-9_-]+/[credencial JWT omitida]/g'
              echo "::endgroup::"
            fi
            kill "$MCP_PID" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup_mcp EXIT
          MCP_METADATA_URL='http://127.0.0.1:54321/functions/v1/aralearn-authoring-mcp/.well-known/oauth-protected-resource'
          MCP_READY=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --output /dev/null \
              "$MCP_METADATA_URL"; then
              MCP_READY=true
              break
            fi
            if ! kill -0 "$MCP_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$MCP_READY" != true ]; then
            echo "O endpoint de metadata OAuth do MCP não ficou pronto após 60 tentativas." >&2
            exit 1
          fi
          npm run test:authoring:mcp:local:oauth

      - name: Encerrar stack Supabase
        if: always()
        run: npx --yes supabase@2.109.1 stop --no-backup
