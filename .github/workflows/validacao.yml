name: Validar repositório

on:
  pull_request:
    branches:
      - main
      - release/**
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validacao-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparar:
    name: Preparar candidata
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
      requires_supabase: ${{ steps.paths.outputs.requires_supabase }}
      trusted_origin: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      ready_for_integral: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    steps:
      - name: Recusar dispatch fora da main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo 'O dispatch de validação é reservado à main; a candidata de PR usa seu evento próprio.' >&2
          exit 1

      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Classificar arquivos alterados
        id: paths
        run: node ./scripts/classifyCiPaths.mjs

      - name: Validar documentação
        if: steps.paths.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "$BASE_SHA...$HEAD_SHA" --
          npm run audit:docs
          npm run audit:terminology
          npm run docs:references:check

      - name: Instalar dependências do preflight
        if: steps.paths.outputs.docs_only != 'true'
        run: npm ci

      - name: Conferir artefatos gerados e arquitetura
        if: steps.paths.outputs.docs_only != 'true'
        run: npm run test:preflight

      - name: Analisar código
        if: steps.paths.outputs.docs_only != 'true'
        run: npm run lint

      - name: Validar runtime de Curso
        if: steps.paths.outputs.docs_only != 'true'
        run: node ./scripts/validateCourseRuntime.mjs

  web:
    name: Testar web e Android
    needs: preparar
    if: needs.preparar.outputs.docs_only == 'false' && needs.preparar.outputs.ready_for_integral == 'true'
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.validation/playwright-browsers
    outputs:
      pages_id: ${{ steps.pages.outputs.artifact-id }}
      pages_digest: ${{ steps.pages.outputs.artifact-digest }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm run test:runtime

      - name: Recuperar Chromium
        id: chromium
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium para testes de interface
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Gerar e testar o artefato web no navegador
        id: e2e
        env:
          ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
          ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
          ARALEARN_E2E_REAL_SUPABASE: '0'
        run: npm run test:e2e -- --forbid-only --output=test-results-stub

      - name: Guardar traces da interface sintética que falhou
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: aralearn-e2e-stub-failure-${{ github.run_attempt }}
          path: test-results-stub/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Examinar o runtime web
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\scripts\verifyDeploymentArtifacts.ps1
          -Target Pages -RequireRuntimeConfig

      - name: Guardar prévia web da candidata
        id: pages
        if: >-
          ${{ needs.preparar.outputs.docs_only == 'false' &&
              (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: aralearn-pages-candidate-${{ github.run_attempt }}
          path: .pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Compilar aplicativo Android
        env:
          ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
          ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run android:debug

      - name: Examinar o runtime Android
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\scripts\verifyDeploymentArtifacts.ps1
          -Target Android -RequireRuntimeConfig

      - name: Guardar APK de teste da candidata
        if: >-
          ${{ needs.preparar.outputs.docs_only == 'false' &&
              (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v4
        with:
          name: aralearn-android-debug-candidate-${{ github.run_attempt }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Analisar aplicativo Android
        working-directory: android
        env:
          ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
          ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
        run: .\gradlew.bat :app:lintDebug --no-daemon

      - name: Validar exemplo público
        run: npm run validate:example

      - name: Registrar identidade e bytes da candidata
        if: needs.preparar.outputs.trusted_origin == 'true'
        env:
          ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
          ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
        run: node ./scripts/releaseCandidate.mjs record

      - name: Guardar identidade para o gate
        if: needs.preparar.outputs.trusted_origin == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aralearn-candidate-metadata-${{ github.run_attempt }}
          path: .candidate/candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  supabase:
    name: Testar Supabase local
    needs: preparar
    if: needs.preparar.outputs.docs_only == 'false' && needs.preparar.outputs.ready_for_integral == 'true'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.validation/playwright-browsers
    outputs:
      toolchain: ${{ steps.toolchain.outputs.value }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências da integração local
        run: npm ci

      - name: Preparar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Registrar ferramentas da integração
        id: toolchain
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import {execFileSync} from "node:child_process"; fs.appendFileSync(process.env.GITHUB_OUTPUT, "value=" + JSON.stringify({node:process.version,deno:execFileSync("deno",["--version"],{encoding:"utf8"}).trim(),supabase:"2.115.0",runner:process.env.ImageOS,image:process.env.ImageVersion,architecture:process.arch}) + "\n");'

      - name: Testar e conferir a Edge Function
        run: |
          deno test --config supabase/functions/deno.json supabase/functions/tests/aralearn-authoring-mcp.test.ts
          deno check --config supabase/functions/deno.json supabase/functions/aralearn-authoring-mcp/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/aralearn-course-api/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/aralearn-authoring-action/index.ts

      - name: Iniciar stack Supabase
        shell: bash
        run: |
          npx --yes supabase@2.115.0 stop --no-backup || true
          for attempt in 1 2 3; do
            if npx --yes supabase@2.115.0 start; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "A stack Supabase não iniciou após $attempt tentativas." >&2
              exit 1
            fi
            echo "::warning::Falha transitória ao iniciar Supabase (tentativa $attempt/3); limpando a stack local."
            ss -ltnp '( sport = :54322 )' || true
            docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}' || true
            npx --yes supabase@2.115.0 stop --no-backup || true
            sleep $((attempt * 3))
          done

      - name: Reaplicar migration e seed
        run: npx --yes supabase@2.115.0 db reset

      - name: Executar testes pgTAP
        run: npx --yes supabase@2.115.0 test db

      - name: Conferir paridade vertical no banco real
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.115.0 status -o env)"
          set +a
          {
            psql "$DB_URL" -At -F '|' -c "
              select case
                when c.relkind in ('r', 'p') then 'table'
                when c.relkind = 'v' then 'view'
                when c.relkind = 'm' then 'materialized_view'
              end,
              n.nspname || '.' || c.relname
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
                and c.relkind in ('r', 'p', 'v', 'm')
              order by 1, 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'function',
                n.nspname || '.' || p.proname || '(' ||
                pg_get_function_identity_arguments(p.oid) || ')'
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'index',
                n.nspname || '.' || t.relname || '/' || i.relname
              from pg_index x
              join pg_class t on t.oid = x.indrelid
              join pg_class i on i.oid = x.indexrelid
              join pg_namespace n on n.oid = t.relnamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'constraint',
                n.nspname || '.' || c.relname || '/' || k.conname || '[' ||
                case k.contype
                  when 'c' then 'check'
                  when 'f' then 'foreign_key'
                  when 'p' then 'primary_key'
                  when 'u' then 'unique'
                  when 'x' then 'exclusion'
                  when 'n' then 'not_null'
                  else k.contype::text
                end || ']'
              from pg_constraint k
              join pg_class c on c.oid = k.conrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'trigger',
                n.nspname || '.' || c.relname || '/' || t.tgname
              from pg_trigger t
              join pg_class c on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
                and not t.tgisinternal
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'policy',
                n.nspname || '.' || c.relname || '/' || p.polname
              from pg_policy p
              join pg_class c on c.oid = p.polrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'rls',
                n.nspname || '.' || c.relname || '=' ||
                case
                  when c.relforcerowsecurity then 'forced'
                  when c.relrowsecurity then 'enabled'
                  else 'disabled'
                end
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
                and c.relkind in ('r', 'p')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'bucket', 'storage.' || id
              from storage.buckets
              order by id;
            "
          } | node scripts/auditVerticalParity.mjs --database-inventory -

      - name: Conferir o lint do banco
        shell: bash
        run: npx --yes supabase@2.115.0 db lint --local --schema public,private --level warning --fail-on error

      - name: Testar concorrência real dos pedidos de Curso
        shell: bash
        run: |
          command -v psql
          set -a
          eval "$(npx --yes supabase@2.115.0 status -o env)"
          set +a
          export ARALEARN_TEST_DATABASE_URL="$DB_URL"
          node --test ./tests/runtime/course-postgres-concurrency.test.js

      - name: Servir e testar a API, o PostgREST e o RLS de Curso
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.115.0 status -o env)"
          set +a
          npx --yes supabase@2.115.0 functions serve aralearn-course-api --no-verify-jwt > /tmp/aralearn-course-api.log 2>&1 &
          COURSE_API_PID=$!
          cleanup_course_api() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Log da API de Curso"
              tail -n 400 /tmp/aralearn-course-api.log \
                | sed -E 's/(eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.)[A-Za-z0-9_-]+/[credencial JWT omitida]/g'
              echo "::endgroup::"
            fi
            kill "$COURSE_API_PID" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup_course_api EXIT
          COURSE_API_URL='http://127.0.0.1:54321/functions/v1/aralearn-course-api/v1/courses'
          COURSE_API_PROBE_BODY='/tmp/aralearn-course-api-readiness.json'
          COURSE_API_PROBE_HEADERS='/tmp/aralearn-course-api-readiness.headers'
          COURSE_API_RUNTIME_READY=false
          COURSE_API_READY=false
          for attempt in $(seq 1 60); do
            if grep --fixed-strings --quiet \
              'Serving functions on http://127.0.0.1:54321/functions/v1/<function-name>' \
              /tmp/aralearn-course-api.log; then
              COURSE_API_RUNTIME_READY=true
            fi
            if [ "$COURSE_API_RUNTIME_READY" = true ]; then
              status_code="$(curl --silent --output "$COURSE_API_PROBE_BODY" \
                --dump-header "$COURSE_API_PROBE_HEADERS" --write-out '%{http_code}' \
                --request GET \
                --header 'Origin: http://127.0.0.1:4182' \
                "$COURSE_API_URL" || true)"
              if [ "$status_code" = 401 ] && \
                grep --fixed-strings --quiet '"code":"authentication_required"' "$COURSE_API_PROBE_BODY" && \
                grep --ignore-case --fixed-strings --quiet \
                  'content-type: application/json; charset=utf-8' "$COURSE_API_PROBE_HEADERS"; then
                COURSE_API_READY=true
              fi
            fi
            if [ "$COURSE_API_RUNTIME_READY" = true ] && \
              [ "$COURSE_API_READY" = true ]; then
              break
            fi
            if ! kill -0 "$COURSE_API_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$COURSE_API_RUNTIME_READY" != true ]; then
            echo "O processo corrente da API de Curso não confirmou que ficou pronto após 60 tentativas." >&2
            exit 1
          fi
          if [ "$COURSE_API_READY" != true ]; then
            echo "A API de Curso não ficou pronta após 60 tentativas." >&2
            exit 1
          fi
          npm run test:supabase:smoke

      - name: Testar confirmação e recuperação por e-mail
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.115.0 status -o env)"
          set +a
          node ./supabase/tests/auth-email-smoke.mjs

      - name: Recuperar Chromium da integração local
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium da integração local
        run: npx playwright install --with-deps chromium

      - name: Servir e testar o gateway MCP e a Autoria real
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.115.0 status -o env)"
          set +a
          npx --yes supabase@2.115.0 functions serve --no-verify-jwt > /tmp/aralearn-functions.log 2>&1 &
          FUNCTIONS_PID=$!
          cleanup_functions() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Log das Edge Functions de Curso"
              tail -n 400 /tmp/aralearn-functions.log \
                | sed -E 's/(eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.)[A-Za-z0-9_-]+/[credencial JWT omitida]/g'
              echo "::endgroup::"
            fi
            kill "$FUNCTIONS_PID" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup_functions EXIT
          MCP_METADATA_URL='http://127.0.0.1:54321/functions/v1/aralearn-authoring-mcp/.well-known/oauth-protected-resource'
          COURSE_API_URL='http://127.0.0.1:54321/functions/v1/aralearn-course-api/v1/courses'
          COURSE_API_PROBE_BODY='/tmp/aralearn-course-api-integrated-readiness.json'
          COURSE_API_PROBE_HEADERS='/tmp/aralearn-course-api-integrated-readiness.headers'
          FUNCTIONS_RUNTIME_READY=false
          MCP_READY=false
          COURSE_API_READY=false
          for attempt in $(seq 1 60); do
            if grep --fixed-strings --quiet \
              'Serving functions on http://127.0.0.1:54321/functions/v1/<function-name>' \
              /tmp/aralearn-functions.log; then
              FUNCTIONS_RUNTIME_READY=true
            fi
            if [ "$FUNCTIONS_RUNTIME_READY" = true ]; then
              if curl --fail --silent --show-error --output /dev/null \
                "$MCP_METADATA_URL"; then
                MCP_READY=true
              fi
              course_api_status="$(curl --silent --output "$COURSE_API_PROBE_BODY" \
                --dump-header "$COURSE_API_PROBE_HEADERS" --write-out '%{http_code}' \
                --request GET --header 'Origin: http://127.0.0.1:4182' \
                "$COURSE_API_URL" || true)"
              if [ "$course_api_status" = 401 ] && \
                grep --fixed-strings --quiet '"code":"authentication_required"' "$COURSE_API_PROBE_BODY" && \
                grep --ignore-case --fixed-strings --quiet \
                  'content-type: application/json; charset=utf-8' "$COURSE_API_PROBE_HEADERS"; then
                COURSE_API_READY=true
              fi
            fi
            if [ "$FUNCTIONS_RUNTIME_READY" = true ] && \
              [ "$MCP_READY" = true ] && [ "$COURSE_API_READY" = true ]; then
              break
            fi
            if ! kill -0 "$FUNCTIONS_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$FUNCTIONS_RUNTIME_READY" != true ]; then
            echo "O processo corrente das Edge Functions não confirmou que ficou pronto após 60 tentativas." >&2
            exit 1
          fi
          if [ "$MCP_READY" != true ]; then
            echo "O endpoint de metadata OAuth do MCP não ficou pronto após 60 tentativas." >&2
            exit 1
          fi
          if [ "$COURSE_API_READY" != true ]; then
            echo "A API de Curso não ficou pronta junto ao MCP após 60 tentativas." >&2
            exit 1
          fi
          npm run test:authoring:mcp:local:oauth
          ARALEARN_SUPABASE_URL="$API_URL" \
          ARALEARN_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            npm run test:storage:lifecycle:local
          ARALEARN_LOCAL_FUNCTIONS_PID="$FUNCTIONS_PID" \
            node ./scripts/runLocalIntegration.mjs --functions-external --ci

      - name: Encerrar stack Supabase
        if: ${{ always() }}
        run: npx --yes supabase@2.115.0 stop --no-backup

  validacao:
    name: Testar e validar
    needs: [preparar, web, supabase]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Exigir todas as provas aplicáveis
        env:
          PREPARATION_RESULT: ${{ needs.preparar.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}
          DOCS_ONLY: ${{ needs.preparar.outputs.docs_only }}
          READY_FOR_INTEGRAL: ${{ needs.preparar.outputs.ready_for_integral }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const { PREPARATION_RESULT, DOCS_ONLY, READY_FOR_INTEGRAL, WEB_RESULT, SUPABASE_RESULT } = process.env;
          assert.equal(PREPARATION_RESULT, "success", "O preflight da candidata não passou.");
          assert.ok(["true", "false"].includes(DOCS_ONLY), "Classificação ausente ou inválida.");
          if (DOCS_ONLY === "false") {
            assert.equal(READY_FOR_INTEGRAL, "true", "PR em rascunho: falta concluir candidate:ready antes da integral.");
            assert.equal(WEB_RESULT, "success", "A prova integral web e Android não passou.");
            assert.equal(SUPABASE_RESULT, "success", "A prova integral Supabase não passou.");
          }
          NODE

      - name: Baixar repositório
        if: needs.preparar.outputs.docs_only == 'false' && needs.preparar.outputs.trusted_origin == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Node.js
        if: needs.preparar.outputs.docs_only == 'false' && needs.preparar.outputs.trusted_origin == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Baixar identidade da candidata
        if: needs.preparar.outputs.docs_only == 'false' && needs.preparar.outputs.trusted_origin == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aralearn-candidate-metadata-${{ github.run_attempt }}
          path: .candidate

      - name: Vincular manifesto ao gate integral
        if: needs.preparar.outputs.docs_only == 'false' && needs.preparar.outputs.trusted_origin == 'true'
        env:
          DOCS_ONLY: ${{ needs.preparar.outputs.docs_only }}
          WEB_RESULT: ${{ needs.web.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}
          PAGES_ARTIFACT_ID: ${{ needs.web.outputs.pages_id }}
          PAGES_ARTIFACT_DIGEST: ${{ needs.web.outputs.pages_digest }}
          SUPABASE_TOOLCHAIN: ${{ needs.supabase.outputs.toolchain }}
        run: node ./scripts/releaseCandidate.mjs seal

      - name: Guardar prova integral da candidata
        if: needs.preparar.outputs.docs_only == 'false' && needs.preparar.outputs.trusted_origin == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aralearn-candidate-manifest-${{ github.run_attempt }}
