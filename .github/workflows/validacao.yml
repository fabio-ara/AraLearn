name: Validar repositório

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
  workflow_dispatch:

jobs:
  validacao:
    name: Testar e validar
    runs-on: windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Analisar código
        run: npm run lint

      - name: Validar corte relacional
        run: npm run validate:cutover

      - name: Validar fixtures do catálogo
        run: npm run catalog:validate

      - name: Instalar Chromium para testes de interface
        run: npx playwright install chromium

      - name: Gerar e testar o artefato web no navegador
        run: npm run test:e2e

      - name: Examinar o runtime web
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\verifyDeploymentArtifacts.ps1 -Target Pages

      - name: Compilar aplicativo Android
        run: npm run android:debug

      - name: Examinar o runtime Android
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\verifyDeploymentArtifacts.ps1 -Target Android

      - name: Analisar aplicativo Android
        working-directory: android
        run: .\gradlew.bat :app:lintDebug --no-daemon

      - name: Validar exemplo público
        run: npm run validate:example

  supabase:
    name: Testar Supabase local
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Testar e conferir a Edge Function
        run: |
          deno test --config supabase/functions/deno.json supabase/functions/tests/aralearn-authoring-mcp.test.ts
          deno test --config supabase/functions/deno.json supabase/functions/tests/aralearn-course-revisions.test.ts
          deno check --config supabase/functions/deno.json supabase/functions/aralearn-authoring-mcp/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/aralearn-authoring-action/index.ts
          deno check --config supabase/functions/deno.json supabase/functions/aralearn-course-revisions/index.ts

      - name: Iniciar stack Supabase
        run: npx --yes supabase@2.109.1 start

      - name: Reaplicar migration e seed
        run: npx --yes supabase@2.109.1 db reset

      - name: Conferir paridade vertical no banco real
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          {
            psql "$DB_URL" -At -F '|' -c "
              select case
                when c.relkind in ('r', 'p') then 'table'
                when c.relkind = 'v' then 'view'
                when c.relkind = 'm' then 'materialized_view'
              end,
              n.nspname || '.' || c.relname
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
                and c.relkind in ('r', 'p', 'v', 'm')
              order by 1, 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'function',
                n.nspname || '.' || p.proname || '(' ||
                pg_get_function_identity_arguments(p.oid) || ')'
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'index',
                n.nspname || '.' || t.relname || '/' || i.relname
              from pg_index x
              join pg_class t on t.oid = x.indrelid
              join pg_class i on i.oid = x.indexrelid
              join pg_namespace n on n.oid = t.relnamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'constraint',
                n.nspname || '.' || c.relname || '/' || k.conname || '[' ||
                case k.contype
                  when 'c' then 'check'
                  when 'f' then 'foreign_key'
                  when 'p' then 'primary_key'
                  when 'u' then 'unique'
                  when 'x' then 'exclusion'
                  when 'n' then 'not_null'
                  else k.contype::text
                end || ']'
              from pg_constraint k
              join pg_class c on c.oid = k.conrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'trigger',
                n.nspname || '.' || c.relname || '/' || t.tgname
              from pg_trigger t
              join pg_class c on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
                and not t.tgisinternal
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'policy',
                n.nspname || '.' || c.relname || '/' || p.polname
              from pg_policy p
              join pg_class c on c.oid = p.polrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'rls',
                n.nspname || '.' || c.relname || '=' ||
                case
                  when c.relforcerowsecurity then 'forced'
                  when c.relrowsecurity then 'enabled'
                  else 'disabled'
                end
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public', 'private')
                and c.relkind in ('r', 'p')
              order by 2;
            "
            psql "$DB_URL" -At -F '|' -c "
              select 'bucket', 'storage.' || id
              from storage.buckets
              order by id;
            "
          } | node scripts/auditVerticalParity.mjs --database-inventory -

      - name: Conferir o lint do banco
        run: npx --yes supabase@2.109.1 db lint --local --level warning --fail-on warning

      - name: Executar testes pgTAP
        run: npx --yes supabase@2.109.1 test db

      - name: Testar concorrência real dos pedidos de workspace
        shell: bash
        run: |
          command -v psql
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          export ARALEARN_TEST_DATABASE_URL="$DB_URL"
          node --test ./tests/runtime/workspace-postgres-concurrency.test.js

      # A jornada conserva um owner técnico da stack local. A fixture seguinte
      # usa essa autoridade para conceder somente o papel editorial necessário.
      - name: Testar jornada real da Custom GPT Action
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          npm run test:authoring:action:local

      - name: Publicar fixture oficial temporária para smoke
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          export ARALEARN_SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          publisher="$(
            node ./supabase/tests/prepare-local-catalog-publisher.mjs
          )"
          publisher_id="$(jq -erR 'select(test("^[0-9a-f-]{36}$"))' <<<"$publisher")"
          export ARALEARN_CATALOG_OWNER_ID="$publisher_id"
          node ./scripts/publishCatalogFixtures.mjs --publish --course fundamentos-ia-analise-dados-seed-course.json

      - name: Testar Auth, PostgREST, RPCs e RLS
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          npm run test:supabase:smoke

      - name: Testar confirmação e recuperação por e-mail
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          node ./supabase/tests/auth-email-smoke.mjs

      - name: Servir e testar o gateway MCP de autoria
        shell: bash
        run: |
          set -a
          eval "$(npx --yes supabase@2.109.1 status -o env)"
          set +a
          npx --yes supabase@2.109.1 functions serve aralearn-authoring-mcp --no-verify-jwt > /tmp/aralearn-mcp.log 2>&1 &
          MCP_PID=$!
          cleanup_mcp() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Log do gateway MCP"
              tail -n 400 /tmp/aralearn-mcp.log \
                | sed -E 's/(eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.)[A-Za-z0-9_-]+/[credencial JWT omitida]/g'
              echo "::endgroup::"
            fi
            kill "$MCP_PID" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup_mcp EXIT
          MCP_METADATA_URL='http://127.0.0.1:54321/functions/v1/aralearn-authoring-mcp/.well-known/oauth-protected-resource'
          MCP_READY=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --output /dev/null \
              "$MCP_METADATA_URL"; then
              MCP_READY=true
              break
            fi
            if ! kill -0 "$MCP_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$MCP_READY" != true ]; then
            echo "O endpoint de metadata OAuth do MCP não ficou pronto após 60 tentativas." >&2
            exit 1
          fi
          npm run test:authoring:mcp:local:oauth

      - name: Encerrar stack Supabase
        if: always()
        run: npx --yes supabase@2.109.1 stop --no-backup
