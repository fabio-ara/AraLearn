name: Validar repositório

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
  workflow_dispatch:

jobs:
  validacao:
    name: Testar e validar
    runs-on: windows-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Analisar código
        run: npm run lint

      - name: Instalar Chromium para testes de interface
        run: npx playwright install chromium

      - name: Gerar e testar o artefato web no navegador
        run: npm run test:e2e

      - name: Compilar aplicativo Android
        run: npm run android:debug

      - name: Validar exemplo público
        run: npm run validate:example
