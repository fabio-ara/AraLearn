name: Publicar Android

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - android/app/build.gradle.kts
      - src/**
      - public/**
      - scripts/**
      - .github/workflows/android-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Gerar e publicar APK
    runs-on: windows-latest
    env:
      ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
      ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
      ARALEARN_ASSIST_ALLOWED_ORIGINS: ${{ vars.ARALEARN_ASSIST_ALLOWED_ORIGINS }}
      ARALEARN_ANDROID_KEYSTORE_BASE64: ${{ secrets.ARALEARN_ANDROID_KEYSTORE_BASE64 }}
      ARALEARN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ARALEARN_ANDROID_KEYSTORE_PASSWORD }}
      ARALEARN_ANDROID_KEY_ALIAS: ${{ secrets.ARALEARN_ANDROID_KEY_ALIAS }}
      ARALEARN_ANDROID_KEY_PASSWORD: ${{ secrets.ARALEARN_ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Ler identidade da release
        id: identity
        shell: pwsh
        run: |
          $package = Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json
          $gradle = Get-Content -Raw -Encoding UTF8 android/app/build.gradle.kts
          $versionNameMatch = [regex]::Match($gradle, 'versionName\s*=\s*"([^"]+)"')
          $versionCodeMatch = [regex]::Match($gradle, 'versionCode\s*=\s*(\d+)')
          if (-not $versionNameMatch.Success -or -not $versionCodeMatch.Success) {
            throw 'Não foi possível determinar versionName/versionCode do Android.'
          }
          $version = [string]$package.version
          $versionName = $versionNameMatch.Groups[1].Value
          $versionCode = $versionCodeMatch.Groups[1].Value
          if ($versionName -cne $version) {
            throw "package.json ($version) e Android ($versionName) estão divergentes."
          }
          $tag = "v$version"
          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          if (-not $exists) {
            $global:LASTEXITCODE = 0
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "version_code=$versionCode" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$((-not $exists).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Conferir configuração de assinatura
        if: steps.identity.outputs.publish == 'true'
        shell: pwsh
        run: |
          $required = @(
            'ARALEARN_ANDROID_KEYSTORE_BASE64',
            'ARALEARN_ANDROID_KEYSTORE_PASSWORD',
            'ARALEARN_ANDROID_KEY_ALIAS',
            'ARALEARN_ANDROID_KEY_PASSWORD'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([string][Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "A release Android exige a identidade histórica em Secrets: $($missing -join ', ')."
          }
          if (-not $env:ARALEARN_SUPABASE_URL -or -not $env:ARALEARN_SUPABASE_PUBLISHABLE_KEY) {
            throw 'A release Android exige ARALEARN_SUPABASE_URL e ARALEARN_SUPABASE_PUBLISHABLE_KEY nas Variables do repositório.'
          }

      - name: Restaurar keystore protegida
        if: steps.identity.outputs.publish == 'true'
        shell: pwsh
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP 'aralearn-release.jks'
          try {
            $encoded = ($env:ARALEARN_ANDROID_KEYSTORE_BASE64 -replace '\s', '')
            [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($encoded))
          }
          catch {
            throw 'ARALEARN_ANDROID_KEYSTORE_BASE64 não contém uma keystore Base64 válida.'
          }
          "ARALEARN_ANDROID_KEYSTORE_PATH=$keystorePath" >> $env:GITHUB_ENV

      - name: Validar código antes da release
        if: steps.identity.outputs.publish == 'true'
        run: |
          npm test
          npm run lint

      - name: Compilar APK de release
        if: steps.identity.outputs.publish == 'true'
        run: npm run android:release

      - name: Conferir identidade e certificado do APK
        if: steps.identity.outputs.publish == 'true'
        shell: pwsh
        run: |
          $apk = Resolve-Path 'android/app/build/outputs/apk/release/app-release.apk'
          $buildTools = Get-ChildItem -LiteralPath (Join-Path $env:ANDROID_HOME 'build-tools') -Directory |
            Sort-Object { try { [version]$_.Name } catch { [version]'0.0' } } -Descending |
            Select-Object -First 1
          if (-not $buildTools) { throw 'Android build-tools não encontrado.' }
          $aapt = Join-Path $buildTools.FullName 'aapt.exe'
          $apksigner = Join-Path $buildTools.FullName 'apksigner.bat'
          if (-not (Test-Path $aapt) -or -not (Test-Path $apksigner)) {
            throw 'aapt/apksigner não encontrados.'
          }
          $badging = (& $aapt dump badging $apk) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'aapt não conseguiu ler o APK.' }
          $package = [regex]::Match(
            $badging,
            "package:\s+name='([^']+)'[^\r\n]*versionCode='([^']+)'[^\r\n]*versionName='([^']+)'"
          )
          if (-not $package.Success) { throw 'Identidade do APK não pôde ser determinada.' }
          if ($package.Groups[1].Value -cne 'com.aralearn.app') {
            throw "applicationId inesperado: $($package.Groups[1].Value)."
          }
          if ($package.Groups[2].Value -cne '${{ steps.identity.outputs.version_code }}') {
            throw "versionCode inesperado: $($package.Groups[2].Value)."
          }
          if ($package.Groups[3].Value -cne '${{ steps.identity.outputs.version }}') {
            throw "versionName inesperado: $($package.Groups[3].Value)."
          }
          $signature = (& $apksigner verify --verbose --print-certs $apk) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'A assinatura do APK é inválida.' }
          $certificate = [regex]::Match(
            $signature,
            '(?im)^Signer #1 certificate SHA-256 digest:\s*([a-f0-9:]+)\s*$'
          )
          $actual = $certificate.Groups[1].Value.Replace(':', '').ToLowerInvariant()
          $expected = 'c3d2ad6c97e44492c09d785d2d5e9f461eb6399914b196119e2cba0e5d271296'
          if (-not $certificate.Success -or $actual -cne $expected) {
            throw 'O APK não usa o certificado histórico necessário para atualizar instalações existentes.'
          }

      - name: Preparar asset da release
        if: steps.identity.outputs.publish == 'true'
        shell: pwsh
        run: |
          $source = 'android/app/build/outputs/apk/release/app-release.apk'
          $destination = "AraLearn-${{ steps.identity.outputs.version }}.apk"
          Copy-Item -LiteralPath $source -Destination $destination -Force
          "ARALEARN_RELEASE_APK=$destination" >> $env:GITHUB_ENV

      - name: Publicar GitHub Release
        if: steps.identity.outputs.publish == 'true'
        shell: pwsh
        run: |
          @"
          ## AraLearn ${{ steps.identity.outputs.version }}

          - Android versionCode ${{ steps.identity.outputs.version_code }}.
          - Inclui a compatibilidade para materialização de revisões publicadas legadas.
          - O APK foi verificado contra o certificado histórico antes da publicação.
          "@ | Set-Content -Encoding UTF8 release-notes.md
          & gh release create '${{ steps.identity.outputs.tag }}' $env:ARALEARN_RELEASE_APK `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'AraLearn ${{ steps.identity.outputs.version }}' `
            --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar a GitHub Release.' }

      - name: Release já existente
        if: steps.identity.outputs.publish != 'true'
        shell: pwsh
        run: Write-Host 'A release ${{ steps.identity.outputs.tag }} já existe; nenhuma publicação foi repetida.'
