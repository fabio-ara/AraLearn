name: Preparar Android da promoção

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      promotion_artifact_id:
        required: true
        type: string
    secrets:
      ARALEARN_ANDROID_KEYSTORE_BASE64:
        required: true
      ARALEARN_ANDROID_KEYSTORE_PASSWORD:
        required: true
      ARALEARN_ANDROID_KEY_ALIAS:
        required: true
      ARALEARN_ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  android:
    name: Conferir e preparar APK assinado
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
      ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Baixar revisão integrada
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Baixar manifesto da promoção confiável
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.promotion_artifact_id }}
          merge-multiple: true
          path: .
      - name: Recuperar APK já preparado
        id: reuse
        run: node ./scripts/releaseCandidate.mjs reuse-apk
      - name: Instalar dependências fixadas
        if: steps.reuse.outputs.reused != 'true'
        run: npm ci
      - name: Restaurar assinatura histórica
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        env:
          ARALEARN_ANDROID_KEYSTORE_BASE64: ${{ secrets.ARALEARN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:ARALEARN_ANDROID_KEYSTORE_BASE64) { throw 'Keystore histórica ausente.' }
          $keystorePath = Join-Path $env:RUNNER_TEMP 'aralearn-release.jks'
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String(($env:ARALEARN_ANDROID_KEYSTORE_BASE64 -replace '\s', '')))
          "ARALEARN_ANDROID_KEYSTORE_PATH=$keystorePath" >> $env:GITHUB_ENV
      - name: Compilar APK de release
        if: steps.reuse.outputs.reused != 'true'
        env:
          ARALEARN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ARALEARN_ANDROID_KEYSTORE_PASSWORD }}
          ARALEARN_ANDROID_KEY_ALIAS: ${{ secrets.ARALEARN_ANDROID_KEY_ALIAS }}
          ARALEARN_ANDROID_KEY_PASSWORD: ${{ secrets.ARALEARN_ANDROID_KEY_PASSWORD }}
        run: pwsh -NoProfile -File ./scripts/buildAndroidRelease.ps1 -RequireExplicitConfiguration
      - name: Selecionar APK preparado
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        run: Copy-Item -LiteralPath android/app/build/outputs/apk/release/app-release.apk -Destination "AraLearn-$env:RELEASE_VERSION.apk"
      - name: Conferir identidade, certificado e configuração do APK
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/verifyDeploymentArtifacts.ps1 -Target Android -ArtifactPath "AraLearn-$env:RELEASE_VERSION.apk" -RequireRuntimeConfig
      - name: Guardar APK, checksum e manifesto na Release em rascunho
        shell: pwsh
        run: node ./scripts/releaseCandidate.mjs stage-release "AraLearn-$env:RELEASE_VERSION.apk"
      - name: Remover material temporário de assinatura
        if: ${{ always() }}
        shell: pwsh
        run: |
          $keystorePath = Join-Path $env:RUNNER_TEMP 'aralearn-release.jks'
          if (Test-Path -LiteralPath $keystorePath) { Remove-Item -LiteralPath $keystorePath -Force }
