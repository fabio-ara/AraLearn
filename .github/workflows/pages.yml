name: Publicar site

on:
  workflow_run:
    workflows:
      - Validar repositório
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ (((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')) && 'publish') || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar artefato
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: windows-latest
    env:
      ARALEARN_PAGES_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
      ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          ref: ${{ env.ARALEARN_PAGES_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirmar validação da revisão
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'O token do GitHub está ausente; a validação da revisão não pode ser confirmada.'
          }
          $headSha = [Uri]::EscapeDataString($env:ARALEARN_PAGES_SHA)
          $runsUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/validacao.yml/runs?branch=main&event=push&head_sha=$headSha&per_page=100"
          try {
            $runs = Invoke-RestMethod -Method Get -Uri $runsUrl -Headers @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GH_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
            }
          }
          catch {
            throw 'Não foi possível consultar a validação da revisão no GitHub.'
          }
          $approved = @($runs.workflow_runs | Where-Object {
            [string]$_.head_sha -ceq $env:ARALEARN_PAGES_SHA -and
            [string]$_.head_branch -ceq 'main' -and
            [string]$_.event -ceq 'push' -and
            [string]$_.status -ceq 'completed' -and
            [string]$_.conclusion -ceq 'success'
          })
          if ($approved.Count -lt 1) {
            throw "A revisão $env:ARALEARN_PAGES_SHA ainda não tem uma validação completa e bem-sucedida de main."
          }

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Validar configuração pública do Supabase
        shell: pwsh
        run: |
          if (-not $env:ARALEARN_SUPABASE_URL -or -not $env:ARALEARN_SUPABASE_PUBLISHABLE_KEY) {
            throw "Defina ARALEARN_SUPABASE_URL e ARALEARN_SUPABASE_PUBLISHABLE_KEY em Settings > Secrets and variables > Actions > Variables."
          }

      - name: Confirmar migrations compatíveis no projeto hospedado
        run: npm run deployment:verify-hosted

      - name: Gerar o artefato aprovado
        run: npm run pages:build

      - name: Conferir configuração e segurança do artefato
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\scripts\verifyDeploymentArtifacts.ps1
          -Target Pages -RequireRuntimeConfig

      - name: Validar exemplo público
        run: npm run validate:example

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    env:
      ARALEARN_PAGES_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Baixar o verificador publicado
        uses: actions/checkout@v7
        with:
          ref: ${{ env.ARALEARN_PAGES_SHA }}
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Conferir o endereço publicado
        run: node ./scripts/verifyPublishedSite.mjs --url "${{ steps.deployment.outputs.page_url }}"
