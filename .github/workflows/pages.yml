name: Publicar site

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**/*.md"
      - "docs/**/*.bib"
      - "docs/evidence/registro-buscas-bibliograficas.csv"
      - "ux-atlas/**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'publish') || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Gerar artefato
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
          github.event_name == 'push' }}
    runs-on: windows-latest
    env:
      ARALEARN_PAGES_SHA: ${{ github.sha }}
      ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
      ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          ref: ${{ env.ARALEARN_PAGES_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Validar configuração pública do Supabase
        shell: pwsh
        run: |
          if (-not $env:ARALEARN_SUPABASE_URL -or -not $env:ARALEARN_SUPABASE_PUBLISHABLE_KEY) {
            throw "Defina ARALEARN_SUPABASE_URL e ARALEARN_SUPABASE_PUBLISHABLE_KEY em Settings > Secrets and variables > Actions > Variables."
          }

      - name: Confirmar migrations compatíveis no projeto hospedado
        run: npm run deployment:verify-hosted

      - name: Gerar o artefato aprovado
        run: npm run pages:build

      - name: Conferir configuração e segurança do artefato
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\scripts\verifyDeploymentArtifacts.ps1
          -Target Pages -RequireRuntimeConfig

      - name: Validar exemplo público
        run: npm run validate:example

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    env:
      ARALEARN_PAGES_SHA: ${{ github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Baixar o verificador publicado
        uses: actions/checkout@v7
        with:
          ref: ${{ env.ARALEARN_PAGES_SHA }}
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Conferir o endereço publicado
        run: node ./scripts/verifyPublishedSite.mjs --url "${{ steps.deployment.outputs.page_url }}"
