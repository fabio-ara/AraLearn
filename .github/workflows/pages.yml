name: Publicar site

on:
  workflow_run:
    workflows:
      - Validar repositório
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Gerar artefato
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: windows-latest
    env:
      ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
      ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
      ARALEARN_ASSIST_ALLOWED_ORIGINS: ${{ vars.ARALEARN_ASSIST_ALLOWED_ORIGINS }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Validar configuração pública do Supabase
        shell: pwsh
        run: |
          if (-not $env:ARALEARN_SUPABASE_URL -or -not $env:ARALEARN_SUPABASE_PUBLISHABLE_KEY) {
            throw "Defina ARALEARN_SUPABASE_URL e ARALEARN_SUPABASE_PUBLISHABLE_KEY em Settings > Secrets and variables > Actions > Variables."
          }

      - name: Confirmar migrations compatíveis no projeto hospedado
        run: npm run deployment:verify-hosted

      - name: Validar testes
        run: npm test

      - name: Analisar código
        run: npm run lint

      - name: Validar corte relacional e fixtures
        run: |
          npm run validate:cutover
          npm run catalog:validate

      - name: Instalar Chromium para testes de interface
        run: npx playwright install chromium

      - name: Gerar e testar o artefato no navegador
        run: npm run test:e2e

      - name: Conferir configuração e segurança do artefato
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\scripts\verifyDeploymentArtifacts.ps1
          -Target Pages -RequireRuntimeConfig

      - name: Validar exemplo público
        run: npm run validate:example

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Baixar o verificador publicado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir o endereço publicado
        run: node ./scripts/verifyPublishedSite.mjs --url "${{ steps.deployment.outputs.page_url }}"
