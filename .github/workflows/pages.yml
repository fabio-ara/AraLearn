name: Publicar produto

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Preparar artefatos, publicar site após corte ou finalizar após provas reais
        required: true
        type: choice
        default: preparar
        options: [preparar, publicar_site, finalizar_release]
      candidate_run_id:
        description: Run integral aprovado da candidata integrada
        required: false
        type: string
      candidate_run_attempt:
        description: Tentativa exata do run integral
        required: false
        type: string
      promotion_run_id:
        description: Run concluído de preparar (site) ou publicar_site (finalização)
        required: false
        type: string
      promotion_run_attempt:
        description: Tentativa exata daquele run de promoção
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aralearn-product-promotion
  cancel-in-progress: false

jobs:
  candidate:
    name: Conferir candidata integrada
    if: github.ref == 'refs/heads/main' && inputs.phase == 'preparar'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      promotion_artifact_id: ${{ steps.promotion.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
      ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Baixar revisão de promoção
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verificar run, árvore, configuração e digests
        id: candidate
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        shell: pwsh
        run: node ./scripts/releaseCandidate.mjs prepare $env:CANDIDATE_RUN_ID $env:CANDIDATE_RUN_ATTEMPT
      - name: Conferir configuração e segurança do site aprovado
        run: pwsh -NoProfile -File ./scripts/verifyDeploymentArtifacts.ps1 -Target Pages -RequireRuntimeConfig
      - name: Guardar artefatos exatos da promoção
        id: promotion
        uses: actions/upload-artifact@v4
        with:
          name: aralearn-promotion-${{ github.run_attempt }}
          path: |
            .candidate/candidate.json
            .pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  android:
    name: Preparar Android
    needs: candidate
    permissions:
      contents: read
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ needs.candidate.outputs.version }}
      promotion_artifact_id: ${{ needs.candidate.outputs.promotion_artifact_id }}
    secrets:
      ARALEARN_ANDROID_KEYSTORE_BASE64: ${{ secrets.ARALEARN_ANDROID_KEYSTORE_BASE64 }}
      ARALEARN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ARALEARN_ANDROID_KEYSTORE_PASSWORD }}
      ARALEARN_ANDROID_KEY_ALIAS: ${{ secrets.ARALEARN_ANDROID_KEY_ALIAS }}
      ARALEARN_ANDROID_KEY_PASSWORD: ${{ secrets.ARALEARN_ANDROID_KEY_PASSWORD }}

  android-native:
    name: Instalar e atualizar APK assinado
    needs: [candidate, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      proof_artifact_id: ${{ steps.proof.outputs.artifact-id }}
      proof_sha256: ${{ steps.native.outputs.proof_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
      ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Baixar revisão integrada
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Preparar Java do SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Baixar manifesto aprovado
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.candidate.outputs.promotion_artifact_id }}
          merge-multiple: true
          path: .
      - name: Baixar APK assinado e recibo exatos
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.android.outputs.artifact_id }}
          merge-multiple: true
          path: .candidate/android-release
      - name: Reconfirmar promoção atual
        run: node ./scripts/releaseCandidate.mjs current
      - name: Preparar biblioteca nativa exigida pelo emulador
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
          ldconfig -p | grep -F 'libpulse.so.0'
      - name: Acessar somente KVM já disponível
        shell: bash
        run: |
          test -c /dev/kvm || { echo 'INEVITABLE: runner sem KVM; gate recusado.' >&2; exit 1; }
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Provar instalação e upgrade sem conta
        id: native
        run: python3 ./scripts/androidNativeGate.py run --candidate-folder .candidate/android-release --folder "${{ runner.temp }}/aralearn-native-proof"
      - name: Guardar prova nativa e capturas sintéticas
        id: proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aralearn-android-native-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aralearn-native-proof/
          if-no-files-found: warn
          retention-days: 7

  pages:
    name: Publicar Pages aprovado
    if: github.ref == 'refs/heads/main' && inputs.phase == 'publicar_site'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://fabio-ara.github.io/AraLearn/
    env:
      GH_TOKEN: ${{ github.token }}
      ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
      ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Baixar revisão integrada
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Recuperar preparação comprovada pela origem e pelos digests
        id: preparation
        env:
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_run_attempt }}
        run: node ./scripts/releaseCandidate.mjs resume-preparation "$PROMOTION_RUN_ID" "$PROMOTION_RUN_ATTEMPT"
      - name: Reconfirmar revisão e artefato antes de publicar
        run: |
          node ./scripts/releaseCandidate.mjs current
          node ./scripts/releaseCandidate.mjs verify-pages
      - name: Conferir instalação antes de Pages
        env:
          PROOF_SHA256: ${{ steps.preparation.outputs.proof_sha256 }}
          SOURCE_RUN_ID: ${{ steps.preparation.outputs.preparation_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.preparation.outputs.preparation_run_attempt }}
        run: python3 ./scripts/androidNativeGate.py verify --candidate-folder .candidate/android-release --folder .candidate/android-native --proof-sha256 "$PROOF_SHA256" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Conferir backend hospedado depois do corte
        run: node ./scripts/releaseCandidate.mjs verify-backend
      - name: Reconhecer site já publicado
        id: site
        run: node ./scripts/releaseCandidate.mjs site-current
      - name: Configurar Pages
        if: steps.site.outputs.site_current != 'true'
        uses: actions/configure-pages@v5
      - name: Enviar artefato Pages
        if: steps.site.outputs.site_current != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Publicar no GitHub Pages
        if: steps.site.outputs.site_current != 'true'
        uses: actions/deploy-pages@v4
      - name: Conferir bytes efetivamente publicados
        run: node ./scripts/verifyPublishedSite.mjs --url https://fabio-ara.github.io/AraLearn/ --candidate-manifest .candidate/candidate.json
      - name: Guardar os mesmos bytes na Release em rascunho
        env:
          RELEASE_VERSION: ${{ steps.preparation.outputs.version }}
        run: node ./scripts/releaseCandidate.mjs stage-release ".candidate/android-release/AraLearn-$RELEASE_VERSION.apk"
      - name: Registrar promoção do site sem finalizar a Release
        run: node ./scripts/releaseCandidate.mjs record-site-promotion
      - name: Guardar origem e prova do corte
        uses: actions/upload-artifact@v4
        with:
          name: aralearn-site-promotion-${{ github.run_attempt }}
          path: .candidate/site-promotion/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Concluir publicação do produto
    if: github.ref == 'refs/heads/main' && inputs.phase == 'finalizar_release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ARALEARN_SUPABASE_URL: ${{ vars.ARALEARN_SUPABASE_URL }}
      ARALEARN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ARALEARN_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Baixar revisão integrada
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Recuperar site e preparação originais comprovados
        id: preparation
        env:
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_run_attempt }}
        run: node ./scripts/releaseCandidate.mjs resume-site "$PROMOTION_RUN_ID" "$PROMOTION_RUN_ATTEMPT"
      - name: Reconfirmar prova nativa antes da Release
        env:
          PROOF_SHA256: ${{ steps.preparation.outputs.proof_sha256 }}
          SOURCE_RUN_ID: ${{ steps.preparation.outputs.preparation_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.preparation.outputs.preparation_run_attempt }}
        run: python3 ./scripts/androidNativeGate.py verify --candidate-folder .candidate/android-release --folder .candidate/android-native --proof-sha256 "$PROOF_SHA256" --source-run-id "$SOURCE_RUN_ID" --source-run-attempt "$SOURCE_RUN_ATTEMPT"
      - name: Verificar partes e tornar a Release pública
        run: node ./scripts/releaseCandidate.mjs finalize-release
