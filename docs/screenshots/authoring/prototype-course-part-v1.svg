<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Protótipo conceitual de Curso e Parte em celular e desktop</title>
  <desc id="description">À esquerda, um celular mostra um curso vivo com nove Partes planejadas e a Parte sete em produção. À direita, a mesma informação aparece em desktop, com uma barra lateral curta, lista de Partes e inspeção dos itens materializados.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1a2a44" flood-opacity="0.12"/>
    </filter>
    <style>
      .frame { fill: #f5f7fa; stroke: #cbd5e1; stroke-width: 2; }
      .surface { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.5; }
      .soft { fill: #eaf1ff; }
      .active { fill: #155bd7; }
      .ink { fill: #111827; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #536174; font-family: Inter, Arial, sans-serif; }
      .blue { fill: #155bd7; font-family: Inter, Arial, sans-serif; }
      .line { stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .blue-line { stroke: #155bd7; stroke-width: 3; stroke-linecap: round; fill: none; }
      .small { font-size: 14px; }
      .body { font-size: 16px; }
      .label { font-size: 17px; font-weight: 600; }
      .heading { font-size: 24px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#eef2f7"/>

  <text x="28" y="28" class="muted small">Protótipo conceitual · vocabulário ainda sujeito à auditoria terminológica</text>

  <!-- Celular -->
  <rect x="28" y="44" width="354" height="688" rx="34" class="frame" filter="url(#shadow)"/>
  <rect x="149" y="56" width="112" height="7" rx="3.5" fill="#cbd5e1"/>
  <path d="M62 97h24M62 97l10-10M62 97l10 10" class="line"/>
  <text x="205" y="104" text-anchor="middle" class="ink heading">Teoria dos Grafos</text>
  <circle cx="348" cy="97" r="19" class="surface"/>
  <circle cx="348" cy="92" r="5" fill="#64748b"/>
  <path d="M338 105c2-7 18-7 20 0" class="line"/>

  <rect x="50" y="131" width="310" height="92" rx="22" class="surface"/>
  <text x="70" y="160" class="ink label">Curso vivo</text>
  <text x="70" y="184" class="muted body">9 Partes planejadas · 6 concluídas</text>
  <rect x="70" y="199" width="270" height="8" rx="4" fill="#dbe3ed"/>
  <rect x="70" y="199" width="180" height="8" rx="4" class="active"/>

  <text x="52" y="258" class="ink heading">Partes</text>
  <rect x="50" y="276" width="310" height="64" rx="18" class="surface"/>
  <circle cx="78" cy="308" r="12" fill="#dff4e6"/>
  <path d="M72 308l4 4 8-9" stroke="#197a3c" stroke-width="2.5" fill="none"/>
  <text x="102" y="304" class="ink label">Parte 6</text>
  <text x="102" y="326" class="muted small">concluída · 11 itens</text>

  <rect x="50" y="352" width="310" height="106" rx="20" class="soft" stroke="#155bd7" stroke-width="2"/>
  <circle cx="78" cy="384" r="12" class="active"/>
  <path d="M72 384h12" stroke="#ffffff" stroke-width="2.5"/>
  <text x="102" y="380" class="ink label">Parte 7</text>
  <text x="102" y="402" class="blue small">em produção · 8 de 12 itens</text>
  <text x="70" y="435" class="muted small">2 microssequências · planejamento editável</text>
  <path d="M330 395l9 9-9 9" class="blue-line"/>

  <rect x="50" y="470" width="310" height="64" rx="18" class="surface"/>
  <circle cx="78" cy="502" r="12" fill="#eef2f7"/>
  <text x="74" y="507" class="muted body">8</text>
  <text x="102" y="498" class="ink label">Parte 8</text>
  <text x="102" y="520" class="muted small">planejada · ainda não iniciada</text>

  <rect x="50" y="551" width="310" height="78" rx="20" class="surface"/>
  <text x="70" y="579" class="ink label">O planejamento mudou?</text>
  <text x="70" y="603" class="muted small">Partes e escopo continuam editáveis.</text>
  <rect x="267" y="569" width="72" height="36" rx="18" class="active"/>
  <text x="303" y="592" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Editar</text>

  <rect x="50" y="650" width="310" height="60" rx="22" fill="#e6ebf2"/>
  <circle cx="92" cy="675" r="17" class="active"/>
  <path d="M84 674h16M84 680h12M84 668h10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="92" y="702" text-anchor="middle" class="blue small">Curso</text>
  <circle cx="171" cy="675" r="17" class="surface"/>
  <path d="M163 675h16M171 667v16" class="line"/>
  <circle cx="250" cy="675" r="17" class="surface"/>
  <path d="M243 681l14-14M244 669h12v12" class="line"/>
  <circle cx="329" cy="675" r="17" class="surface"/>
  <path d="M321 679c7-11 11-11 16 0M325 669h8" class="line"/>

  <!-- Desktop -->
  <rect x="414" y="44" width="758" height="688" rx="22" class="frame" filter="url(#shadow)"/>
  <rect x="414" y="44" width="88" height="688" rx="22" fill="#e6ebf2"/>
  <circle cx="458" cy="90" r="22" class="active"/>
  <path d="M448 87h20M448 94h16M448 80h12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="458" y="125" text-anchor="middle" class="blue small">Curso</text>
  <circle cx="458" cy="170" r="20" class="surface"/>
  <path d="M449 170h18M458 161v18" class="line"/>
  <text x="458" y="202" text-anchor="middle" class="muted small">Plano</text>
  <circle cx="458" cy="247" r="20" class="surface"/>
  <path d="M449 252l18-18M450 236h15v15" class="line"/>
  <text x="458" y="279" text-anchor="middle" class="muted small">Fontes</text>
  <circle cx="458" cy="324" r="20" class="surface"/>
  <path d="M449 330v-11M458 330v-20M467 330v-15" class="line"/>
  <text x="458" y="356" text-anchor="middle" class="muted small">Análise</text>

  <text x="534" y="91" class="ink heading">Teoria dos Grafos</text>
  <text x="534" y="118" class="muted body">O mesmo curso durante planejamento, produção, estudo e revisão</text>
  <rect x="1054" y="72" width="86" height="38" rx="19" class="active"/>
  <text x="1097" y="96" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">Editar plano</text>

  <rect x="526" y="144" width="240" height="550" rx="20" class="surface"/>
  <text x="550" y="178" class="ink label">9 Partes</text>
  <text x="550" y="201" class="muted small">6 concluídas · 1 em produção</text>
  <rect x="550" y="219" width="192" height="54" rx="15" class="surface"/>
  <text x="568" y="243" class="ink body">Parte 6</text>
  <text x="568" y="261" class="muted small">concluída · 11 itens</text>
  <rect x="550" y="285" width="192" height="78" rx="16" class="soft" stroke="#155bd7" stroke-width="2"/>
  <text x="568" y="312" class="ink label">Parte 7</text>
  <text x="568" y="334" class="blue small">8 de 12 itens</text>
  <text x="568" y="352" class="muted small">em produção</text>
  <rect x="550" y="375" width="192" height="54" rx="15" class="surface"/>
  <text x="568" y="399" class="ink body">Parte 8</text>
  <text x="568" y="417" class="muted small">planejada</text>

  <text x="798" y="178" class="ink heading">Parte 7</text>
  <text x="798" y="202" class="muted body">Prática e interpretação de grafos</text>
  <rect x="798" y="220" width="342" height="58" rx="17" class="surface"/>
  <text x="818" y="245" class="ink label">Escopo desta produção</text>
  <text x="818" y="265" class="muted small">2 microssequências · 12 itens previstos</text>

  <text x="798" y="312" class="ink label">Materialização</text>
  <rect x="798" y="330" width="342" height="94" rx="18" class="surface"/>
  <rect x="814" y="346" width="6" height="62" rx="3" fill="#155bd7"/>
  <text x="836" y="369" class="ink label">Adjacência e incidência</text>
  <text x="836" y="393" class="muted small">4 itens prontos · 1 observação aberta</text>
  <circle cx="1110" cy="377" r="14" class="soft"/>
  <path d="M1104 374h12M1104 379h8" class="blue-line"/>

  <rect x="798" y="438" width="342" height="94" rx="18" class="surface"/>
  <rect x="814" y="454" width="6" height="62" rx="3" fill="#155bd7"/>
  <text x="836" y="477" class="ink label">Representações de grafos</text>
  <text x="836" y="501" class="muted small">4 itens prontos · fontes vinculadas</text>

  <rect x="798" y="548" width="342" height="112" rx="18" class="soft"/>
  <text x="818" y="578" class="ink label">O que a Parte resolve</text>
  <text x="818" y="603" class="muted small">Produz um lote coerente em uma iteração,</text>
  <text x="818" y="624" class="muted small">sem tornar seu tamanho uma regra fixa.</text>
  <text x="818" y="647" class="blue small">O planejamento permanece editável.</text>
</svg>
