openapi: 3.1.0
info:
  title: "AraLearn Authoring API: perfil editorial"
  version: 1.0.0
  description: Cria, produz, revisa, valida e publica cursos AraLearn por partes.
  license:
    name: MIT
    url: https://github.com/fabio-ara/AraLearn/blob/main/LICENSE.md
servers:
  - url: https://seu-projeto.supabase.co
security:
  - AuthoringApiKey: []
paths:
  /functions/v1/aralearn-authoring-api/v1/contracts/resources:
    get:
      operationId: listarRecursosDeCard
      summary: Lista os recursos de card disponíveis
      description: Devolve a finalidade didática, as operações, os exercícios e os alvos de lacuna de cada recurso da linguagem autoral formal.
      x-openai-isConsequential: false
      responses:
        "200":
          description: Operação concluída ou repetição idempotente confirmada.
        "401":
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
        default:
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
  /functions/v1/aralearn-authoring-api/v1/contracts/resources/{resource}:
    get:
      operationId: consultarRecursoDeCard
      summary: Consulta a linguagem formal de um recurso
      description: Devolve campos, regras, alvos de lacuna e exemplo válido. Marcadores {gap:id} identificam campos formais; texto livre nunca identifica o alvo.
      x-openai-isConsequential: false
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum:
              - paragraph
              - choice
              - composite
              - code
              - table
              - flow
              - tree
              - graph
              - relation_map
              - matrix
              - plane
              - formula
      responses:
        "200":
          description: Operação concluída ou repetição idempotente confirmada.
        "404":
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
        default:
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
  /functions/v1/aralearn-authoring-api/v1/runs:
    get:
      operationId: listarExecucoesDeAutoria
      summary: Lista execuções recentes do autor
      x-openai-isConsequential: false
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: beforeUpdatedAt
          in: query
          schema:
            type: string
            format: date-time
        - name: beforeRunId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operação concluída ou repetição idempotente confirmada.
        "400":
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
        default:
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
    post:
      operationId: criarExecucaoDeAutoria
      summary: Cria uma execução de autoria
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - requestId
                - target
                - title
                - contractKey
                - brief
                - publicationIntent
              properties:
                requestId:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
                  description: Identificador idempotente, novo para cada intenção do cliente.
                target:
                  type: string
                  enum:
                    - catalog
                  description: catalog exige permissão editorial; private pertence somente ao autor. Atualizações exigem a revisão-base vigente.
                title:
                  type: string
                  minLength: 1
                  maxLength: 300
                  pattern: \S
                contractKey:
                  type: string
                  minLength: 1
                  maxLength: 240
                collectionId:
                  type:
                    - string
                    - "null"
                  format: uuid
                brief:
                  type: object
                  additionalProperties: true
                  properties: {}
                publicationIntent:
                  type: object
                  additionalProperties: false
                  required:
                    - mode
                  properties:
                    mode:
                      type: string
                      enum:
                        - create
                        - update
                    existingCourseId:
                      type: string
                      format: uuid
                    expectedContentHash:
                      type: string
                      pattern: ^[a-f0-9]{64}$
                  allOf:
                    - if:
                        properties:
                          mode:
                            const: update
                        required:
                          - mode
                      then:
                        required:
                          - existingCourseId
                          - expectedContentHash
      responses:
        "200":
          description: Operação concluída ou repetição idempotente confirmada.
        "400":
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
        default:
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}:
    get:
      operationId: consultarExecucaoDeAutoria
      summary: Consulta a execução e suas partes
      x-openai-isConsequential: false
      responses:
        "200":
          description: Operação concluída ou repetição idempotente confirmada.
        "400":
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
        default:
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}/plan:
    put:
      operationId: gravarPlanoDeAutoria
      summary: Grava o plano e a ordem das partes
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - requestId
                - plan
              properties:
                requestId:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
                  description: Identificador idempotente, novo para cada intenção do cliente.
                plan:
                  type: object
                  description: Plano compacto de até 96 KiB para clientes por chave. O registro e as especificações detalhadas seguem em chamadas separadas.
                  required:
                    - artifact
                    - version
                    - runId
                    - project
                    - ledgerManifest
                    - course
                    - learningOutcomes
                    - operations
                    - misconceptions
                    - conceptMap
                    - parts
                    - acceptanceCriteria
                  properties:
                    artifact:
                      const: aralearn.course-plan
                    version:
                      const: 1
                    runId:
                      type: string
                      format: uuid
                    project:
                      type: object
                      description: Documento aralearn.contract versão 3 com exatamente um curso e com módulos e lições planejados; microsequences deve permanecer vazia.
                      required:
                        - contract
                        - version
                        - kind
                        - courses
                      properties:
                        contract:
                          const: aralearn.contract
                        version:
                          const: 3
                        kind:
                          const: project
                        courses:
                          type: array
                          minItems: 1
                          maxItems: 1
                          items:
                            type: object
                            additionalProperties: false
                            required:
                              - id
                              - title
                              - goal
                              - modules
                            properties:
                              id:
                                type: string
                                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                              title:
                                type: string
                                minLength: 1
                                maxLength: 20000
                              goal:
                                type: string
                                minLength: 1
                                maxLength: 20000
                              modules:
                                type: array
                                minItems: 1
                                items:
                                  type: object
                                  additionalProperties: false
                                  required:
                                    - id
                                    - title
                                    - guide
                                    - lessons
                                  properties:
                                    id:
                                      type: string
                                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                                    title:
                                      type: string
                                      minLength: 1
                                      maxLength: 20000
                                      pattern: \S
                                    guide:
                                      type: object
                                      additionalProperties: false
                                      required:
                                        - goal
                                        - include
                                        - exclude
                                        - notation
                                        - avoid
                                      properties:
                                        goal:
                                          type: string
                                          minLength: 1
                                          maxLength: 20000
                                          pattern: \S
                                        include:
                                          type: array
                                          maxItems: 1000
                                          uniqueItems: true
                                          items:
                                            type: string
                                            minLength: 1
                                            maxLength: 500
                                            pattern: ^\S(?:[\s\S]*\S)?$
                                        exclude:
                                          type: array
                                          maxItems: 1000
                                          uniqueItems: true
                                          items:
                                            type: string
                                            minLength: 1
                                            maxLength: 500
                                            pattern: ^\S(?:[\s\S]*\S)?$
                                        notation:
                                          type: array
                                          maxItems: 1000
                                          uniqueItems: true
                                          items:
                                            type: string
                                            minLength: 1
                                            maxLength: 500
                                            pattern: ^\S(?:[\s\S]*\S)?$
                                        avoid:
                                          type: array
                                          maxItems: 1000
                                          uniqueItems: true
                                          items:
                                            type: string
                                            minLength: 1
                                            maxLength: 500
                                            pattern: ^\S(?:[\s\S]*\S)?$
                                    lessons:
                                      type: array
                                      minItems: 1
                                      items:
                                        type: object
                                        additionalProperties: false
                                        required:
                                          - id
                                          - title
                                          - guide
                                          - topics
                                          - microsequences
                                        properties:
                                          id:
                                            type: string
                                            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                                          title:
                                            type: string
                                            minLength: 1
                                            maxLength: 20000
                                            pattern: \S
                                          guide:
                                            type: object
                                            additionalProperties: false
                                            required:
                                              - goal
                                              - include
                                              - exclude
                                              - notation
                                              - avoid
                                            properties:
                                              goal:
                                                type: string
                                                minLength: 1
                                                maxLength: 20000
                                                pattern: \S
                                              include:
                                                type: array
                                                maxItems: 1000
                                                uniqueItems: true
                                                items:
                                                  type: string
                                                  minLength: 1
                                                  maxLength: 500
                                                  pattern: ^\S(?:[\s\S]*\S)?$
                                              exclude:
                                                type: array
                                                maxItems: 1000
                                                uniqueItems: true
                                                items:
                                                  type: string
                                                  minLength: 1
                                                  maxLength: 500
                                                  pattern: ^\S(?:[\s\S]*\S)?$
                                              notation:
                                                type: array
                                                maxItems: 1000
                                                uniqueItems: true
                                                items:
                                                  type: string
                                                  minLength: 1
                                                  maxLength: 500
                                                  pattern: ^\S(?:[\s\S]*\S)?$
                                              avoid:
                                                type: array
                                                maxItems: 1000
                                                uniqueItems: true
                                                items:
                                                  type: string
                                                  minLength: 1
                                                  maxLength: 500
                                                  pattern: ^\S(?:[\s\S]*\S)?$
                                          topics:
                                            type: array
                                            items:
                                              type: object
                                              additionalProperties: false
                                              required:
                                                - id
                                                - label
                                                - kind
                                                - checks
                                                - errors
                                              properties:
                                                id:
                                                  type: string
                                                  minLength: 1
                                                  maxLength: 160
                                                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                                                label:
                                                  type: string
                                                  minLength: 1
                                                  maxLength: 20000
                                                  pattern: \S
                                                kind:
                                                  enum:
                                                    - concept
                                                    - procedure
                                                    - representation
                                                    - term
                                                checks:
                                                  type: array
                                                  maxItems: 1000
                                                  uniqueItems: true
                                                  items:
                                                    type: string
                                                    minLength: 1
                                                    maxLength: 500
                                                    pattern: ^\S(?:[\s\S]*\S)?$
                                                errors:
                                                  type: array
                                                  maxItems: 1000
                                                  uniqueItems: true
                                                  items:
                                                    type: string
                                                    minLength: 1
                                                    maxLength: 500
                                                    pattern: ^\S(?:[\s\S]*\S)?$
                                          microsequences:
                                            type: array
                                            maxItems: 0
                      additionalProperties: false
                    ledgerManifest:
                      type: object
                      additionalProperties: false
                      required:
                        - artifact
                        - version
                        - runId
                        - sections
                        - openIssues
                      properties:
                        artifact:
                          const: aralearn.course-ledger-manifest
                        version:
                          const: 1
                        runId:
                          type: string
                          format: uuid
                        sections:
                          type: object
                          additionalProperties: false
                          required:
                            - sources
                            - claims
                            - terms
                          properties:
                            sources:
                              type: object
                              additionalProperties: false
                              required:
                                - chunkCount
                                - itemCount
                              properties:
                                chunkCount:
                                  type: integer
                                  minimum: 0
                                  maximum: 1000
                                itemCount:
                                  type: integer
                                  minimum: 0
                                  maximum: 100000
                              allOf:
                                - if:
                                    properties:
                                      chunkCount:
                                        const: 0
                                    required:
                                      - chunkCount
                                  then:
                                    properties:
                                      itemCount:
                                        const: 0
                                  else:
                                    properties:
                                      itemCount:
                                        minimum: 1
                                - if:
                                    properties:
                                      itemCount:
                                        const: 0
                                    required:
                                      - itemCount
                                  then:
                                    properties:
                                      chunkCount:
                                        const: 0
                                  else:
                                    properties:
                                      chunkCount:
                                        minimum: 1
                            claims:
                              type: object
                              additionalProperties: false
                              required:
                                - chunkCount
                                - itemCount
                              properties:
                                chunkCount:
                                  type: integer
                                  minimum: 0
                                  maximum: 1000
                                itemCount:
                                  type: integer
                                  minimum: 0
                                  maximum: 100000
                              allOf:
                                - if:
                                    properties:
                                      chunkCount:
                                        const: 0
                                    required:
                                      - chunkCount
                                  then:
                                    properties:
                                      itemCount:
                                        const: 0
                                  else:
                                    properties:
                                      itemCount:
                                        minimum: 1
                                - if:
                                    properties:
                                      itemCount:
                                        const: 0
                                    required:
                                      - itemCount
                                  then:
                                    properties:
                                      chunkCount:
                                        const: 0
                                  else:
                                    properties:
                                      chunkCount:
                                        minimum: 1
                            terms:
                              type: object
                              additionalProperties: false
                              required:
                                - chunkCount
                                - itemCount
                              properties:
                                chunkCount:
                                  type: integer
                                  minimum: 0
                                  maximum: 1000
                                itemCount:
                                  type: integer
                                  minimum: 0
                                  maximum: 100000
                              allOf:
                                - if:
                                    properties:
                                      chunkCount:
                                        const: 0
                                    required:
                                      - chunkCount
                                  then:
                                    properties:
                                      itemCount:
                                        const: 0
                                  else:
                                    properties:
                                      itemCount:
                                        minimum: 1
                                - if:
                                    properties:
                                      itemCount:
                                        const: 0
                                    required:
                                      - itemCount
                                  then:
                                    properties:
                                      chunkCount:
                                        const: 0
                                  else:
                                    properties:
                                      chunkCount:
                                        minimum: 1
                        openIssues:
                          type: array
                          maxItems: 500
                          uniqueItems: true
                          items:
                            type: string
                            minLength: 1
                            maxLength: 500
                    course:
                      type: object
                      additionalProperties: false
                      required:
                        - id
                        - title
                        - goal
                        - audience
                        - prerequisites
                        - depth
                        - language
                        - include
                        - exclude
                        - notation
                        - modules
                      properties:
                        id:
                          type: string
                          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                        title:
                          type: string
                          minLength: 1
                          maxLength: 240
                        goal:
                          type: string
                          minLength: 1
                          maxLength: 20000
                        audience:
                          type: string
                          minLength: 1
                          maxLength: 20000
                        prerequisites:
                          type: array
                          uniqueItems: true
                          items:
                            type: string
                            minLength: 1
                            maxLength: 500
                            pattern: ^\S(?:[\s\S]*\S)?$
                        depth:
                          type: string
                          minLength: 1
                          maxLength: 20000
                        language:
                          type: string
                          minLength: 2
                          maxLength: 63
                          pattern: ^[A-Za-z]{2,3}(?:-[A-Za-z]{4})?(?:-(?:[A-Za-z]{2}|\d{3}))?(?:-(?:[A-Za-z0-9]{5,8}|\d[A-Za-z0-9]{3}))*$
                        include:
                          type: array
                          uniqueItems: true
                          items:
                            type: string
                            minLength: 1
                            maxLength: 500
                            pattern: ^\S(?:[\s\S]*\S)?$
                        exclude:
                          type: array
                          uniqueItems: true
                          items:
                            type: string
                            minLength: 1
                            maxLength: 500
                            pattern: ^\S(?:[\s\S]*\S)?$
                        notation:
                          type: array
                          uniqueItems: true
                          items:
                            type: string
                            minLength: 1
                            maxLength: 500
                            pattern: ^\S(?:[\s\S]*\S)?$
                        modules:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            additionalProperties: false
                            required:
                              - id
                              - title
                              - goal
                              - lessonIds
                            properties:
                              id:
                                type: string
                                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                              title:
                                type: string
                                minLength: 1
                                maxLength: 240
                              goal:
                                type: string
                                minLength: 1
                                maxLength: 20000
                              lessonIds:
                                type: array
                                minItems: 1
                                uniqueItems: true
                                items:
                                  type: string
                                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                    learningOutcomes:
                      type: array
                      minItems: 1
                      maxItems: 5000
                      uniqueItems: true
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - id
                          - statement
                          - evidence
                        properties:
                          id:
                            type: string
                            minLength: 1
                            maxLength: 160
                            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                          statement:
                            type: string
                            minLength: 1
                            maxLength: 20000
                          evidence:
                            type: string
                            minLength: 1
                            maxLength: 20000
                    operations:
                      type: array
                      minItems: 1
                      maxItems: 5000
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - id
                          - label
                          - evidence
                          - representation
                        properties:
                          id:
                            type: string
                            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                          label:
                            type: string
                            minLength: 1
                            maxLength: 1000
                            pattern: \S
                          evidence:
                            type: string
                            minLength: 1
                            maxLength: 20000
                          representation:
                            type: object
                            additionalProperties: false
                            required:
                              - preferredResources
                              - allowedResources
                              - rationale
                            properties:
                              preferredResources:
                                type: array
                                minItems: 1
                                maxItems: 4
                                uniqueItems: true
                                items:
                                  type: string
                                  enum:
                                    - paragraph
                                    - choice
                                    - composite
                                    - code
                                    - table
                                    - flow
                                    - tree
                                    - graph
                                    - relation_map
                                    - matrix
                                    - plane
                                    - formula
                              allowedResources:
                                type: array
                                minItems: 1
                                maxItems: 12
                                uniqueItems: true
                                items:
                                  type: string
                                  enum:
                                    - paragraph
                                    - choice
                                    - composite
                                    - code
                                    - table
                                    - flow
                                    - tree
                                    - graph
                                    - relation_map
                                    - matrix
                                    - plane
                                    - formula
                              rationale:
                                type: string
                                minLength: 1
                                maxLength: 20000
                    misconceptions:
                      type: array
                      maxItems: 5000
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - id
                          - statement
                          - correctionEvidence
                        properties:
                          id:
                            type: string
                            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                          statement:
                            type: string
                            minLength: 1
                            maxLength: 20000
                          correctionEvidence:
                            type: string
                            minLength: 1
                            maxLength: 20000
                    parts:
                      type: array
                      minItems: 1
                      maxItems: 256
                      items:
                        type: object
                        required:
                          - key
                          - title
                          - boundary
                          - cutReason
                          - dependsOnPartKeys
                          - ownership
                          - cardIds
                          - outcomeIds
                          - conceptIds
                          - operationIds
                          - misconceptionIds
                        properties:
                          key:
                            type: string
                            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                          title:
                            type: string
                            minLength: 1
                            maxLength: 300
                          ownership:
                            type: object
                            required:
                              - courseId
                              - moduleId
                              - lessonId
                              - microsequenceIds
                            properties:
                              courseId:
                                type: string
                                minLength: 1
                                maxLength: 160
                              moduleId:
                                type: string
                                minLength: 1
                                maxLength: 160
                              lessonId:
                                type: string
                                minLength: 1
                                maxLength: 160
                              microsequenceIds:
                                type: array
                                minItems: 1
                                uniqueItems: true
                                items:
                                  type: string
                                  minLength: 1
                                  maxLength: 160
                            additionalProperties: false
                          boundary:
                            type: string
                            minLength: 1
                          cutReason:
                            type: string
                            minLength: 1
                          dependsOnPartKeys:
                            type: array
                            uniqueItems: true
                            items:
                              type: string
                          cardIds:
                            type: array
                            minItems: 1
                            maxItems: 1000
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 160
                          outcomeIds:
                            type: array
                            minItems: 1
                            maxItems: 1000
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 160
                          conceptIds:
                            type: array
                            minItems: 1
                            maxItems: 1000
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 160
                          operationIds:
                            type: array
                            minItems: 1
                            maxItems: 1000
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 160
                          misconceptionIds:
                            type: array
                            maxItems: 1000
                            uniqueItems: true
                            items:
                              type: string
                              minLength: 1
                              maxLength: 160
                        additionalProperties: false
                    conceptMap:
                      type: object
                      additionalProperties: false
                      required:
                        - concepts
                        - relations
                      properties:
                        concepts:
                          type: array
                          minItems: 1
                          maxItems: 10000
                          items:
                            type: object
                            additionalProperties: false
                            required:
                              - id
                              - label
                            properties:
                              id:
                                type: string
                                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                              label:
                                type: string
                                minLength: 1
                                maxLength: 1000
                                pattern: \S
                        relations:
                          type: array
                          maxItems: 20000
                          items:
                            type: object
                            additionalProperties: false
                            required:
                              - from
                              - to
                              - relation
                            properties:
                              from:
