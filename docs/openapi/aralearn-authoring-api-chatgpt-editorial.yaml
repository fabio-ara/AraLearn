  /functions/v1/aralearn-authoring-api/v1/runs/{runId}/parts/{partKey}/audit:
    post:
      operationId: auditarParteDoCurso
      summary: Aprova a parte ou solicita reparo ou reconstrução
      description: Audita exatamente a tentativa e o submissionSha256 devolvidos pela leitura persistida. Aprovação exige os dez critérios verdadeiros e nenhum achado.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - artifact
                - version
                - requestId
                - attempt
                - submissionSha256
                - submissionReadReceipt
                - decision
                - gates
                - findings
              properties:
                artifact:
                  const: aralearn.part-audit
                version:
                  const: 1
                requestId:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
                  description: Identificador idempotente, novo para cada intenção do cliente.
                attempt:
                  type: integer
                  minimum: 1
                  maximum: 8
                submissionSha256:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                submissionReadReceipt:
                  type: string
                  minLength: 40
                  maxLength: 4096
                  pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
                decision:
                  type: string
                  enum:
                    - approve
                    - repair
                    - rebuild
                    - blocked
                gates:
                  type: object
                  required:
                    - planAlignment
                    - contract
                    - outcomeCoverage
                    - sources
                    - continuity
                    - interactionCoherence
                    - language
                    - fieldPreservation
                    - structuredElements
                    - feedback
                  properties:
                    planAlignment:
                      type: boolean
                    contract:
                      type: boolean
                    outcomeCoverage:
                      type: boolean
                    sources:
                      type: boolean
                    continuity:
                      type: boolean
                    interactionCoherence:
                      type: boolean
                    language:
                      type: boolean
                    fieldPreservation:
                      type: boolean
                    structuredElements:
                      type: boolean
                    feedback:
                      type: boolean
                  additionalProperties: false
                findings:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - issueId
                      - severity
                      - gate
                      - pointer
                      - observed
                      - requiredChange
                      - preserveFields
                      - acceptanceTest
                    properties:
                      issueId:
                        type: string
                        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
                      severity:
                        type: string
                        enum:
                          - error
                          - warning
                      gate:
                        type: string
                        enum:
                          - planAlignment
                          - contract
                          - outcomeCoverage
                          - sources
                          - continuity
                          - interactionCoherence
                          - language
                          - fieldPreservation
                          - structuredElements
                          - feedback
                      pointer:
                        type: string
                        minLength: 1
                        maxLength: 1000
                        pattern: ^/
                      observed:
                        type: string
                        minLength: 1
                        maxLength: 4000
                      requiredChange:
                        type: string
                        minLength: 1
                        maxLength: 4000
                      preserveFields:
                        type: array
                        minItems: 1
                        uniqueItems: true
                        items:
                          type: string
                          minLength: 1
                          pattern: ^/
                      acceptanceTest:
                        type: string
                        minLength: 1
                        maxLength: 4000
                instructions:
                  type: string
              allOf:
                - if:
                    properties:
                      decision:
                        const: approve
                    required:
                      - decision
                  then:
                    properties:
                      gates:
                        properties:
                          planAlignment:
                            const: true
                          contract:
                            const: true
                          outcomeCoverage:
                            const: true
                          sources:
                            const: true
                          continuity:
                            const: true
                          interactionCoherence:
                            const: true
                          language:
                            const: true
                          fieldPreservation:
                            const: true
                          structuredElements:
                            const: true
                          feedback:
                            const: true
                      findings:
                        maxItems: 0
                  else:
                    anyOf:
                      - properties:
                          findings:
                            minItems: 1
                      - required:
                          - instructions
                        properties:
                          instructions:
                            type: string
                            minLength: 1
      responses:
        "200":
          description: Operação concluída ou repetição idempotente confirmada.
        "400":
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
        default:
          description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: partKey
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
