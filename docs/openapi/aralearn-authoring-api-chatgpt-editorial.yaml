openapi: 3.1.0
info:
  title: "AraLearn Authoring API: perfil editorial"
  version: 1.0.0
  description: Cria, produz, revisa, valida e publica cursos AraLearn por partes.
  license:
    name: MIT
    url: https://github.com/fabio-ara/AraLearn/blob/main/LICENSE.md
servers:
  - url: https://seu-projeto.supabase.co
security:
  - AuthoringApiKey: []
paths:
  /functions/v1/aralearn-authoring-api/v1/runs:
    get:
      operationId: listarExecucoesDeAutoria
      summary: Lista execuções de autoria
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: beforeUpdatedAt
          in: query
          schema: { type: string }
        - name: beforeRunId
          in: query
          schema: { type: string }
      responses:
        '200': { description: Execuções encontradas. }
        default: { description: Falha ao consultar execuções. }
    post:
      operationId: criarExecucaoDeAutoria
      summary: Cria uma execução de autoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, target, title, contractKey, brief, publicationIntent]
              properties:
                requestId:
                  type: string
                  description: Identificador novo e idempotente desta intenção.
                target:
                  type: string
                  enum: [catalog]
                title:
                  type: string
                  description: Título do curso.
                contractKey:
                  type: string
                  description: Identificador textual único e estável do curso.
                collectionId:
                  type: string
                  description: UUID da coleção, quando a publicação for destinada a uma coleção existente.
                brief:
                  type: object
                  properties:
                    audience: { type: string }
                    language: { type: string }
                    depth: { type: string }
                    objective: { type: string }
                    scope: { type: array, items: { type: string } }
                    exclusions: { type: array, items: { type: string } }
                  additionalProperties: true
                publicationIntent:
                  type: object
                  required: [mode]
                  properties:
                    mode:
                      type: string
                      enum: [create, update]
                      description: Use create para curso novo. Update exige existingCourseId e expectedContentHash.
                    existingCourseId: { type: string }
                    expectedContentHash: { type: string }
                  additionalProperties: false
              additionalProperties: false
      responses:
        '201': { description: Execução criada. }
        default: { description: Falha ao criar execução. }
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}:
    get:
      operationId: consultarExecucaoDeAutoria
      summary: Consulta uma execução
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Execução encontrada. }
        default: { description: Falha ao consultar execução. }
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}/plan:
    put:
      operationId: gravarPlanoDeAutoria
      summary: Grava o plano de uma execução
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, plan]
              properties:
                requestId: { type: string }
                plan:
                  type: object
                  description: >-
                    Consulte a execução antes desta chamada. Use o contractKey devolvido
                    como project.courses[0].id, course.id e ownership.courseId de todas
                    as partes. Use o runId da URL também em plan.runId e ledgerManifest.runId.
                  required: [artifact, version, runId, project, ledgerManifest, course, learningOutcomes, conceptMap, parts, acceptanceCriteria]
                  properties:
                    artifact: { type: string }
                    version: { type: integer }
                    runId: { type: string }
                    project: { type: object, required: [contract, version, kind, courses], properties: { contract: { type: string }, version: { type: integer }, kind: { type: string }, courses: { type: array, items: { type: object, required: [id, title, goal, modules], properties: { id: { type: string }, title: { type: string }, goal: { type: string }, modules: { type: array, items: { type: object, required: [id, title, guide, lessons], properties: { id: { type: string }, title: { type: string }, guide: { type: object, required: [goal, include, exclude, notation, avoid], properties: { goal: { type: string }, include: { type: array, items: { type: string } }, exclude: { type: array, items: { type: string } }, notation: { type: array, items: { type: string } }, avoid: { type: array, items: { type: string } } }, additionalProperties: false }, lessons: { type: array, items: { type: object, required: [id, title, guide, topics, microsequences], properties: { id: { type: string }, title: { type: string }, guide: { type: object, required: [goal, include, exclude, notation, avoid], properties: { goal: { type: string }, include: { type: array, items: { type: string } }, exclude: { type: array, items: { type: string } }, notation: { type: array, items: { type: string } }, avoid: { type: array, items: { type: string } } }, additionalProperties: false }, topics: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, kind: { type: string }, checks: { type: array, items: { type: string } }, errors: { type: array, items: { type: string } } }, additionalProperties: false } }, microsequences: { type: array, maxItems: 0, items: { type: object, properties: {}, additionalProperties: true } } }, additionalProperties: false } } }, additionalProperties: false } } }, additionalProperties: false } } }, additionalProperties: false }
                    ledgerManifest: { type: object, required: [artifact, version, runId, sections, openIssues], properties: { artifact: { type: string }, version: { type: integer }, runId: { type: string }, sections: { type: object, required: [sources, claims, terms], properties: { sources: { type: object, required: [chunkCount, itemCount], properties: { chunkCount: { type: integer }, itemCount: { type: integer } }, additionalProperties: false }, claims: { type: object, required: [chunkCount, itemCount], properties: { chunkCount: { type: integer }, itemCount: { type: integer } }, additionalProperties: false }, terms: { type: object, required: [chunkCount, itemCount], properties: { chunkCount: { type: integer }, itemCount: { type: integer } }, additionalProperties: false } }, additionalProperties: false }, openIssues: { type: array, items: { type: string } } }, additionalProperties: false }
                    course:
                      type: object
                      required: [id, title, goal, audience, prerequisites, depth, language, include, exclude, notation, modules]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        goal: { type: string }
                        audience: { type: string }
                        prerequisites: { type: array, items: { type: string } }
                        depth: { type: string }
                        language:
                          type: string
                          pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z]{4})?(?:-(?:[A-Za-z]{2}|\d{3}))?(?:-(?:[A-Za-z0-9]{5,8}|\d[A-Za-z0-9]{3}))*$'
                        include: { type: array, items: { type: string } }
                        exclude: { type: array, items: { type: string } }
                        notation: { type: array, items: { type: string } }
                        modules:
                          type: array
                          items:
                            type: object
                            required: [id, title, goal, lessonIds]
                            properties:
                              id: { type: string }
                              title: { type: string }
                              goal: { type: string }
                              lessonIds: { type: array, items: { type: string } }
                            additionalProperties: false
                      additionalProperties: false
                    learningOutcomes: { type: array, items: { type: object, required: [id, statement, evidence], properties: { id: { type: string }, statement: { type: string }, evidence: { type: string } }, additionalProperties: false } }
                    conceptMap: { type: object, required: [concepts, relations], properties: { concepts: { type: array, items: { type: object, required: [id, label], properties: { id: { type: string }, label: { type: string } }, additionalProperties: false } }, relations: { type: array, items: { type: object, required: [from, to, relation], properties: { from: { type: string }, to: { type: string }, relation: { type: string } }, additionalProperties: false } } }, additionalProperties: false }
                    parts: { type: array, items: { type: object, required: [key, title, boundary, cutReason, dependsOnPartKeys, ownership, cardIds, outcomeIds], properties: { key: { type: string }, title: { type: string }, boundary: { type: string }, cutReason: { type: string }, dependsOnPartKeys: { type: array, items: { type: string } }, ownership: { type: object, required: [courseId, moduleId, lessonId, microsequenceIds], properties: { courseId: { type: string }, moduleId: { type: string }, lessonId: { type: string }, microsequenceIds: { type: array, items: { type: string } } }, additionalProperties: false }, cardIds: { type: array, items: { type: string } }, outcomeIds: { type: array, items: { type: string } } }, additionalProperties: false } }
                    acceptanceCriteria: { type: array, items: { type: string } }
                  additionalProperties: false
              additionalProperties: false
      responses:
        '200': { description: Plano gravado. }
        default: { description: Falha ao gravar plano. }
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}/ledger/{section}/{position}:
    put:
      operationId: gravarTrechoDoRegistro
      summary: Grava um trecho do registro de fontes
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: section, in: path, required: true, schema: { type: string } }
        - { name: position, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, planHash, items]
              properties:
                requestId: { type: string }
                planHash: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    oneOf:
                      - type: object
                        required: [sourceId, title, kind, locator, excerpt, stability]
                        properties:
                          sourceId: { type: string }
                          title: { type: string }
                          author: { type: string }
                          kind: { type: string, enum: [attachment, book, article, standard, documentation, web, dataset, other] }
                          locator: { type: string }
                          publishedOn: { type: string }
                          publishedVersion: { type: string }
                          accessedOn: { type: string }
                          excerpt: { type: string }
                          stability: { type: string, enum: [stable, versioned, volatile] }
                          usageTerms: { type: string }
                          usageNotes: { type: string }
                        additionalProperties: false
                        allOf:
                          - if:
                              properties: { stability: { const: volatile } }
                              required: [stability]
                            then:
                              required: [accessedOn]
                      - type: object
                        required: [claimId, statement, sourceIds, support, confidence]
                        properties:
                          claimId: { type: string }
                          statement: { type: string }
                          sourceIds: { type: array, minItems: 1, items: { type: string } }
                          support: { type: string }
                          confidence: { type: string, enum: [high, medium, low] }
                          allowedPartKeys: { type: array, items: { type: string } }
                        additionalProperties: false
                      - type: object
                        required: [termId, form, language, explanation, firstTeachingCardId]
                        properties:
                          termId: { type: string }
                          form: { type: string }
                          language:
                            type: string
                            pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z]{4})?(?:-(?:[A-Za-z]{2}|\d{3}))?(?:-(?:[A-Za-z0-9]{5,8}|\d[A-Za-z0-9]{3}))*$'
                          explanation: { type: string }
                          gloss: { type: string }
                          firstTeachingCardId: { type: string }
                          requiredByCardIds: { type: array, items: { type: string } }
                          sourceIds: { type: array, items: { type: string } }
                        additionalProperties: false
              additionalProperties: false
      responses:
        '200': { description: Trecho gravado. }
        default: { description: Falha ao gravar trecho. }
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}/plan/finalize:
    post:
      operationId: finalizarPlanoDeAutoria
      summary: Finaliza o plano de uma execução
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, planHash]
              properties:
                requestId: { type: string }
                planHash: { type: string }
              additionalProperties: false
      responses:
        '200': { description: Plano finalizado. }
        default: { description: Falha ao finalizar plano. }
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}/next-part:
    get:
      operationId: consultarProximaParte
      summary: Consulta a próxima parte a produzir
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Próxima parte encontrada. }
        default: { description: Falha ao consultar a próxima parte. }
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}/parts/{partKey}/specification:
    put:
      operationId: gravarEspecificacaoDaParte
      summary: Grava a especificação de uma parte
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: partKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, planHash, specification]
              properties:
                requestId: { type: string }
                planHash: { type: string }
                specification:
                  type: object
                  required: [key, title, boundary, cutReason, dependsOnPartKeys, ownership, outcomeIds, structure, cardPlan, allowedSourceIds, availableTermIds, preserve]
                  properties:
                    key: { type: string }
                    title: { type: string }
                    boundary: { type: string }
                    cutReason: { type: string }
                    dependsOnPartKeys: { type: array, items: { type: string } }
                    ownership: { type: object, required: [courseId, moduleId, lessonId, microsequenceIds], properties: { courseId: { type: string }, moduleId: { type: string }, lessonId: { type: string }, microsequenceIds: { type: array, items: { type: string } } }, additionalProperties: false }
                    outcomeIds: { type: array, items: { type: string } }
                    structure: { type: object, required: [course, module, lesson, microsequences], properties: { course: { type: object, required: [id, title, goal], properties: { id: { type: string }, title: { type: string }, goal: { type: string } }, additionalProperties: false }, module: { type: object, required: [id, title, guide], properties: { id: { type: string }, title: { type: string }, guide: { type: object, required: [goal, include, exclude, notation, avoid], properties: { goal: { type: string }, include: { type: array, items: { type: string } }, exclude: { type: array, items: { type: string } }, notation: { type: array, items: { type: string } }, avoid: { type: array, items: { type: string } } }, additionalProperties: false } }, additionalProperties: false }, lesson: { type: object, required: [id, title, guide, topics], properties: { id: { type: string }, title: { type: string }, guide: { type: object, required: [goal, include, exclude, notation, avoid], properties: { goal: { type: string }, include: { type: array, items: { type: string } }, exclude: { type: array, items: { type: string } }, notation: { type: array, items: { type: string } }, avoid: { type: array, items: { type: string } } }, additionalProperties: false }, topics: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, kind: { type: string }, checks: { type: array, items: { type: string } }, errors: { type: array, items: { type: string } } }, additionalProperties: false } } }, additionalProperties: false }, microsequences: { type: array, items: { type: object, required: [id, title, goal, role, status, dependsOn, dependencyRationale, covers, checks, errors], properties: { id: { type: string }, title: { type: string }, goal: { type: string }, role: { type: string, enum: [explain, practice, review, support] }, status: { type: string, enum: [planned] }, dependsOn: { type: array, items: { type: string } }, dependencyRationale: { type: object, properties: {}, additionalProperties: { type: string } }, covers: { type: array, items: { type: string } }, checks: { type: array, items: { type: string } }, errors: { type: array, items: { type: string } } }, additionalProperties: false } } }, additionalProperties: false }
                    cardPlan:
                      type: array
                      minItems: 1
                      maxItems: 1000
                      items:
                        type: object
                        required: [cardId, microsequenceId, position, resource, kind, exercise, purpose, evidence, outcomeIds, operationId, learningFunction, resourceRationale, contextAnchors, introducedTermIds, requiredTermIds, sourceIds]
                        properties:
                          cardId: { type: string }
                          microsequenceId: { type: string }
                          position: { type: integer }
                          resource: { type: string, enum: [paragraph, choice, composite, code, table, flow, tree, graph, relation_map, matrix, plane, formula] }
                          kind: { type: string, enum: [theory, exercise] }
                          exercise: { type: string, enum: [none, gap, choice] }
                          purpose: { type: string }
                          evidence: { type: string }
                          outcomeIds: { type: array, minItems: 1, items: { type: string } }
                          operationId: { type: string }
                          codeLanguage: { type: string }
                          notation: { type: string, enum: [mathematics, chemistry] }
                          languageTag:
                            type: string
                            pattern: '^[A-Za-z]{2,3}(?:-[A-Za-z]{4})?(?:-(?:[A-Za-z]{2}|\d{3}))?(?:-(?:[A-Za-z0-9]{5,8}|\d[A-Za-z0-9]{3}))*$'
                          textDirection: { type: string, enum: [auto, ltr, rtl] }
                          targetError: { type: string }
                          learningFunction: { type: string, enum: [foundation, worked_example, guided_practice, independent_practice, contrast, error_diagnosis, integration] }
                          resourceRationale: { type: string }
                          variationFocus: { type: string }
                          contextAnchors: { type: array, items: { type: string } }
                          singlePracticeRationale:
                            type: string
                            description: Obrigatório quando esta for a única prática da operação; ela deve ser independente e tratar um fato indivisível.
                          introducedTermIds: { type: array, items: { type: string } }
                          requiredTermIds: { type: array, items: { type: string } }
                          sourceIds: { type: array, items: { type: string } }
                          claimIds: { type: array, items: { type: string } }
                        additionalProperties: false
                        allOf:
                          - if:
                              properties: { resource: { const: code } }
                              required: [resource]
                            then: { required: [codeLanguage] }
                            else: { not: { required: [codeLanguage] } }
                          - if:
                              properties: { resource: { const: formula } }
                              required: [resource]
                            then: { required: [notation] }
                            else: { not: { required: [notation] } }
                          - if:
                              properties: { kind: { const: exercise } }
                              required: [kind]
                            then:
                              required: [targetError, variationFocus]
                              properties:
                                learningFunction: { enum: [guided_practice, independent_practice, contrast, error_diagnosis, integration] }
                                contextAnchors: { type: array, minItems: 1 }
                            else:
                              properties:
                                learningFunction: { enum: [foundation, worked_example] }
                              not: { required: [singlePracticeRationale] }
                      allOf:
                        - if:
                            contains:
                              type: object
                              properties: { kind: { const: exercise } }
                              required: [kind]
                            minContains: 1
                            maxContains: 1
                          then:
                            contains:
                              type: object
                              properties:
                                kind: { const: exercise }
                                learningFunction: { const: independent_practice }
                              required: [kind, learningFunction, singlePracticeRationale]
                            minContains: 1
                            maxContains: 1
                    allowedSourceIds: { type: array, items: { type: string } }
                    availableTermIds: { type: array, items: { type: string } }
                    preserve: { type: array, items: { type: string } }
                  additionalProperties: false
              additionalProperties: false
      responses:
        '200': { description: Especificação gravada. }
        default: { description: Falha ao gravar especificação. }
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}/parts/{partKey}:
    put:
      operationId: gravarParteDoCurso
      summary: Grava a entrega de uma parte
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: partKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact, version, requestId, mode, attempt, baseLedgerSha256, fragment, stateDelta]
              properties:
                artifact: { type: string }
                version: { type: integer }
                requestId: { type: string }
                mode: { type: string, enum: [build, repair, rebuild] }
                attempt: { type: integer }
                baseLedgerSha256: { type: string }
                fragment: { type: object, properties: { microsequences: { type: array, items: { type: object, properties: { id: { type: string } }, additionalProperties: true } } }, additionalProperties: true }
                evidence: { type: array, items: { type: object, properties: { sourceId: { type: string }, claimId: { type: string } }, additionalProperties: true } }
                stateDelta: { type: object, required: [introducedTermIds, usedClaimIds, coveredOutcomeIds, resolvedErrorIds, notes], properties: { introducedTermIds: { type: array, items: { type: string } }, usedClaimIds: { type: array, items: { type: string } }, coveredOutcomeIds: { type: array, items: { type: string } }, resolvedErrorIds: { type: array, items: { type: string } }, notes: { type: array, items: { type: string } } }, additionalProperties: false }
              additionalProperties: false
      responses:
        '200': { description: Parte gravada. }
        default: { description: Falha ao gravar parte. }
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}/parts/{partKey}/submission:
    get:
      operationId: consultarEntregaDaParte
      summary: Consulta a entrega de uma parte
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: partKey, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Entrega encontrada. }
        default: { description: Falha ao consultar entrega. }
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}/parts/{partKey}/audit:
    post:
      operationId: auditarParteDoCurso
      summary: Audita uma parte produzida
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: partKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact, version, requestId, attempt, submissionSha256, submissionReadReceipt, decision, gates, findings]
              properties:
                artifact: { type: string }
                version: { type: integer }
                requestId: { type: string }
                attempt: { type: integer }
                submissionSha256: { type: string }
                submissionReadReceipt: { type: string }
                decision: { type: string, enum: [approve, repair, rebuild, blocked] }
                gates: { type: object, required: [planAlignment, contract, outcomeCoverage, sources, continuity, interactionCoherence, language, fieldPreservation, structuredElements, feedback], properties: { planAlignment: { type: boolean }, contract: { type: boolean }, outcomeCoverage: { type: boolean }, sources: { type: boolean }, continuity: { type: boolean }, interactionCoherence: { type: boolean }, language: { type: boolean }, fieldPreservation: { type: boolean }, structuredElements: { type: boolean }, feedback: { type: boolean } }, additionalProperties: false }
                findings:
                  type: array
                  items:
                    type: object
                    required: [issueId, severity, gate, pointer, observed, requiredChange, preserveFields, acceptanceTest]
                    properties:
                      issueId: { type: string }
                      severity: { type: string, enum: [error, warning] }
                      gate: { type: string, enum: [planAlignment, contract, outcomeCoverage, sources, continuity, interactionCoherence, language, fieldPreservation, structuredElements, feedback] }
                      pointer: { type: string }
                      observed: { type: string }
                      requiredChange: { type: string }
                      preserveFields: { type: array, minItems: 1, items: { type: string } }
                      acceptanceTest: { type: string }
                    additionalProperties: false
                instructions: { type: string }
              additionalProperties: false
      responses:
        '200': { description: Auditoria gravada. }
        default: { description: Falha ao auditar parte. }
  /functions/v1/aralearn-authoring-api/v1/runs/{runId}/parts/{partKey}/reopen:
    post:
      operationId: reabrirParteDoCurso
      summary: Reabre uma parte para correção
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
        - { name: partKey, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact, version, requestId, attempt, submissionSha256, decision, findings]
              properties:
                artifact: { type: string }
                version: { type: integer }
                requestId: { type: string }
                attempt: { type: integer }
                submissionSha256: { type: string }
                decision: { type: string, enum: [repair, rebuild] }
                findings:
                  type: array
                  items:
                    type: object
                    required: [issueId, severity, gate, pointer, observed, requiredChange, preserveFields, acceptanceTest]
                    properties:
                      issueId: { type: string }
                      severity: { type: string, enum: [error, warning] }
                      gate: { type: string, enum: [planAlignment, contract, outcomeCoverage, sources, continuity, interactionCoherence, language, fieldPreservation, structuredElements, feedback] }
                      pointer: { type: string }
                      observed: { type: string }
