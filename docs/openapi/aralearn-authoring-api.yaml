    AuditRequest:
      type: object
      additionalProperties: false
      required:
        - artifact
        - version
        - runId
        - partKey
        - requestId
        - attempt
        - submissionSha256
        - submissionReadReceipt
        - decision
        - gates
        - findings
      properties:
        artifact:
          const: aralearn.part-audit
        version:
          const: 1
        runId:
          type: string
          format: uuid
        partKey:
          type: string
        requestId:
          $ref: "#/components/schemas/RequestId"
        attempt:
          type: integer
          minimum: 1
          maximum: 8
        submissionSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        submissionReadReceipt:
          type: string
          minLength: 40
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
        decision:
          type: string
          enum:
            - approve
            - repair
            - rebuild
            - blocked
        gates:
          type: object
          required:
            - planAlignment
            - contract
            - outcomeCoverage
            - sources
            - continuity
            - interactionCoherence
            - language
            - fieldPreservation
            - structuredElements
            - feedback
          properties:
            planAlignment:
              type: boolean
            contract:
              type: boolean
            outcomeCoverage:
              type: boolean
            sources:
              type: boolean
            continuity:
              type: boolean
            interactionCoherence:
              type: boolean
            language:
              type: boolean
            fieldPreservation:
              type: boolean
            structuredElements:
              type: boolean
            feedback:
              type: boolean
          additionalProperties: false
        findings:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required:
              - issueId
              - severity
              - gate
              - pointer
              - observed
              - requiredChange
              - preserveFields
              - acceptanceTest
            properties:
              issueId:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
              severity:
                type: string
                enum:
                  - error
                  - warning
              gate:
                type: string
                enum:
                  - planAlignment
                  - contract
                  - outcomeCoverage
                  - sources
                  - continuity
                  - interactionCoherence
                  - language
                  - fieldPreservation
                  - structuredElements
                  - feedback
              pointer:
                type: string
                minLength: 1
                maxLength: 1000
                pattern: ^/
              observed:
                type: string
                minLength: 1
                maxLength: 4000
              requiredChange:
                type: string
                minLength: 1
                maxLength: 4000
              preserveFields:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
                  pattern: ^/
              acceptanceTest:
                type: string
                minLength: 1
                maxLength: 4000
        instructions:
          type: string
      allOf:
        - if:
            properties:
              decision:
                const: approve
            required:
              - decision
          then:
            properties:
              gates:
                properties:
                  planAlignment:
                    const: true
                  contract:
                    const: true
                  outcomeCoverage:
                    const: true
                  sources:
                    const: true
                  continuity:
                    const: true
                  interactionCoherence:
                    const: true
                  language:
                    const: true
                  fieldPreservation:
                    const: true
                  structuredElements:
                    const: true
                  feedback:
                    const: true
              findings:
                maxItems: 0
          else:
            anyOf:
              - properties:
                  findings:
                    minItems: 1
              - required:
                  - instructions
                properties:
                  instructions:
                    type: string
                    minLength: 1
