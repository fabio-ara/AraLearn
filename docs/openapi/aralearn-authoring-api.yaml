          items:
            type: string
        operationId:
          type: string
          minLength: 1
          maxLength: 160
        conceptIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        retrievedConceptIds:
          type: array
          uniqueItems: true
          description: Subconjunto de conceptIds retomado deliberadamente neste card.
          items:
            type: string
        misconceptionIds:
          type: array
          uniqueItems: true
          items:
            type: string
        codeLanguage:
          type: string
          minLength: 1
          maxLength: 80
        notation:
          enum:
            - mathematics
            - chemistry
        languageTag:
          type: string
          minLength: 2
          maxLength: 63
          pattern: ^[A-Za-z]{2,3}(?:-[A-Za-z]{4})?(?:-(?:[A-Za-z]{2}|\d{3}))?(?:-(?:[A-Za-z0-9]{5,8}|\d[A-Za-z0-9]{3}))*$
        textDirection:
          enum:
            - auto
            - ltr
            - rtl
        targetError:
          type: string
          minLength: 1
          maxLength: 20000
        learningFunction:
          enum:
            - foundation
            - worked_example
            - guided_practice
            - independent_practice
            - contrast
            - error_diagnosis
            - integration
        resourceRationale:
          type: string
          minLength: 1
          maxLength: 20000
        variationFocus:
          type: string
          minLength: 1
          maxLength: 20000
        contextAnchors:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: ^\S(?:[\s\S]*\S)?$
        introducedTermIds:
          type: array
          uniqueItems: true
          items:
            type: string
        requiredTermIds:
          type: array
          uniqueItems: true
          items:
            type: string
        sourceIds:
          type: array
          uniqueItems: true
          items:
            type: string
        claimIds:
          type: array
          uniqueItems: true
          items:
            type: string
      allOf:
        - if:
            properties:
              resource:
                const: code
            required:
              - resource
          then:
            required:
              - codeLanguage
          else:
            not:
              required:
                - codeLanguage
        - if:
            properties:
              resource:
                const: formula
            required:
              - resource
          then:
            required:
              - notation
          else:
            not:
              required:
                - notation
        - if:
            properties:
              kind:
                const: exercise
            required:
              - kind
          then:
            required:
              - targetError
              - variationFocus
            properties:
              learningFunction:
                enum:
