openapi: 3.1.0
info:
  title: API de autoria do AraLearn
  version: 1.1.0
  license:
    name: MIT
    url: https://github.com/fabio-ara/AraLearn/blob/main/LICENSE.md
  description: Opera uma execução de autoria em partes. O cliente planeja, produz cada parte, audita, repara quando necessário, valida o conjunto e solicita a publicação. Clientes editoriais também podem consultar e organizar o catálogo por comandos restritos. Integrações pessoais consultam apenas a biblioteca da própria conta e organizam seus cursos em trilhas.
servers:
  - url: https://{projectRef}.supabase.co/functions/v1/aralearn-authoring-api
    variables:
      projectRef:
        default: seu-projeto
security:
  - AuthoringApiKey: []
  - SupabaseBearer: []
paths:
  /v1/contracts/resources:
    get:
      operationId: listarRecursosDeCard
      summary: Lista os recursos de card disponíveis
      description: Devolve a finalidade didática, as operações, os exercícios e os alvos de lacuna de cada recurso da linguagem autoral formal.
      x-openai-isConsequential: false
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/contracts/resources/{resource}:
    get:
      operationId: consultarRecursoDeCard
      summary: Consulta a linguagem formal de um recurso
      description: Devolve campos, regras, alvos de lacuna e exemplo válido. Marcadores {gap:id} identificam campos formais; texto livre nunca identifica o alvo.
      x-openai-isConsequential: false
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AuthoringResourceName"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/catalog/collections:
    get:
      operationId: listarColecoesDoCatalogo
      summary: Lista as coleções oficiais
      description: Inclui coleções vazias e oferece busca e paginação estável.
      x-openai-isConsequential: false
      parameters:
        - $ref: "#/components/parameters/CatalogLimit"
        - $ref: "#/components/parameters/CatalogAfterPosition"
        - $ref: "#/components/parameters/CatalogAfterId"
        - $ref: "#/components/parameters/CatalogQuery"
        - name: includeRetired
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: criarColecaoDoCatalogo
      summary: Cria uma coleção oficial vazia
      description: Exige o papel owner e posiciona a nova coleção no fim da ordem atual.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogCollectionRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/catalog/collections/order:
    put:
      operationId: reordenarColecoesDoCatalogo
      summary: Substitui a ordem das coleções ativas
      description: Exige o papel owner e a revisão atual de cada coleção.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderCatalogCollectionsRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/catalog/collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/CatalogCollectionId"
    patch:
      operationId: renomearColecaoDoCatalogo
      summary: Altera os metadados de uma coleção
      description: Exige o papel owner e preserva os cursos associados.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameCatalogCollectionRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/catalog/collections/{collectionId}/retire:
    parameters:
      - $ref: "#/components/parameters/CatalogCollectionId"
    post:
      operationId: aposentarColecaoDoCatalogo
      summary: Aposenta uma coleção
      description: Move os cursos para outra coleção e aposenta a origem na mesma transação.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetireCatalogCollectionRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/catalog/collections/{collectionId}/courses:
    parameters:
      - $ref: "#/components/parameters/CatalogCollectionId"
    get:
      operationId: listarCursosDaColecao
      summary: Lista os cursos oficiais de uma coleção
      description: Devolve metadados, posição e revisão, sem transferir a árvore didática.
      x-openai-isConsequential: false
      parameters:
        - $ref: "#/components/parameters/CatalogLimit"
        - $ref: "#/components/parameters/CatalogAfterPosition"
        - $ref: "#/components/parameters/CatalogAfterId"
        - $ref: "#/components/parameters/CatalogQuery"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/catalog/collections/{collectionId}/courses/order:
    parameters:
      - $ref: "#/components/parameters/CatalogCollectionId"
    put:
      operationId: reordenarCursosDaColecao
      summary: Substitui a ordem dos cursos da coleção
      description: Exige a revisão atual de cada associação e não altera o conteúdo dos cursos.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderCatalogCoursesRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/catalog/courses/{courseId}:
    parameters:
      - $ref: "#/components/parameters/CatalogCourseId"
    get:
      operationId: consultarCursoDoCatalogo
      summary: Consulta um curso oficial
      description: Devolve metadados, coleção, revisão e contagens, sem a árvore didática.
      x-openai-isConsequential: false
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/catalog/courses/{courseId}/placement:
    parameters:
      - $ref: "#/components/parameters/CatalogCourseId"
    put:
      operationId: moverCursoNoCatalogo
      summary: Move um curso para outra coleção
      description: Conserva o curso e substitui somente sua classificação ativa.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveCatalogCourseRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/library/courses:
    get:
      operationId: listarCursosDaBibliotecaPessoal
      summary: Lista os cursos selecionados da conta
      description: Devolve cursos oficiais selecionados e cursos pessoais publicados, inclusive a trilha atual. A consulta nunca expõe a biblioteca de outra conta.
      x-openai-isConsequential: false
      parameters:
        - $ref: "#/components/parameters/PersonalLibraryLimit"
        - $ref: "#/components/parameters/PersonalAfterPosition"
        - $ref: "#/components/parameters/PersonalAfterSelectionId"
        - $ref: "#/components/parameters/PersonalLibraryQuery"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/library/paths:
    get:
      operationId: listarTrilhasPessoais
      summary: Lista as trilhas da conta
      description: Devolve as trilhas em ordem e a quantidade de cursos que permanecem em Sem trilha.
      x-openai-isConsequential: false
      parameters:
        - $ref: "#/components/parameters/PersonalLibraryLimit"
        - $ref: "#/components/parameters/PersonalAfterPosition"
        - $ref: "#/components/parameters/PersonalAfterPathId"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: criarTrilhaPessoal
      summary: Cria uma trilha pessoal
      description: Cria uma trilha vazia no fim da biblioteca da conta.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalStudyPathRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/library/paths/{pathId}:
    parameters:
      - $ref: "#/components/parameters/PersonalPathId"
    patch:
      operationId: renomearTrilhaPessoal
      summary: Renomeia uma trilha pessoal
      description: Altera somente o título de uma trilha pertencente à conta.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenamePersonalStudyPathRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: excluirTrilhaPessoal
      summary: Exclui uma trilha pessoal
      description: Retira somente a trilha. Seus cursos voltam para Sem trilha; cursos, progresso e comentários permanecem intactos.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletePersonalStudyPathRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/library/selections/{selectionId}/path:
    parameters:
      - $ref: "#/components/parameters/PersonalSelectionId"
    put:
      operationId: moverCursoParaTrilha
      summary: Move um curso selecionado para uma trilha
      description: Associa a seleção a uma trilha da mesma conta. targetPathId igual a null move o curso para Sem trilha.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovePersonalCourseSelectionRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/integrations:
    get:
      operationId: listarIntegracoesPessoais
      summary: Lista as integrações pessoais da conta
      description: Retorna somente metadados; chaves e hashes nunca aparecem na listagem.
      security:
        - SupabaseBearer: []
      x-openai-isConsequential: false
      responses:
        "200":
          $ref: "#/components/responses/IntegrationListSuccess"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: criarIntegracaoPessoal
      summary: Emite uma chave para autoria privada
      description: Exige uma sessão Supabase. A chave aparece somente na primeira resposta e recebe os três escopos privados fixos; ela nunca permite publicar no catálogo.
      security:
        - SupabaseBearer: []
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrivateIntegrationRequest"
      responses:
        "200":
          $ref: "#/components/responses/IntegrationIssueSuccess"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/integrations/{clientId}/rotate:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    post:
      operationId: renovarIntegracaoPessoal
      summary: Substitui uma chave pessoal e revoga a anterior
      security:
        - SupabaseBearer: []
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotatePrivateIntegrationRequest"
      responses:
        "200":
          $ref: "#/components/responses/IntegrationIssueSuccess"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/integrations/{clientId}:
    parameters:
      - $ref: "#/components/parameters/IntegrationId"
    delete:
      operationId: revogarIntegracaoPessoal
      summary: Revoga uma integração pessoal da própria conta
      security:
        - SupabaseBearer: []
      x-openai-isConsequential: true
      responses:
        "200":
          $ref: "#/components/responses/IntegrationMetadataSuccess"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs:
    get:
      operationId: listarExecucoesDeAutoria
      summary: Lista execuções recentes do autor
      x-openai-isConsequential: false
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: beforeUpdatedAt
          in: query
          schema:
            type: string
            format: date-time
        - name: beforeRunId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: criarExecucaoDeAutoria
      summary: Cria uma execução de autoria
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: consultarExecucaoDeAutoria
      summary: Consulta a execução e suas partes
      x-openai-isConsequential: false
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/plan:
    parameters:
      - $ref: "#/components/parameters/RunId"
    put:
      operationId: gravarPlanoDeAutoria
      summary: Grava o plano e a ordem das partes
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/ledger/{section}/{position}:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/LedgerSection"
      - $ref: "#/components/parameters/LedgerPosition"
    put:
      operationId: gravarTrechoDoRegistro
      summary: Grava um trecho de fontes, afirmações ou termos
      description: O corpo pode ocupar até 64 KiB e items, até 60 KiB.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerChunkRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "413":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/plan/finalize:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: finalizarPlanoDeAutoria
      summary: Confere o manifesto e finaliza o planejamento
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanFinalizeRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/next-part:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: consultarProximaParte
      summary: Consulta a próxima parte a produzir ou corrigir
      description: Clientes por chave recebem no máximo 90 KiB; uma parte maior exige novo planejamento.
      x-openai-isConsequential: false
      responses:
        "200":
          $ref: "#/components/responses/NextPartSuccess"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/parts/{partKey}:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/PartKey"
    put:
      operationId: gravarParteDoCurso
      summary: Grava uma parte produzida, reparada ou reconstruída
      description: O fragmento deve ocupar menos de 90 kB, corresponder integralmente à part-spec consultada e repetir attempt e baseLedgerSha256 dessa especificação.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/parts/{partKey}/specification:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/PartKey"
    put:
      operationId: gravarEspecificacaoDaParte
      summary: Grava a orientação detalhada da próxima parte
      description: A especificação pode ocupar até 48 KiB e deve coincidir com o contorno do plano.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartSpecificationRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/parts/{partKey}/submission:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/PartKey"
    get:
      operationId: consultarEntregaDaParte
      summary: Relê a entrega persistida antes da auditoria
      description: Devolve exatamente a tentativa, o hash, o fragmento, as evidências e o estado de continuidade gravados para a parte, além de um submissionReadReceipt assinado e temporário. O auditor deve usar este conteúdo e devolver o comprovante, não uma cópia conservada apenas no contexto da conversa.
      x-openai-isConsequential: false
      responses:
        "200":
          $ref: "#/components/responses/PartSubmissionSuccess"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/parts/{partKey}/audit:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/PartKey"
    post:
      operationId: auditarParteDoCurso
      summary: Aprova a parte ou solicita reparo ou reconstrução
      description: Audita exatamente a tentativa e o submissionSha256 devolvidos pela leitura persistida. Aprovação exige os dez critérios verdadeiros e nenhum achado.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/parts/{partKey}/reopen:
    parameters:
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/PartKey"
    post:
      operationId: reabrirParteDoCurso
      summary: Reabre uma parte aprovada indicada pela validação final
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReopenPartRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/validate:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: validarCursoProduzido
      summary: Valida o curso remontado e a representação relacional
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/block:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: bloquearExecucaoDeAutoria
      summary: Registra uma dúvida que impede a continuação segura
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/resume:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: retomarExecucaoDeAutoria
      summary: Retoma uma execução após a decisão do usuário
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/deliver:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: entregarFaseDeAutoria
      summary: Registra uma entrega e aguarda aprovação explícita
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/approve-delivery:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: aprovarEntregaDeAutoria
      summary: Aprova uma entrega pendente
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryApprovalRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: cancelarExecucaoDeAutoria
      summary: Cancela uma execução que não deve prosseguir
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/runs/{runId}/publish:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: publicarCursoNoCatalogo
      summary: Publica atomicamente um curso validado
      description: "Para target catalog, publica no catálogo oficial e exige permissão editorial. Para target private, associa a revisão imutável somente ao autor e a seleciona em sua conta. HTTP 202 com status accepted ou running informa que a intenção já foi aceita ou que outro executor possui a lease: aguarde pollAfterSeconds e repita esta mesma operação com o mesmo requestId até receber HTTP 200. Nenhuma revisão parcial fica visível."
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "200":
          $ref: "#/components/responses/PublicationCompleted"
        "202":
          $ref: "#/components/responses/PublicationAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/imports:
    post:
      operationId: importarDocumentoAraLearn
      summary: Importa manualmente um documento AraLearn v3
      description: Exceção destinada ao upload manual para o catálogo ou para a biblioteca privada. A revisão completa é validada e gravada como artefato imutável no Storage.
      x-openai-isConsequential: true
      security:
        - SupabaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    AuthoringApiKey:
      type: apiKey
      in: header
      name: X-AraLearn-API-Key
      description: Chave rotacionável com prefixo arl_ e escopos restritos.
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CatalogCollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatalogCourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseRevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatalogLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CatalogAfterPosition:
      name: afterPosition
      in: query
      description: Posição devolvida em nextCursor. Use junto com afterId.
      schema:
        type: integer
        minimum: 0
    CatalogAfterId:
      name: afterId
      in: query
      description: UUID devolvido em nextCursor. Use junto com afterPosition.
      schema:
        type: string
        format: uuid
    CatalogQuery:
      name: query
      in: query
      schema:
        type: string
        maxLength: 200
    PersonalCourseId:
      name: courseId
      in: path
      required: true
      description: UUID de um curso selecionado pela conta.
      schema:
        type: string
        format: uuid
    PersonalPathId:
      name: pathId
      in: path
      required: true
      description: UUID de uma trilha pertencente à conta.
      schema:
        type: string
        format: uuid
    PersonalSelectionId:
      name: selectionId
      in: path
      required: true
      description: UUID da seleção pessoal de um curso.
      schema:
        type: string
        format: uuid
    PersonalLibraryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PersonalStructureLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PersonalAfterPosition:
      name: afterPosition
      in: query
      description: Posição devolvida em nextCursor; use junto com o UUID correspondente.
      schema:
        type: integer
        minimum: 0
    PersonalAfterSelectionId:
      name: afterSelectionId
      in: query
      description: UUID devolvido em nextCursor; use junto com afterPosition.
      schema:
        type: string
        format: uuid
    PersonalAfterPathId:
      name: afterPathId
      in: query
      description: UUID devolvido em nextCursor; use junto com afterPosition.
      schema:
        type: string
        format: uuid
    PersonalAfterId:
      name: afterId
      in: query
      description: UUID devolvido em nextCursor; use junto com afterPosition.
      schema:
        type: string
        format: uuid
    PersonalLibraryQuery:
      name: query
      in: query
      schema:
        type: string
        maxLength: 160
    PersonalStructureSection:
      name: section
      in: query
      schema:
        type: string
        enum:
          - modules
          - lessons
          - microsequences
          - cards
        default: modules
    PersonalParentId:
      name: parentId
      in: query
      description: UUID do módulo, da lição ou da microssequência que contém a seção solicitada. Não informe ao consultar módulos.
      schema:
        type: string
        format: uuid
    IntegrationId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartKey:
      name: partKey
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
    LedgerSection:
      name: section
      in: path
      required: true
      schema:
        type: string
        enum:
          - sources
          - claims
          - terms
    LedgerPosition:
      name: position
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 999
  schemas:
    AuthoringResourceName:
      type: string
      enum:
        - paragraph
        - choice
        - composite
        - code
        - table
        - flow
        - tree
        - graph
        - relation_map
        - matrix
        - plane
        - formula
    AuthoringGap:
      type: object
      additionalProperties: false
      required:
        - id
        - response
        - answer
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        response:
          enum:
            - choice
            - text
        answer:
          type: string
          minLength: 1
          maxLength: 120
        distractors:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 120
        acceptedAnswers:
          type: array
          minItems: 0
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 120
      allOf:
        - if:
            properties:
              response:
                const: choice
            required:
              - response
          then:
            required:
              - distractors
            not:
              required:
                - acceptedAnswers
          else:
            not:
              required:
                - distractors
      description: Declara uma lacuna da linguagem autoral. O marcador {gap:id} aparece uma única vez em um campo formal aceito pelo recurso. A resposta choice exige distratores. A resposta text admite até oito respostas literais equivalentes em acceptedAnswers, além da normalização objetiva. A sintaxe interna [[...]] não deve ser enviada pelo cliente.
    RequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
      description: Identificador idempotente, novo para cada intenção do cliente.
    CatalogRevision:
      type: integer
      minimum: 1
      description: Revisão devolvida pela consulta administrativa mais recente.
    CatalogCollectionOrderItem:
      type: object
      additionalProperties: false
      required:
        - collectionId
        - baseRevision
      properties:
        collectionId:
          type: string
          format: uuid
        baseRevision:
          $ref: "#/components/schemas/CatalogRevision"
    CatalogCourseOrderItem:
      type: object
      additionalProperties: false
      required:
        - courseId
        - baseRevision
      properties:
        courseId:
          type: string
          format: uuid
        baseRevision:
          $ref: "#/components/schemas/CatalogRevision"
    CreateCatalogCollectionRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - contractKey
        - title
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        contractKey:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-z0-9][a-z0-9-]{0,119}$
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 1000
    RenameCatalogCollectionRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - baseRevision
        - title
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        baseRevision:
          $ref: "#/components/schemas/CatalogRevision"
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 1000
    RetireCatalogCollectionRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - baseRevision
        - replacementCollectionId
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        baseRevision:
          $ref: "#/components/schemas/CatalogRevision"
        replacementCollectionId:
          type: string
          format: uuid
    ReorderCatalogCollectionsRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - order
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        order:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/CatalogCollectionOrderItem"
    ReorderCatalogCoursesRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - order
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        order:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/CatalogCourseOrderItem"
    MoveCatalogCourseRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - baseRevision
        - targetCollectionId
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        baseRevision:
          $ref: "#/components/schemas/CatalogRevision"
        targetCollectionId:
          type: string
          format: uuid
    CreatePersonalStudyPathRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - title
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        title:
          type: string
          minLength: 1
          maxLength: 120
    RenamePersonalStudyPathRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - title
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        title:
          type: string
          minLength: 1
          maxLength: 120
    DeletePersonalStudyPathRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
    MovePersonalCourseSelectionRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - targetPathId
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        targetPathId:
          type:
            - string
            - "null"
          format: uuid
          description: UUID da trilha de destino ou null para Sem trilha.
    CreatePrivateIntegrationRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - name
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        name:
          type: string
          minLength: 1
          maxLength: 80
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    RotatePrivateIntegrationRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    PrivateIntegrationMetadata:
      type: object
      required:
        - clientId
        - name
        - keyPrefix
        - scopes
        - rateLimitPerMinute
        - active
      properties:
        clientId:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
              - authoring:private:read
              - authoring:private:write
              - authoring:private:audit
        rateLimitPerMinute:
          type: integer
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        rotatedFromClientId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        active:
          type: boolean
        idempotent:
          type: boolean
      additionalProperties: false
    PrivateIntegrationIssue:
      type: object
      required:
        - clientId
        - name
        - keyPrefix
        - scopes
        - rateLimitPerMinute
        - active
        - secretAvailable
      properties:
        clientId:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
              - authoring:private:read
              - authoring:private:write
              - authoring:private:audit
        rateLimitPerMinute:
          type: integer
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        rotatedFromClientId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        active:
          type: boolean
        idempotent:
          type: boolean
        secretAvailable:
          type: boolean
        apiKey:
          type: string
          pattern: ^arl_[A-Za-z0-9_-]{24,192}$
          description: Presente somente na primeira resposta da emissão ou renovação.
      additionalProperties: false
    PrivateIntegrationList:
      type: object
      required:
        - items
        - activeCount
        - activeLimit
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PrivateIntegrationMetadata"
        activeCount:
          type: integer
          minimum: 0
        activeLimit:
          type: integer
          const: 5
      additionalProperties: false
    CreateRunRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - target
        - title
        - contractKey
        - brief
        - publicationIntent
      properties:
        requestId:
          $ref: "#/components/schemas/RequestId"
        target:
          type: string
          enum:
            - catalog
            - private
          description: catalog exige permissão editorial; private pertence somente ao autor. Atualizações exigem a revisão-base vigente.
        title:
          type: string
          minLength: 1
          maxLength: 300
          pattern: \S
        contractKey:
          type: string
          minLength: 1
          maxLength: 240
        collectionId:
          type:
            - string
            - "null"
          format: uuid
        brief:
          type: object
          additionalProperties: true
        publicationIntent:
          $ref: "#/components/schemas/PublicationIntent"
      allOf:
        - if:
            properties:
              target:
                const: private
            required:
              - target
          then:
            properties:
              collectionId:
                type: "null"
              publicationIntent:
                type: object
                additionalProperties: false
                required:
                  - mode
                properties:
                  mode:
                    const: create
        - if:
            properties:
              publicationIntent:
                type: object
                properties:
                  mode:
                    const: update
                required:
                  - mode
            required:
              - publicationIntent
          then:
            properties:
              target:
                const: catalog
    PublicationIntent:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - mode
          properties:
            mode:
              const: create
        - type: object
          additionalProperties: false
          required:
            - mode
            - existingCourseId
            - expectedContentHash
          properties:
            mode:
              const: update
            existingCourseId:
              type: string
              format: uuid
            expectedContentHash:
              type: string
              pattern: ^[a-f0-9]{64}$
    ProjectGuide:
      type: object
      additionalProperties: false
      required:
        - goal
        - include
        - exclude
        - notation
        - avoid
      properties:
        goal:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: \S
        include:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: ^\S(?:[\s\S]*\S)?$
        exclude:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: ^\S(?:[\s\S]*\S)?$
        notation:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: ^\S(?:[\s\S]*\S)?$
        avoid:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: ^\S(?:[\s\S]*\S)?$
    ProjectTopic:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - kind
        - checks
        - errors
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
        label:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: \S
        kind:
          enum:
            - concept
            - procedure
            - representation
            - term
        checks:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: ^\S(?:[\s\S]*\S)?$
        errors:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 500
            pattern: ^\S(?:[\s\S]*\S)?$
    PartOwnership:
      type: object
      required:
        - courseId
        - moduleId
        - lessonId
        - microsequenceIds
      properties:
        courseId:
          type: string
          minLength: 1
          maxLength: 160
        moduleId:
          type: string
          minLength: 1
          maxLength: 160
        lessonId:
          type: string
          minLength: 1
          maxLength: 160
        microsequenceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 160
      additionalProperties: false
    PlanPart:
      type: object
      required:
        - key
        - title
        - boundary
        - cutReason
        - dependsOnPartKeys
        - ownership
        - cardIds
        - outcomeIds
        - conceptIds
        - operationIds
        - misconceptionIds
      properties:
        key:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        title:
          type: string
          minLength: 1
          maxLength: 300
        ownership:
          $ref: "#/components/schemas/PartOwnership"
        boundary:
          type: string
          minLength: 1
        cutReason:
          type: string
          minLength: 1
        dependsOnPartKeys:
          type: array
          uniqueItems: true
          items:
            type: string
        cardIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 160
        outcomeIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 160
        conceptIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 160
        operationIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 160
        misconceptionIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 160
      additionalProperties: false
    LearningOutcome:
      type: object
      additionalProperties: false
      required:
        - id
        - statement
        - evidence
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
        statement:
          type: string
          minLength: 1
          maxLength: 20000
        evidence:
          type: string
          minLength: 1
          maxLength: 20000
    LearningConcept:
      type: object
      additionalProperties: false
      required:
        - id
        - label
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$
        label:
          type: string
          minLength: 1
          maxLength: 1000
    ConceptRelation:
      type: object
      additionalProperties: false
      description: Relação formal do recorte conceitual. Em requires, from depende da apresentação causal anterior de to.
      required:
        - from
        - to
        - relation
      properties:
        from:
          type: string
          minLength: 1
          maxLength: 160
