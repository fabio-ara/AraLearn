                  - independent_practice
                  - contrast
                  - error_diagnosis
                  - integration
              contextAnchors:
                type: array
                minItems: 1
          else:
            properties:
              learningFunction:
                enum:
                  - foundation
                  - worked_example
        - if:
            properties:
              learningFunction:
                const: error_diagnosis
            required:
              - learningFunction
          then:
            properties:
              misconceptionIds:
                type: array
                minItems: 1
