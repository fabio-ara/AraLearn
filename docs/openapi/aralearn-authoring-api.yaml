      required:
        - chunkCount
        - itemCount
      properties:
        chunkCount:
          type: integer
          minimum: 0
          maximum: 1000
        itemCount:
          type: integer
          minimum: 0
          maximum: 100000
      allOf:
        - if:
            properties:
              chunkCount:
                const: 0
            required:
              - chunkCount
          then:
            properties:
              itemCount:
                const: 0
          else:
            properties:
              itemCount:
                minimum: 1
        - if:
            properties:
              itemCount:
                const: 0
            required:
              - itemCount
          then:
            properties:
              chunkCount:
                const: 0
          else:
            properties:
              chunkCount:
                minimum: 1
