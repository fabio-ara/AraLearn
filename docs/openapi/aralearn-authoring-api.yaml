        - stateDelta
        - latestAudit
      properties:
        runId:
          type: string
          format: uuid
        partKey:
          type: string
        position:
          type: integer
          minimum: 0
        title:
          type: string
        status:
          type: string
        attempt:
          type: integer
          minimum: 0
        baseLedgerSha256:
          type:
            - string
            - "null"
          pattern: ^[a-f0-9]{64}$
        fragmentHash:
          type:
            - string
            - "null"
          pattern: ^[a-f0-9]{64}$
        submissionSha256:
          type:
            - string
            - "null"
          pattern: ^[a-f0-9]{64}$
        submissionReadReceipt:
          type: string
          minLength: 40
          maxLength: 4096
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
        specification:
          type: object
          additionalProperties: true
        fragment:
          type:
            - object
            - "null"
          additionalProperties: true
        evidence:
          type: array
          items:
            type: object
            additionalProperties: true
        stateDelta:
          type: object
          additionalProperties: true
        submittedAt:
          type:
            - string
            - "null"
          format: date-time
        latestAudit:
          type:
            - object
            - "null"
          additionalProperties: true
    PartSubmissionEnvelope:
      type: object
      required:
        - ok
        - requestId
        - data
      properties:
        ok:
          const: true
        requestId:
          type: string
        data:
          $ref: "#/components/schemas/PartSubmission"
      additionalProperties: false
    PublicationProgress:
      type: object
      required:
        - status
        - runId
      properties:
        status:
          enum:
            - publishing
            - published
        phase:
          type: string
          enum:
            - staging
            - finalizing
        runId:
          type: string
          format: uuid
        courseId:
          type:
            - string
            - "null"
          format: uuid
        documentHash:
          type:
            - string
            - "null"
          pattern: ^[a-f0-9]{64}$
        percent:
          type: integer
          minimum: 0
          maximum: 100
        nextStep:
          type: integer
          minimum: 0
        totalSteps:
          type: integer
          minimum: 1
        pollAfterSeconds:
          type: integer
          minimum: 1
          maximum: 45
        leaseAcquired:
          type: boolean
        idempotent:
          type: boolean
        visibility:
          type: string
          enum:
            - catalog
            - private
        publicationError:
          type: object
          additionalProperties: true
      additionalProperties: true
    PublicationEnvelope:
      type: object
      required:
        - ok
        - requestId
        - data
      properties:
        ok:
          const: true
        requestId:
          type: string
        data:
          $ref: "#/components/schemas/PublicationProgress"
      additionalProperties: false
    NextPartEnvelope:
      type: object
      required:
        - ok
        - requestId
        - data
      properties:
        ok:
          const: true
        requestId:
          type: string
        data:
          $ref: "#/components/schemas/NextPart"
      additionalProperties: false
    SuccessEnvelope:
      type: object
      required:
        - ok
        - requestId
        - data
      properties:
        ok:
          const: true
        requestId:
          type: string
        data: {}
    IntegrationMetadataEnvelope:
      type: object
      required:
        - ok
        - requestId
        - data
      properties:
        ok:
          const: true
        requestId:
          type:
            - string
            - "null"
        data:
          $ref: "#/components/schemas/PrivateIntegrationMetadata"
      additionalProperties: false
    IntegrationIssueEnvelope:
      type: object
      required:
        - ok
        - requestId
        - data
      properties:
        ok:
          const: true
        requestId:
          type: string
        data:
          $ref: "#/components/schemas/PrivateIntegrationIssue"
      additionalProperties: false
    IntegrationListEnvelope:
      type: object
      required:
        - ok
        - requestId
        - data
      properties:
        ok:
          const: true
        requestId:
          type:
            - string
            - "null"
        data:
          $ref: "#/components/schemas/PrivateIntegrationList"
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required:
        - ok
        - requestId
        - error
      properties:
        ok:
          const: false
        requestId:
          type: string
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
  responses:
    IntegrationMetadataSuccess:
      description: Integração revogada ou já inativa, sem qualquer segredo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationMetadataEnvelope"
    IntegrationIssueSuccess:
      description: Integração emitida ou renovada; a primeira resposta contém a chave.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationIssueEnvelope"
    IntegrationListSuccess:
      description: Metadados das integrações pessoais da conta autenticada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IntegrationListEnvelope"
    PublicationAccepted:
      description: Progresso persistido; repita publicarCursoNoCatalogo com o mesmo requestId.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicationEnvelope"
    PublicationCompleted:
      description: Curso publicado e visível no catálogo.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicationEnvelope"
    NextPartSuccess:
      description: Próxima parte enriquecida com orientação, tentativa e continuidade acumulada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NextPartEnvelope"
    PartSubmissionSuccess:
      description: Entrega persistida que deve ser usada como entrada da auditoria.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PartSubmissionEnvelope"
    Success:
      description: Operação concluída ou repetição idempotente confirmada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    Error:
      description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
