openapi: 3.1.0
info:
  title: API de autoria do AraLearn
  version: 1.0.0
  license:
    name: MIT
    url: https://github.com/fabio-ara/AraLearn/blob/main/LICENSE.md
  description: >-
    Opera uma execução de autoria em partes. O cliente planeja, produz cada parte,
    audita, repara quando necessário, valida o conjunto e solicita a publicação.
servers:
  - url: https://{projectRef}.supabase.co/functions/v1/aralearn-authoring-api
    variables:
      projectRef:
        default: seu-projeto
security:
  - AuthoringApiKey: []
  - SupabaseBearer: []
paths:
  /v1/integrations:
    get:
      operationId: listarIntegracoesPessoais
      summary: Lista as integrações pessoais da conta
      description: Retorna somente metadados; chaves e hashes nunca aparecem na listagem.
      security:
        - SupabaseBearer: []
      x-openai-isConsequential: false
      responses:
        '200':
          $ref: '#/components/responses/IntegrationListSuccess'
        '401':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: criarIntegracaoPessoal
      summary: Emite uma chave para autoria privada
      description: >-
        Exige uma sessão Supabase. A chave aparece somente na primeira resposta e
        recebe os três escopos privados fixos; ela nunca permite publicar no catálogo.
      security:
        - SupabaseBearer: []
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrivateIntegrationRequest'
      responses:
        '200':
          $ref: '#/components/responses/IntegrationIssueSuccess'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/integrations/{clientId}/rotate:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
    post:
      operationId: renovarIntegracaoPessoal
      summary: Substitui uma chave pessoal e revoga a anterior
      security:
        - SupabaseBearer: []
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotatePrivateIntegrationRequest'
      responses:
        '200':
          $ref: '#/components/responses/IntegrationIssueSuccess'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/integrations/{clientId}:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
    delete:
      operationId: revogarIntegracaoPessoal
      summary: Revoga uma integração pessoal da própria conta
      security:
        - SupabaseBearer: []
      x-openai-isConsequential: true
      responses:
        '200':
          $ref: '#/components/responses/IntegrationMetadataSuccess'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs:
    get:
      operationId: listarExecucoesDeAutoria
      summary: Lista execuções recentes do autor
      x-openai-isConsequential: false
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: beforeUpdatedAt
          in: query
          schema: { type: string, format: date-time }
        - name: beforeRunId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: criarExecucaoDeAutoria
      summary: Cria uma execução de autoria
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: consultarExecucaoDeAutoria
      summary: Consulta a execução e suas partes
      x-openai-isConsequential: false
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/plan:
    parameters:
      - $ref: '#/components/parameters/RunId'
    put:
      operationId: gravarPlanoDeAutoria
      summary: Grava o plano e a ordem das partes
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/ledger/{section}/{position}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/LedgerSection'
      - $ref: '#/components/parameters/LedgerPosition'
    put:
      operationId: gravarTrechoDoRegistro
      summary: Grava um trecho de fontes, afirmações ou termos
      description: O corpo pode ocupar até 64 KiB e items, até 60 KiB.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerChunkRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '413':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/plan/finalize:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: finalizarPlanoDeAutoria
      summary: Confere o manifesto e finaliza o planejamento
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanFinalizeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/next-part:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: consultarProximaParte
      summary: Consulta a próxima parte a produzir ou corrigir
      description: Clientes por chave recebem no máximo 90 KiB; uma parte maior exige novo planejamento.
      x-openai-isConsequential: false
      responses:
        '200':
          $ref: '#/components/responses/NextPartSuccess'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/parts/{partKey}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PartKey'
    put:
      operationId: gravarParteDoCurso
      summary: Grava uma parte produzida, reparada ou reconstruída
      description: >-
        O fragmento deve ocupar menos de 90 kB, corresponder integralmente à part-spec
        consultada e repetir attempt e baseLedgerSha256 dessa especificação.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/parts/{partKey}/specification:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PartKey'
    put:
      operationId: gravarEspecificacaoDaParte
      summary: Grava a orientação detalhada da próxima parte
      description: A especificação pode ocupar até 48 KiB e deve coincidir com o contorno do plano.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartSpecificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/parts/{partKey}/submission:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PartKey'
    get:
      operationId: consultarEntregaDaParte
      summary: Relê a entrega persistida antes da auditoria
      description: >-
        Devolve exatamente a tentativa, o hash, o fragmento, as evidências e o estado
        de continuidade gravados para a parte, além de um submissionReadReceipt
        assinado e temporário. O auditor deve usar este conteúdo e devolver o
        comprovante, não uma cópia conservada apenas no contexto da conversa.
      x-openai-isConsequential: false
      responses:
        '200':
          $ref: '#/components/responses/PartSubmissionSuccess'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/parts/{partKey}/audit:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PartKey'
    post:
      operationId: auditarParteDoCurso
      summary: Aprova a parte ou solicita reparo ou reconstrução
      description: >-
        Audita exatamente a tentativa e o submissionSha256 devolvidos pela leitura
        persistida. Aprovação exige os dez critérios verdadeiros e nenhum achado.
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/parts/{partKey}/reopen:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/PartKey'
    post:
      operationId: reabrirParteDoCurso
      summary: Reabre uma parte aprovada indicada pela validação final
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReopenPartRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/validate:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: validarCursoProduzido
      summary: Valida o curso remontado e a representação relacional
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/block:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: bloquearExecucaoDeAutoria
      summary: Registra uma dúvida que impede a continuação segura
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/resume:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: retomarExecucaoDeAutoria
      summary: Retoma uma execução após a decisão do usuário
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: cancelarExecucaoDeAutoria
      summary: Cancela uma execução que não deve prosseguir
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/runs/{runId}/publish:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: publicarCursoNoCatalogo
      summary: Publica atomicamente um curso validado
      description: >-
        Para target catalog, publica no catálogo oficial e exige permissão editorial.
        Para target private, cria uma árvore relacional visível somente ao autor e a
        seleciona em sua conta. Cada chamada termina em até 45 segundos. HTTP 202
        com status publishing confirma progresso persistido: aguarde pollAfterSeconds e repita esta mesma
        operação com o mesmo requestId até receber HTTP 200. Nenhuma árvore parcial
        fica visível.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/PublicationCompleted'
        '202':
          $ref: '#/components/responses/PublicationAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/imports:
    post:
      operationId: importarDocumentoAraLearn
      summary: Importa manualmente um documento AraLearn v3
      description: >-
        Exceção destinada ao upload manual. A autoria assistida deve usar partes e
        nunca enviar o curso inteiro por este endpoint.
      x-openai-isConsequential: true
      security:
        - SupabaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    AuthoringApiKey:
      type: apiKey
      in: header
      name: X-AraLearn-API-Key
      description: Chave rotacionável com prefixo arl_ e escopos restritos.
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IntegrationId:
      name: clientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartKey:
      name: partKey
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    LedgerSection:
      name: section
      in: path
      required: true
      schema:
        type: string
        enum: [sources, claims, terms]
    LedgerPosition:
      name: position
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 999
  schemas:
    RequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
      description: Identificador idempotente, novo para cada intenção do cliente.
    CreatePrivateIntegrationRequest:
      type: object
      additionalProperties: false
      required: [requestId, name]
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        name:
          type: string
          minLength: 1
          maxLength: 80
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    RotatePrivateIntegrationRequest:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    PrivateIntegrationMetadata:
      type: object
      required: [clientId, name, keyPrefix, scopes, rateLimitPerMinute, active]
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string }
        keyPrefix: { type: string }
        scopes:
          type: array
          items:
            type: string
            enum:
              - authoring:private:read
              - authoring:private:write
              - authoring:private:audit
        rateLimitPerMinute: { type: integer }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        rotatedFromClientId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        active: { type: boolean }
        idempotent: { type: boolean }
      additionalProperties: false
    PrivateIntegrationIssue:
      type: object
      required:
        - clientId
        - name
        - keyPrefix
        - scopes
        - rateLimitPerMinute
        - active
        - secretAvailable
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string }
        keyPrefix: { type: string }
        scopes:
          type: array
          items:
            type: string
            enum:
              - authoring:private:read
              - authoring:private:write
              - authoring:private:audit
        rateLimitPerMinute: { type: integer }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        rotatedFromClientId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        active: { type: boolean }
        idempotent: { type: boolean }
        secretAvailable: { type: boolean }
        apiKey:
          type: string
          pattern: '^arl_[A-Za-z0-9_-]{24,192}$'
          description: Presente somente na primeira resposta da emissão ou renovação.
      additionalProperties: false
    PrivateIntegrationList:
      type: object
      required: [items, activeCount, activeLimit]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrivateIntegrationMetadata'
        activeCount: { type: integer, minimum: 0 }
        activeLimit: { type: integer, const: 5 }
      additionalProperties: false
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [requestId, target, title, contractKey, brief, publicationIntent]
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        target:
          type: string
          enum: [catalog, private]
          description: >-
            catalog exige permissão editorial; private pertence somente ao autor e
            aceita apenas publicationIntent.mode igual a create.
        title:
          type: string
          minLength: 1
          maxLength: 300
        contractKey:
          type: string
          minLength: 1
          maxLength: 240
        collectionId:
          type: [string, 'null']
          format: uuid
        brief:
          type: object
          additionalProperties: true
        publicationIntent:
          $ref: '#/components/schemas/PublicationIntent'
    PublicationIntent:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { const: create }
        - type: object
          additionalProperties: false
          required: [mode, existingCourseId, expectedContentHash]
          properties:
            mode: { const: update }
            existingCourseId: { type: string, format: uuid }
            expectedContentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    PartOwnership:
      type: object
      required: [courseId, moduleId, lessonId, microsequenceIds]
      properties:
        courseId: { type: string, minLength: 1, maxLength: 160 }
        moduleId: { type: string, minLength: 1, maxLength: 160 }
        lessonId: { type: string, minLength: 1, maxLength: 160 }
        microsequenceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 160 }
      additionalProperties: false
    PlanPart:
      type: object
      required: [key, title, boundary, cutReason, dependsOnPartKeys, ownership, cardIds, outcomeIds]
      properties:
        key:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        title:
          type: string
          minLength: 1
          maxLength: 300
        ownership:
          $ref: '#/components/schemas/PartOwnership'
        boundary: { type: string, minLength: 1 }
        cutReason: { type: string, minLength: 1 }
        dependsOnPartKeys:
          type: array
          uniqueItems: true
          items: { type: string }
        cardIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 160 }
        outcomeIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 160 }
      additionalProperties: false
    LearningOutcome:
      type: object
      additionalProperties: false
      required: [id, statement, evidence]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$'
        statement:
          type: string
          minLength: 1
          maxLength: 20000
        evidence:
          type: string
          minLength: 1
          maxLength: 20000
    PlanRequest:
      type: object
      additionalProperties: false
      required: [requestId, plan]
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        plan:
          type: object
          description: >-
            Plano compacto de até 96 KiB para clientes por chave. O registro e as
            especificações detalhadas seguem em chamadas separadas.
          required: [artifact, version, runId, project, ledgerManifest, course, learningOutcomes, conceptMap, parts, acceptanceCriteria]
          properties:
            artifact:
              const: aralearn.course-plan
            version:
              const: 1
            runId:
              type: string
              format: uuid
            project:
              type: object
              description: >-
                Documento aralearn.contract versão 3 com exatamente um curso e com
                módulos e lições planejados; microsequences deve permanecer vazia.
              required: [contract, version, kind, courses]
              properties:
                contract: { const: aralearn.contract }
                version: { const: 3 }
                kind: { const: project }
                courses:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items: { type: object, additionalProperties: true }
              additionalProperties: true
            ledgerManifest:
              $ref: '#/components/schemas/LedgerManifest'
            course:
              type: object
              additionalProperties: true
            learningOutcomes:
              type: array
              minItems: 1
              maxItems: 5000
              uniqueItems: true
              items:
                $ref: '#/components/schemas/LearningOutcome'
            parts:
              type: array
              minItems: 1
              maxItems: 256
              items:
                $ref: '#/components/schemas/PlanPart'
            conceptMap:
              type: object
              additionalProperties: true
            acceptanceCriteria:
              type: array
              minItems: 1
              items: { type: string, minLength: 1, maxLength: 500 }
          additionalProperties: false
    LedgerManifest:
      type: object
      additionalProperties: false
      required: [artifact, version, runId, sections, openIssues]
      properties:
        artifact: { const: aralearn.course-ledger-manifest }
        version: { const: 1 }
        runId: { type: string, format: uuid }
        sections:
          type: object
          additionalProperties: false
          required: [sources, claims, terms]
          properties:
            sources: { $ref: '#/components/schemas/LedgerManifestSection' }
            claims: { $ref: '#/components/schemas/LedgerManifestSection' }
            terms: { $ref: '#/components/schemas/LedgerManifestSection' }
        openIssues:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 500 }
    LedgerManifestSection:
      type: object
      additionalProperties: false
      required: [chunkCount, itemCount]
      properties:
        chunkCount: { type: integer, minimum: 0, maximum: 1000 }
        itemCount: { type: integer, minimum: 0, maximum: 100000 }
    LedgerSource:
      type: object
      required: [sourceId, title, kind, locator, excerpt, stability]
      properties:
        sourceId: { type: string }
        title: { type: string }
        author: { type: string }
        kind:
          enum: [attachment, book, article, standard, documentation, web, dataset, other]
        locator: { type: string }
        publishedOn: { type: string, format: date }
        publishedVersion: { type: string, minLength: 1, maxLength: 500 }
        accessedOn: { type: string, format: date }
        excerpt: { type: string }
        stability: { enum: [stable, versioned, volatile] }
        usageTerms: { type: string, minLength: 1, maxLength: 4096 }
        usageNotes: { type: string }
      additionalProperties: false
    LedgerClaim:
      type: object
      required: [claimId, statement, sourceIds, support, confidence]
      properties:
        claimId: { type: string }
        statement: { type: string }
        sourceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        support: { type: string }
        confidence: { enum: [high, medium, low] }
        allowedPartKeys:
          type: array
          uniqueItems: true
          items: { type: string }
      additionalProperties: false
    LedgerTerm:
      type: object
      required: [termId, form, language, explanation, firstTeachingCardId]
      properties:
        termId: { type: string }
        form: { type: string }
        language: { type: string }
        explanation: { type: string }
        gloss: { type: string }
        firstTeachingCardId: { type: string }
        requiredByCardIds:
          type: array
          uniqueItems: true
          items: { type: string }
        sourceIds:
          type: array
          uniqueItems: true
          items: { type: string }
      additionalProperties: false
    LedgerChunkRequest:
      type: object
      additionalProperties: false
      required: [requestId, planHash, items]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        planHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        items:
          type: array
          description: Itens da seção indicada na URL; o JSON serializado ocupa até 60 KiB.
          items:
            oneOf:
              - { $ref: '#/components/schemas/LedgerSource' }
              - { $ref: '#/components/schemas/LedgerClaim' }
              - { $ref: '#/components/schemas/LedgerTerm' }
    PlanFinalizeRequest:
      type: object
      additionalProperties: false
      required: [requestId, planHash]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        planHash: { type: string, pattern: '^[a-f0-9]{64}$' }
    LedgerSlice:
      type: object
      required: [sources, claims, terms, openIssues]
      properties:
        sources:
          type: array
          items: { $ref: '#/components/schemas/LedgerSource' }
        claims:
          type: array
          items: { $ref: '#/components/schemas/LedgerClaim' }
        terms:
          type: array
          items: { $ref: '#/components/schemas/LedgerTerm' }
        openIssues:
          type: array
          items: { type: string }
      additionalProperties: false
    PartSpecificationCard:
      type: object
      additionalProperties: false
      required: [cardId, microsequenceId, position, resource, kind, exercise, purpose, evidence, learningFunction, resourceRationale, introducedTermIds, requiredTermIds, sourceIds]
      properties:
        cardId: { type: string, minLength: 1, maxLength: 160 }
        microsequenceId: { type: string, minLength: 1, maxLength: 160 }
        position: { type: integer, minimum: 1 }
        resource: { enum: [paragraph, choice, composite, code, table, flow, tree, graph, relation_map, matrix, plane, formula] }
        kind: { enum: [theory, exercise] }
        exercise: { enum: [none, gap, choice] }
        purpose: { type: string, minLength: 1, maxLength: 20000 }
        evidence: { type: string, minLength: 1, maxLength: 20000 }
        targetError: { type: string, minLength: 1, maxLength: 20000 }
        learningFunction: { enum: [foundation, worked_example, guided_practice, independent_practice, contrast, error_diagnosis, integration] }
        resourceRationale: { type: string, minLength: 1, maxLength: 20000 }
        variationFocus: { type: string, minLength: 1, maxLength: 20000 }
        introducedTermIds: { type: array, uniqueItems: true, items: { type: string } }
        requiredTermIds: { type: array, uniqueItems: true, items: { type: string } }
        sourceIds: { type: array, uniqueItems: true, items: { type: string } }
        claimIds: { type: array, uniqueItems: true, items: { type: string } }
    PartSpecification:
      type: object
      additionalProperties: false
      required: [key, title, boundary, cutReason, dependsOnPartKeys, ownership, outcomeIds, structure, cardPlan, allowedSourceIds, availableTermIds, preserve]
      properties:
        key: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
        title: { type: string, minLength: 1, maxLength: 300 }
        boundary: { type: string, minLength: 1, maxLength: 20000 }
        cutReason: { type: string, minLength: 1, maxLength: 20000 }
        dependsOnPartKeys:
          type: array
          uniqueItems: true
          items: { type: string }
        ownership: { $ref: '#/components/schemas/PartOwnership' }
        outcomeIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        structure:
          type: object
          description: Curso, módulo e lição idênticos ao esqueleto, seguidos das microssequências planejadas da parte.
          required: [course, module, lesson, microsequences]
          properties:
            course: { type: object, additionalProperties: true }
            module: { type: object, additionalProperties: true }
            lesson: { type: object, additionalProperties: true }
            microsequences:
              type: array
              minItems: 1
              items:
                type: object
                required: [id, title, goal, role, status, dependsOn, covers, checks, errors]
                properties:
                  id: { type: string }
                  title: { type: string }
                  goal: { type: string }
                  role: { enum: [explain, practice, review, support] }
                  status: { const: planned }
                  dependsOn: { type: array, uniqueItems: true, items: { type: string } }
                  dependencyRationale: { type: object, additionalProperties: { type: string } }
                  covers: { type: array, uniqueItems: true, items: { type: string } }
                  checks: { type: array, uniqueItems: true, items: { type: string } }
                  errors: { type: array, uniqueItems: true, items: { type: string } }
                additionalProperties: false
          additionalProperties: false
        cardPlan:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/PartSpecificationCard' }
        allowedSourceIds: { type: array, uniqueItems: true, items: { type: string } }
        availableTermIds: { type: array, uniqueItems: true, items: { type: string } }
        preserve: { type: array, uniqueItems: true, items: { type: string, pattern: '^/' } }
    PartSpecificationRequest:
      type: object
      additionalProperties: false
      required: [requestId, planHash, specification]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        planHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        specification: { $ref: '#/components/schemas/PartSpecification' }
    PartRequest:
      type: object
      additionalProperties: false
      required:
        - artifact
        - version
        - runId
        - partKey
        - requestId
        - mode
        - attempt
        - baseLedgerSha256
        - fragment
        - stateDelta
      properties:
        artifact: { const: aralearn.part-submission }
        version: { const: 1 }
        runId: { type: string, format: uuid }
        partKey: { type: string }
        requestId:
          $ref: '#/components/schemas/RequestId'
        mode:
          type: string
          enum: [build, repair, rebuild]
        attempt: { type: integer, minimum: 1 }
        baseLedgerSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        fragment:
          type: object
          description: Parte com uma ou mais microssequências completas.
          additionalProperties: true
        evidence:
          type: array
          maxItems: 200
          items:
            type: object
            required: [sourceId]
            properties:
              sourceId: { type: string, minLength: 1 }
              claimId: { type: string, minLength: 1 }
            additionalProperties: true
        stateDelta:
          type: object
          description: >-
            Continuidade da autoria: termos introduzidos, afirmações e fontes usadas,
            resultados cobertos e erros resolvidos nesta parte.
          required:
            - introducedTermIds
            - usedClaimIds
            - coveredOutcomeIds
            - resolvedErrorIds
            - notes
          properties:
            introducedTermIds:
              type: array
              maxItems: 1000
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 500 }
            usedClaimIds:
              type: array
              maxItems: 1000
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 500 }
            coveredOutcomeIds:
              type: array
              maxItems: 1000
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 500 }
            resolvedErrorIds:
              type: array
              maxItems: 1000
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 500 }
            notes:
              type: array
              maxItems: 1000
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 500 }
          additionalProperties: false
    AuditRequest:
      type: object
      additionalProperties: false
      required:
        - artifact
        - version
        - runId
        - partKey
        - requestId
        - attempt
        - submissionSha256
        - submissionReadReceipt
        - decision
        - gates
        - findings
      properties:
        artifact: { const: aralearn.part-audit }
        version: { const: 1 }
        runId: { type: string, format: uuid }
        partKey: { type: string }
        requestId:
          $ref: '#/components/schemas/RequestId'
        attempt: { type: integer, minimum: 1 }
        submissionSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        submissionReadReceipt:
          type: string
          minLength: 40
          maxLength: 4096
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        decision:
          type: string
          enum: [approve, repair, rebuild, blocked]
        gates:
          type: object
          required:
            - planAlignment
            - contract
            - outcomeCoverage
            - sources
            - continuity
            - interactionCoherence
            - language
            - fieldPreservation
            - structuredElements
            - feedback
          properties:
            planAlignment: { type: boolean }
            contract: { type: boolean }
            outcomeCoverage: { type: boolean }
            sources: { type: boolean }
            continuity: { type: boolean }
            interactionCoherence: { type: boolean }
            language: { type: boolean }
            fieldPreservation: { type: boolean }
            structuredElements: { type: boolean }
            feedback: { type: boolean }
          additionalProperties: false
        findings:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: true
        instructions:
          type: string
      allOf:
        - if:
            properties:
              decision: { const: approve }
            required: [decision]
          then:
            properties:
              gates:
                properties:
                  planAlignment: { const: true }
                  contract: { const: true }
                  outcomeCoverage: { const: true }
                  sources: { const: true }
                  continuity: { const: true }
                  interactionCoherence: { const: true }
                  language: { const: true }
                  fieldPreservation: { const: true }
                  structuredElements: { const: true }
                  feedback: { const: true }
              findings: { maxItems: 0 }
          else:
            anyOf:
              - properties:
                  findings: { minItems: 1 }
              - required: [instructions]
                properties:
                  instructions: { type: string, minLength: 1 }
    ReopenPartRequest:
      type: object
      additionalProperties: false
      required: [artifact, version, runId, partKey, requestId, attempt, submissionSha256, decision, findings]
      properties:
        artifact: { const: aralearn.final-validation-repair }
        version: { const: 1 }
        runId: { type: string, format: uuid }
        partKey: { type: string }
        requestId: { $ref: '#/components/schemas/RequestId' }
        attempt: { type: integer, minimum: 1, maximum: 8 }
        submissionSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        decision: { enum: [repair, rebuild] }
        findings:
          type: array
          maxItems: 100
          items: { type: object, additionalProperties: true }
        instructions: { type: string, maxLength: 20000 }
    CommandRequest:
      type: object
      additionalProperties: false
      required: [requestId]
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
    CancelRequest:
      type: object
      additionalProperties: false
      required: [requestId, reason]
      properties:
        requestId: { $ref: '#/components/schemas/RequestId' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    BlockRequest:
      type: object
      additionalProperties: false
      required: [requestId, reason]
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        questions:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 500
        partKey:
          type: [string, 'null']
    ResumeRequest:
      type: object
      additionalProperties: false
      required: [requestId, resolution]
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        resolution:
          type: object
          minProperties: 1
          additionalProperties: true
    ImportRequest:
      type: object
      additionalProperties: false
      required: [requestId, target, publicationIntent, document]
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        target:
          type: string
          const: catalog
        collectionId:
          type: [string, 'null']
          format: uuid
        publicationIntent:
          $ref: '#/components/schemas/PublicationIntent'
        document:
          type: object
          additionalProperties: true
    NextPart:
      type: [object, 'null']
      required:
        - artifact
        - version
        - runId
        - partKey
        - position
        - title
        - status
        - mode
        - attempt
        - baseLedgerSha256
        - ledger
        - learningOutcomes
        - ownership
        - boundary
        - cutReason
        - structure
        - cardPlan
        - allowedSourceIds
        - availableTermIds
        - outcomeIds
        - preserve
        - continuity
        - previousAudit
      properties:
        artifact: { const: aralearn.part-spec }
        version: { const: 1 }
        runId: { type: string, format: uuid }
        partKey: { type: string }
        key: { type: string }
        position: { type: integer, minimum: 0 }
        title: { type: string }
        status: { type: string }
        mode: { enum: [build, repair, rebuild] }
        attempt: { type: integer, minimum: 1 }
        baseLedgerSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        ledger:
          $ref: '#/components/schemas/LedgerSlice'
        learningOutcomes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LearningOutcome'
        ownership: { type: object, additionalProperties: true }
        boundary: { type: string }
        cutReason: { type: string }
        structure: { type: object, additionalProperties: true }
        cardPlan: { type: array, items: { type: object, additionalProperties: true } }
        allowedSourceIds: { type: array, items: { type: string } }
        availableTermIds: { type: array, items: { type: string } }
        outcomeIds: { type: array, minItems: 1, items: { type: string } }
        preserve: { type: array, items: { type: string } }
        dependsOnPartKeys: { type: array, items: { type: string } }
        continuity:
          type: object
          required: [approvedParts, stateDelta]
          properties:
            approvedParts:
              type: array
              items:
                type: object
                required: [partKey, fragmentHash]
                properties:
                  partKey: { type: string }
                  fragmentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
            stateDelta:
              type: object
              required: [introducedTermIds, usedClaimIds, coveredOutcomeIds, resolvedErrorIds, notes]
              properties:
                introducedTermIds: { type: array, items: { type: string } }
                usedClaimIds: { type: array, items: { type: string } }
                coveredOutcomeIds: { type: array, items: { type: string } }
                resolvedErrorIds: { type: array, items: { type: string } }
                notes: { type: array, items: { type: string } }
              additionalProperties: false
          additionalProperties: false
        previousAudit: { type: [object, 'null'], additionalProperties: true }
      additionalProperties: false
    PartSubmission:
      type: object
      additionalProperties: false
      required:
        - runId
        - partKey
        - status
        - attempt
        - fragmentHash
        - submissionSha256
        - submissionReadReceipt
        - specification
        - fragment
        - evidence
        - stateDelta
        - latestAudit
      properties:
        runId: { type: string, format: uuid }
        partKey: { type: string }
        position: { type: integer, minimum: 0 }
        title: { type: string }
        status: { type: string }
        attempt: { type: integer, minimum: 0 }
        baseLedgerSha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        fragmentHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        submissionSha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        submissionReadReceipt:
          type: string
          minLength: 40
          maxLength: 4096
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        specification: { type: object, additionalProperties: true }
        fragment: { type: [object, 'null'], additionalProperties: true }
        evidence:
          type: array
          items: { type: object, additionalProperties: true }
        stateDelta: { type: object, additionalProperties: true }
        submittedAt: { type: [string, 'null'], format: date-time }
        latestAudit: { type: [object, 'null'], additionalProperties: true }
    PartSubmissionEnvelope:
      type: object
      required: [ok, requestId, data]
      properties:
        ok: { const: true }
        requestId: { type: string }
        data:
          $ref: '#/components/schemas/PartSubmission'
      additionalProperties: false
    PublicationProgress:
      type: object
      required: [status, runId]
      properties:
        status: { enum: [publishing, published] }
        phase: { type: string, enum: [staging, finalizing] }
        runId: { type: string, format: uuid }
        courseId: { type: [string, 'null'], format: uuid }
        documentHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        percent: { type: integer, minimum: 0, maximum: 100 }
        nextStep: { type: integer, minimum: 0 }
        totalSteps: { type: integer, minimum: 1 }
        pollAfterSeconds: { type: integer, minimum: 1, maximum: 45 }
        leaseAcquired: { type: boolean }
        idempotent: { type: boolean }
        visibility: { type: string, enum: [catalog, private] }
        publicationError: { type: object, additionalProperties: true }
      additionalProperties: true
    PublicationEnvelope:
      type: object
      required: [ok, requestId, data]
      properties:
        ok: { const: true }
        requestId: { type: string }
        data:
          $ref: '#/components/schemas/PublicationProgress'
      additionalProperties: false
    NextPartEnvelope:
      type: object
      required: [ok, requestId, data]
      properties:
        ok: { const: true }
        requestId: { type: string }
        data:
          $ref: '#/components/schemas/NextPart'
      additionalProperties: false
    SuccessEnvelope:
      type: object
      required: [ok, requestId, data]
      properties:
        ok:
          const: true
        requestId:
          type: string
        data: {}
    IntegrationMetadataEnvelope:
      type: object
      required: [ok, requestId, data]
      properties:
        ok: { const: true }
        requestId: { type: [string, 'null'] }
        data:
          $ref: '#/components/schemas/PrivateIntegrationMetadata'
      additionalProperties: false
    IntegrationIssueEnvelope:
      type: object
      required: [ok, requestId, data]
      properties:
        ok: { const: true }
        requestId: { type: string }
        data:
          $ref: '#/components/schemas/PrivateIntegrationIssue'
      additionalProperties: false
    IntegrationListEnvelope:
      type: object
      required: [ok, requestId, data]
      properties:
        ok: { const: true }
        requestId: { type: [string, 'null'] }
        data:
          $ref: '#/components/schemas/PrivateIntegrationList'
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required: [ok, requestId, error]
      properties:
        ok:
          const: false
        requestId:
          type: string
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
  responses:
    IntegrationMetadataSuccess:
      description: Integração revogada ou já inativa, sem qualquer segredo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationMetadataEnvelope'
    IntegrationIssueSuccess:
      description: Integração emitida ou renovada; a primeira resposta contém a chave.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationIssueEnvelope'
    IntegrationListSuccess:
      description: Metadados das integrações pessoais da conta autenticada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IntegrationListEnvelope'
    PublicationAccepted:
      description: >-
        Progresso persistido; repita publicarCursoNoCatalogo com o mesmo requestId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicationEnvelope'
    PublicationCompleted:
      description: Curso publicado e visível no catálogo.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicationEnvelope'
    NextPartSuccess:
      description: Próxima parte enriquecida com orientação, tentativa e continuidade acumulada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NextPartEnvelope'
    PartSubmissionSuccess:
      description: Entrega persistida que deve ser usada como entrada da auditoria.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartSubmissionEnvelope'
    Success:
      description: Operação concluída ou repetição idempotente confirmada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Error:
      description: Falha estruturada. Erros 429 e 5xx podem ser repetidos com o mesmo requestId.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
