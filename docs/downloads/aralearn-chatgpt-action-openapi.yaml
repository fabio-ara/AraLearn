{"openapi":"3.1.0","info":{"title":"AraLearn — Autoria de Cursos","version":"0.0.56","x-aralearn-task-catalog":"aralearn.human-authoring-tasks","x-aralearn-task-catalog-version":"2.0.5","x-aralearn-task-catalog-fingerprint":"sha256:ac85250eb05103f2e22ce68e585801056423ad0e6e7387d3d90512d5a6c236bc","description":"Opera Cursos privados por tarefas humanas, sem exigir controles internos do banco.\n\nO AraLearn mantém um Curso vivo e mutável como única autoridade. Planeje uma Parte por vez. Cada AnalysisUnit é novidade material independente, inclusive fundamento ainda não estabelecido; preserve o inventário e crie quantas StudyUnits forem necessárias. Leia planejamento e configuração focal antes de decidir ou materializar. Antes de escrever, apresente a mudança concreta e obtenha uma única decisão. Responda só com resultado, deep link e no máximo uma próxima decisão.\nEscolha tarefas por ‘Use’/‘Não use’ e localize objetos por referências humanas.\nDepois da decisão, aplique e releia sem confirmações mecânicas; não repita no chat conteúdo já aberto no AraLearn.\nAntes de materializar, leia com consultar_componentes o contrato exato de cada componente escolhido.\nPeça uma referência mais específica somente diante de ambiguidade real.\nAo revisar, considere também progressão, pré-requisitos, transições, exemplos e prática afetados; aplicar uma correção não prova que ela resolveu o problema.\nUm PDF só vira Fonte persistente quando a intenção de mantê-lo estiver clara; uso descartável não grava o documento."},"servers":[{"url":"https://jrfkphuhcseqmratijjr.supabase.co/functions/v1/aralearn-authoring-action"}],"security":[{"AraLearnOAuth":["openid","email"]}],"paths":{"/retomar_curso":{"post":{"operationId":"retomar_curso","summary":"Retomar um Curso","description":"Use para localizar ou continuar Curso por título. Não use para alterá-lo.","x-openai-isConsequential":false,"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProper