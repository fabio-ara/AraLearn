{"openapi":"3.1.0","info":{"title":"AraLearn — Autoria de Cursos","version":"0.0.63","x-aralearn-task-catalog":"aralearn.human-authoring-tasks","x-aralearn-task-catalog-version":"2.3.5","x-aralearn-task-catalog-fingerprint":"sha256:4a135fb0fc3c14803e68664b783865213288d2d727746b696f1ccc992b61b6c8","description":"Opera cursos privados por tarefas humanas, sem exigir controles internos do banco.\n\nUse objetivo, público, pré-requisitos, escopo e fontes. Primeiro proponha o mapa completo de módulos, lições e microssequências; síntese no chat, detalhe no AraLearn.\nSó o mapa mostrado é aprovado. Parte é lote operacional, não currículo.\nSe aprovar mapa e pedir lote juntos, registre o mapa; proponha a progressão e só salve o lote após confirmação.\nNo estado default, calibre por microssequência ou unidade segundo assunto e mapa, em silêncio; condições fixadas pelo pesquisador prevalecem. Só mostre parâmetros, contagens, formas e alvos a pedido.\nEnsine dependências antes do uso.\nMapa mostra conteúdo, não contagens. Não narre tentativas nem causas (conexão, escrita, confirmação, validação, ferramenta ou mecanismo). Retome em silêncio; se não puder, diga só o impacto e o próximo passo. Distinga pessoa autora de público. Use curso, parte, fonte e unidade em minúsculas no meio da frase.\nApós produzir: resultado, link e próxima etapa; devolva o endereço exato em Markdown."},"servers":[{"url":"https://jrfkphuhcseqmratijjr.supabase.co/functions/v1/aralearn-authoring-action"}],"security":[{"AraLearnOAuth":["openid","email"]}],"paths":{"/retomar_curso":{"post":{"operationId":"retomar_curso","summary":"Retomar um curso","description":"Use para retomar curso. Não altera.","x-openai-isConsequential":false,"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"properties":{"titulo":{"type":"string","minLength":1,"maxLength":300,"description":"Novo título."}},"required":[]}}}},"responses":{"200":{"$ref":"#/components/resp