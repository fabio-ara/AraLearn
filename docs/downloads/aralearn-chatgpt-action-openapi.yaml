{"openapi":"3.1.0","info":{"title":"AraLearn — Autoria de Cursos","version":"0.0.57","x-aralearn-task-catalog":"aralearn.human-authoring-tasks","x-aralearn-task-catalog-version":"2.3.1","x-aralearn-task-catalog-fingerprint":"sha256:6e7b8af111ac77a003b11053e589dac412d42c3fa2e08fef0fc5a61316488d35","description":"Opera cursos privados por tarefas humanas, sem exigir controles internos do banco.\n\nA autoria parte de objetivo, público, pré-requisitos, escopo e fontes e segue para o mapa completo de módulos, lições e microssequências. O chat resume temas e progressão; o detalhe fica no AraLearn.\nA decisão da pessoa autora cobre o mapa apresentado; conteúdo futuro é uma etapa distinta. Partes são lotes operacionais posteriores e podem mudar sem alterar o currículo.\nNo estado default, a calibração varia por microssequência ou unidade conforme assunto e mapa; condições fixadas pelo pesquisador prevalecem. O repertório distingue novidade, uso e retomada; dependências vêm antes do uso.\nUnidades focalizadas e conectadas combinam explicação e prática e usam componentes e fontes por função. A conversa separa pessoa autora de público estudante e mantém substantivos comuns em minúsculas.\nO resumo global apresenta assuntos, cobertura e ordem, não estatísticas da estrutura. Falhas aparecem à pessoa autora como impacto e retomada em linguagem humana."},"servers":[{"url":"https://jrfkphuhcseqmratijjr.supabase.co/functions/v1/aralearn-authoring-action"}],"security":[{"AraLearnOAuth":["openid","email"]}],"paths":{"/retomar_curso":{"post":{"operationId":"retomar_curso","summary":"Retomar um curso","description":"Use para retomar um curso. Não altera.","x-openai-isConsequential":false,"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"properties":{"titulo":{"type":"string","minLength":1,"maxLength":300,"description":"Título do objeto."}},"required":[]}}}},"responses":{"200":{"$ref":"#/components/responses/Success"},"d