{"openapi":"3.1.0","info":{"title":"AraLearn — Autoria de Cursos","version":"0.0.64","x-aralearn-task-catalog":"aralearn.human-authoring-tasks","x-aralearn-task-catalog-version":"2.6.0","x-aralearn-task-catalog-fingerprint":"sha256:78c98f24e250445fa5576256a28b982cfe1277b21443d8540feedc2235ca1ade","description":"Opera cursos privados por tarefas humanas, sem exigir controles internos do banco.\n\nUse objetivo, público, pré-requisitos, escopo e fontes. Primeiro proponha o mapa completo de módulos, lições e microssequências; síntese no chat, detalhe no AraLearn.\nSó o mapa mostrado é aprovado. Parte é lote operacional, não currículo.\nSe aprovar mapa e pedir lote juntos, registre o mapa; proponha a progressão e só salve o lote após confirmação.\nEm automático, calibre em silêncio: escolha valor e motivo; nunca presuma número. Fixações da autoria e pesquisa prevalecem. Só mostre parâmetros, contagens, formas e alvos a pedido.\nEnsine dependências antes do uso.\nMapa mostra conteúdo, não contagens. Não narre tentativas nem causas (conexão, escrita, confirmação, validação, ferramenta ou mecanismo). Retome em silêncio; se não puder, diga só o impacto e o próximo passo. Distinga pessoa autora de público. Use curso, parte, fonte e unidade em minúsculas no meio da frase.\nApós produzir: resultado, link e próxima etapa; devolva o endereço exato em Markdown."},"servers":[{"url":"https://jrfkphuhcseqmratijjr.supabase.co/functions/v1/aralearn-authoring-action"}],"security":[{"AraLearnOAuth":["openid","email"]}],"paths":{"/consultar_perfis":{"post":{"operationId":"consultar_perfis","summary":"Consultar perfis de autoria","description":"Use para listar preferências desta conta. Não altera cursos.","x-openai-isConsequential":false,"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"properties":{},"required":[]}}}},"responses":{"200":{"$ref":"#/components/responses/Success"},"default":{"$ref":"#/components/responses/Er