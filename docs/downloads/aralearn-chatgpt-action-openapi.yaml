{"openapi":"3.1.0","info":{"title":"AraLearn — Autoria de Cursos","version":"0.0.48","x-aralearn-task-catalog":"aralearn.human-authoring-tasks","x-aralearn-task-catalog-version":"2.0.0","x-aralearn-task-catalog-fingerprint":"sha256:e876aa75459717f10a63ceab3eba83655a54f9d5bfb6c9a23f8cfa5b5f2cd925","description":"Opera Cursos privados por tarefas humanas, sem exigir controles internos do banco.\n\nEscolha a tarefa pela seção ‘Use quando’ e respeite ‘Não use’ para desambiguar.\nIdentifique Cursos e objetos por títulos, posições e referências humanas já vistas; não invente referências.\nFaça leituras necessárias autonomamente. Antes de uma escrita, apresente a mudança concreta e obtenha uma única decisão humana; depois aplique e releia sem confirmações mecânicas.\nPlaneje uma Parte por vez. Em revisão, considere também progressão, pré-requisitos, transições, exemplos e prática afetados.\nResponda com o resultado, o link oferecido e no máximo uma próxima decisão. Não reproduza o conteúdo já aberto no AraLearn."},"servers":[{"url":"https://jrfkphuhcseqmratijjr.supabase.co/functions/v1/aralearn-authoring-action"}],"security":[{"AraLearnOAuth":["openid","email"]}],"paths":{"/retomar_curso":{"post":{"operationId":"retomar_curso","summary":"Retomar um Curso","description":"Use quando a pessoa quiser localizar ou continuar um Curso pelo título. Não use para alterar conteúdo ou planejamento.","x-openai-isConsequential":false,"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"properties":{"titulo":{"type":"string","minLength":1,"maxLength":300,"description":"Título humano do objeto; por exemplo, “Fundamentos de redes”."}},"required":[]}}}},"responses":{"200":{"$ref":"#/components/responses/Success"},"default":{"$ref":"#/components/responses/Error"}}}},"/consultar_planejamento":{"post":{"operationId":"consultar_planejamento","summary":"Consultar o planejamento","description":"Use quando for preciso ler a Parte cor