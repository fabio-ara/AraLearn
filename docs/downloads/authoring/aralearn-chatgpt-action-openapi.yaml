 /revisarMicroteoriasDoWorkspace:
  post: {operationId: revisarMicroteoriasDoWorkspace, summary: Apresentar microteorias, description: "Projeta teoria, cobertura, checks, erros, resources, tópicos e contagem de práticas de uma lição ou microssequência; apresenta conteúdo, não faz auditoria.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputRevisarMicroteoriasDoWorkspace"}}}}, responses: {"200": {description: "Leitura concluída. data contém: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent, brief, publications, view, content.", content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /listarCardsDaMicrossequencia:
  post: {operationId: listarCardsDaMicrossequencia, summary: Listar cards da microssequência, description: "No workspace, localiza cards por id, posição, kind, resource e resumo. Para mostrar ou auditar práticas, releia como entidade só os alvos pedidos; abra ou importe antes uma publicação.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputListarCardsDaMicrossequencia"}}}}, responses: {"200": {description: "Leitura concluída. data contém: workspaceId, revision, microsequencePath, items, hasMore, nextCursor.", content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /listarAlteracoesRecentesDoWorkspace:
