openapi: 3.1.0
info:
 title: AraLearn — autoria de cursos
 version: 5.0.0
 description: Opera cursos AraLearn atomicamente.
servers:
 - url: https://jrfkphuhcseqmratijjr.supabase.co/functions/v1/aralearn-authoring-action
paths:
 /prepararAutoriaAraLearn:
  post: {operationId: prepararAutoriaAraLearn,summary: Preparar autoria AraLearn,description: "Use no início da etapa: create planeja/cria, extend amplia/constrói, audit audita sem alterar conteúdo ou estrutura, repair repara, restructure reorganiza e publish prepara submissão ou distribui em Coleções.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputPrepararAutoriaAraLearn"}}}},responses: {"200": {description: "Leitura concluída. Campos: briefVersion, intent, targetEntity, workflow, recommendedTools, guidance, blueprintContract, calibrationContract, packageContracts, access.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /consultarBibliotecaDeResources:
  post: {operationId: consultarBibliotecaDeResources,summary: Consultar biblioteca de resources,description: "Explora facetas, busca pela intenção, inspeciona manifests, obtém até quatro contratos, valida cards e audita a adequação representacional. A ausência de um resource exato devolve um substituto explicitado e nunca bloqueia a autoria.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputConsultarBibliotecaDeResources"}}}},responses: {"200": {description: "Leitura concluída. Campos: contract, operation, result.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /listarCursosDaBibliotecaPessoal:
  post: {operationId: listarCursosDaBibliotecaPessoal,summary: Listar cursos de Trilhas,description: "Lista a projeção corrente de Trilhas: planos, cursos em materialização e cursos selecionados, sem exigir publicação.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputListarCursosDaBibliotecaPessoal"}}}},responses: {"200": {description: "Leitura concluída. Campos: space, groups, items, hasMore, nextCursor, capabilities.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /retirarCursoDasTrilhas:
  post: {operationId: retirarCursoDasTrilhas,summary: Retirar curso de Trilhas,description: "Retira a seleção informada de Trilhas. Se for uma publicação privada própria, também a arquiva e libera seu artefato atual.",x-openai-isConsequential: true,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputRetirarCursoDasTrilhas"}}}},responses: {"200": {description: "Operação concluída. Campos: status, selectionId, courseId, kind, courseArchived, idempotent.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /consultarCatalogo:
  post: {operationId: consultarCatalogo,summary: Consultar Coleções,description: "Lista Coleções, lista cursos de uma Coleção ou busca cursos em todo o catálogo, conforme operation.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputConsultarCatalogo"}}}},responses: {"200": {description: Leitura concluída. Resultado em data.,content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /editarCatalogo:
  post: {operationId: editarCatalogo,summary: Editar Coleções,description: "Cria ou atualiza uma Coleção, ou transfere um curso oficial entre Coleções, conforme operation.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputEditarCatalogo"}}}},responses: {"200": {description: Operação concluída. Resultado em data.,content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /retirarDoCatalogo:
  post: {operationId: retirarDoCatalogo,summary: Retirar do catálogo,description: "Retira uma Coleção ou um curso oficial do catálogo, conforme operation.",x-openai-isConsequential: true,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputRetirarDoCatalogo"}}}},responses: {"200": {description: Operação concluída. Resultado em data.,content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /lerConteudoDoCurso:
  post: {operationId: lerConteudoDoCurso,summary: Ler conteúdo de curso,description: "Lê a árvore, uma entidade ou a biblioteca corrente de um curso acessível.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputLerConteudoDoCurso"}}}},responses: {"200": {description: "Leitura concluída. Campos: courseId, title, revisionHash, view, content.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /listarWorkspacesDeAutoria:
  post: {operationId: listarWorkspacesDeAutoria,summary: Listar workspaces,description: "Lista os workspaces mutáveis do autor, sem carregar os documentos.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputListarWorkspacesDeAutoria"}}}},responses: {"200": {description: "Leitura concluída. Campos: items, hasMore, nextCursor.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /gerirWorkspaceEducacional:
  post: {operationId: gerirWorkspaceEducacional,summary: Gerir workspace educacional,description: Lê contexto e observações ou administra participantes e o ciclo de melhoria conforme operation e o papel local.,x-openai-isConsequential: true,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputGerirWorkspaceEducacional"}}}},responses: {"200": {description: Operação concluída. Resultado em data.,content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /criarWorkspaceDeAutoria:
  post: {operationId: criarWorkspaceDeAutoria,summary: Criar workspace,description: "Cria um workspace vazio, parte de um curso acessível ou abre uma revisão editorial assumida.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputCriarWorkspaceDeAutoria"}}}},responses: {"200": {description: "Operação concluída. Campos: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /lerWorkspaceDeAutoria:
  post: {operationId: lerWorkspaceDeAutoria,summary: Ler workspace,description: "Lê a árvore, uma entidade ou o documento composto; use view resume ao retomar outra sessão. Se findings.truncated for true, detalhe achados por list_observations com kind audit_finding.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputLerWorkspaceDeAutoria"}}}},responses: {"200": {description: "Leitura concluída. Campos: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent, brief, purpose, workspaceKind, visibility, role, capabilities, view, content.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /revisarMicroteoriasDoWorkspace:
  post: {operationId: revisarMicroteoriasDoWorkspace,summary: Apresentar microteorias,description: "Projeta teoria, cobertura, checks, erros, resources, tópicos e contagem de práticas de uma lição ou microssequência; apresenta conteúdo, não faz auditoria.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputRevisarMicroteoriasDoWorkspace"}}}},responses: {"200": {description: "Leitura concluída. Campos: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent, brief, publications, view, content.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /listarCardsDaMicrossequencia:
  post: {operationId: listarCardsDaMicrossequencia,summary: Listar cards da microssequência,description: "No workspace, localiza cards por id, posição, papel pedagógico, packages e resumo. Para mostrar ou auditar práticas, releia como entidade só os alvos pedidos; abra ou importe antes uma publicação.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputListarCardsDaMicrossequencia"}}}},responses: {"200": {description: "Leitura concluída. Campos: workspaceId, revision, microsequencePath, items, hasMore, nextCursor.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /listarAlteracoesRecentesDoWorkspace:
  post: {operationId: listarAlteracoesRecentesDoWorkspace,summary: Listar alterações recentes,description: "Lista resumos pequenos das alterações recentes, sem guardar cópias anteriores do curso.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputListarAlteracoesRecentesDoWorkspace"}}}},responses: {"200": {description: "Leitura concluída. Campos: items.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /importarCursoNoWorkspace:
  post: {operationId: importarCursoNoWorkspace,summary: Importar curso,description: Acrescenta um curso existente ao workspace para reaproveitar ou mover suas partes.,x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputImportarCursoNoWorkspace"}}}},responses: {"200": {description: "Operação concluída. Campos: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /criarEstruturaNoWorkspace:
  post: {operationId: criarEstruturaNoWorkspace,summary: Criar estrutura planejada,description: "Cria cursos, módulos, lições e microssequências planejadas em um lote pequeno; o servidor completa os campos canônicos previsíveis.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputCriarEstruturaNoWorkspace"}}}},responses: {"200": {description: "Conteúdo validado; não implica aprovação pedagógica. Campos: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /salvarCardsNaMicrossequencia:
  post: {operationId: salvarCardsNaMicrossequencia,summary: Salvar cards da microssequência,description: Materializa uma microssequência imediatamente renderizável. append acrescenta cards; replace substitui e também pode esvaziar a sequência.,x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputSalvarCardsNaMicrossequencia"}}}},responses: {"200": {description: "Conteúdo validado; não implica aprovação pedagógica. Campos: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /atualizarMetadadosDaEntidade:
  post: {operationId: atualizarMetadadosDaEntidade,summary: Atualizar conteúdo pedagógico,description: Altera somente os metadados informados a partir da leitura atual.,x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputAtualizarMetadadosDaEntidade"}}}},responses: {"200": {description: "Conteúdo validado; não implica aprovação pedagógica. Campos: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /salvarCardNoWorkspace:
  post: {operationId: salvarCardNoWorkspace,summary: Corrigir um card,description: "Substitui somente o card autorizado, preservando id e posição, e conclui o reparo atômico da microssequência. Consulte antes o resource.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputSalvarCardNoWorkspace"}}}},responses: {"200": {description: "Conteúdo validado; não implica aprovação pedagógica. Campos: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent.",content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /reorganizarWorkspace:
  post: {operationId: reorganizarWorkspace,summary: Reorganizar workspace,description: "Copia, renomeia, move, junta, separa, promove ou rebaixa partes do workspace, conforme operation.",x-openai-isConsequential: false,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputReorganizarWorkspace"}}}},responses: {"200": {description: Operação concluída. Resultado em data.,content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /excluirDoWorkspace:
  post: {operationId: excluirDoWorkspace,summary: Excluir do workspace,description: "Exclui uma entidade com seus descendentes ou remove o workspace ativo, conforme operation.",x-openai-isConsequential: true,security: [{AraLearnOAuth: [openid,email]}],requestBody: {required: true,content: {application/json: {schema: {$ref: "#/components/schemas/InputExcluirDoWorkspace"}}}},responses: {"200": {description: Operação concluída. Resultado em data.,content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}},"400": {$ref: "#/components/responses/BadRequest"},"401": {$ref: "#/components/responses/AuthenticationRequired"},"403": {$ref: "#/components/responses/Forbidden"},"409": {$ref: "#/components/responses/Conflict"},"413": {$ref: "#/components/responses/PayloadTooLarge"},"422": {$ref: "#/components/responses/UnprocessableEntity"},"429": {$ref: "#/components/responses/RateLimited"},default: {$ref: "#/components/responses/UnexpectedError"}}}
 /publicarCursoDoWorkspace:
