openapi: 3.1.0
info:
 title: AraLearn — autoria de cursos
 version: 4.0.0
 description: Lê cursos acessíveis e cria, amplia, revisa, reorganiza, exclui e publica cursos ou partes de cursos AraLearn por operações atômicas.
servers:
 - url: https://jrfkphuhcseqmratijjr.supabase.co/functions/v1/aralearn-authoring-action
paths:
 /prepararAutoriaAraLearn:
  post: {operationId: prepararAutoriaAraLearn, summary: Preparar autoria AraLearn, description: "Use antes de criar, ampliar, revisar pedagogicamente, reorganizar ou publicar. Recupera somente as regras e o fluxo pertinentes ao pedido atual.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputPrepararAutoriaAraLearn"}}}}, responses: {"200": {description: "Operação concluída. data contém: briefVersion, intent, targetEntity, workflow, recommendedTools, guidance, resourceContracts, access.", content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /consultarRecursosDeCard:
  post: {operationId: consultarRecursosDeCard, summary: Consultar recursos de card, description: "Sem resource, lista os recursos v4 e suas finalidades; com resource, lê o contrato autoral e um exemplo válido.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputConsultarRecursosDeCard"}}}}, responses: {"200": {description: Operação concluída com resultado estruturado em data., content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /listarCursosDaBibliotecaPessoal:
  post: {operationId: listarCursosDaBibliotecaPessoal, summary: Listar cursos de Trilhas, description: "Lista publicações privadas e cursos oficiais selecionados em Trilhas, com ids e revisões.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputListarCursosDaBibliotecaPessoal"}}}}, responses: {"200": {description: "Operação concluída. data contém: items, nextCursor.", content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /retirarCursoDasTrilhas:
  post: {operationId: retirarCursoDasTrilhas, summary: Retirar curso de Trilhas, description: "Retira a seleção informada de Trilhas. Se for uma publicação privada própria, também a arquiva e libera seu artefato atual.", x-openai-isConsequential: true, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputRetirarCursoDasTrilhas"}}}}, responses: {"200": {description: "Operação concluída. data contém: status, selectionId, courseId, kind, courseArchived, idempotent.", content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /consultarCatalogo:
  post: {operationId: consultarCatalogo, summary: Consultar Coleções, description: "Lista Coleções, lista cursos de uma Coleção ou busca cursos em todo o catálogo, conforme operation.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputConsultarCatalogo"}}}}, responses: {"200": {description: Operação concluída com resultado estruturado em data., content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /editarCatalogo:
  post: {operationId: editarCatalogo, summary: Organizar Coleções, description: "Cria ou atualiza uma Coleção, ou move e reordena um curso oficial, conforme operation.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputEditarCatalogo"}}}}, responses: {"200": {description: Operação concluída com resultado estruturado em data., content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /retirarDoCatalogo:
  post: {operationId: retirarDoCatalogo, summary: Retirar do catálogo, description: "Retira uma Coleção ou um curso oficial do catálogo, conforme operation.", x-openai-isConsequential: true, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputRetirarDoCatalogo"}}}}, responses: {"200": {description: Operação concluída com resultado estruturado em data., content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /lerConteudoDoCurso:
