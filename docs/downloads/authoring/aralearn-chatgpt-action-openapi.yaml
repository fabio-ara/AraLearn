            - email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - requestId
                - title
              properties:
                requestId:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
                title:
                  type: string
                  minLength: 1
                  maxLength: 300
                  pattern: \S
                sourceCourseId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema: *a1
        "400":
          description: Parâmetros inválidos.
        "401":
          description: Conecte a conta AraLearn.
        "403":
          description: Operação não autorizada para a conta.
        "409":
          description: A revisão mudou; releia antes de repetir a intenção.
        "413":
          description: Use um recorte estrutural menor.
        "429":
          description: Limite temporário; repita depois com o mesmo requestId.
        default:
          description: Falha estruturada da operação.
  /lerWorkspaceDeAutoria:
