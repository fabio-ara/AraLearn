 /reorganizarWorkspace:
  post: {operationId: reorganizarWorkspace, summary: Reorganizar workspace, description: "Copia, renomeia, move, junta, separa, promove ou rebaixa partes do workspace, conforme operation.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputReorganizarWorkspace"}}}}, responses: {"200": {description: Operação concluída com resultado estruturado em data., content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /excluirDoWorkspace:
