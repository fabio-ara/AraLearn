openapi: 3.1.0
info:
  title: AraLearn — autoria de cursos
  version: 4.0.0
  description: Lê cursos acessíveis e cria, amplia, revisa, reorganiza, exclui e publica cursos ou partes de cursos AraLearn por operações atômicas.
servers:
  - url: https://jrfkphuhcseqmratijjr.supabase.co/functions/v1/aralearn-authoring-action
paths:
  /prepararAutoriaAraLearn:
    post:
      operationId: prepararAutoriaAraLearn
      summary: Preparar autoria AraLearn
      description: Use antes de criar, ampliar, revisar pedagogicamente, reorganizar ou publicar. Recupera somente as regras e o fluxo pertinentes ao pedido atual.
      x-openai-isConsequential: false
      security:
        - AraLearnOAuth:
            - openid
            - email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - intent
              properties:
                intent:
                  type: string
                  enum:
                    - inspect
                    - create
                    - extend
                    - revise
                    - restructure
                    - publish
                    - study
                targetEntity:
                  type: string
                  enum:
                    - course
                    - module
                    - lesson
                    - microsequence
                    - card
                context:
                  type: string
                  maxLength: 8000
                  description: Resumo fiel do pedido e do contexto útil da conversa, sem credenciais.
                resourceIds:
                  type: array
                  maxItems: 18
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - paragraph
                      - choice
                      - composite
                      - code
                      - table
                      - flow
                      - tree
                      - graph
                      - relation_map
                      - matrix
                      - plane
                      - formula
                      - chart
                      - sequence
                      - annotated_text
                      - linguistic_example
                      - system_map
                      - reaction
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema: &a1
                type: object
                additionalProperties: false
                required:
                  - ok
                  - requestId
                properties:
                  ok:
                    type: boolean
                  requestId:
                    type:
                      - string
                      - "null"
                  data:
                    type:
                      - object
                      - array
                      - string
                      - number
                      - boolean
                      - "null"
                    description: Resultado estruturado da operação quando ok é true.
                  error:
                    type: object
                    additionalProperties: true
                    description: Erro estruturado quando ok é false.
        "400":
          description: Parâmetros inválidos.
        "401":
          description: Conecte a conta AraLearn.
        "403":
          description: Operação não autorizada para a conta.
        "409":
          description: A revisão mudou; releia antes de repetir a intenção.
        "413":
          description: Use um recorte estrutural menor.
        "429":
          description: Limite temporário; repita depois com o mesmo requestId.
        default:
          description: Falha estruturada da operação.
  /listarRecursosDeCard:
    post:
      operationId: listarRecursosDeCard
      summary: Listar recursos de card
      description: Lista os recursos v4 disponíveis e a finalidade didática de cada um.
      x-openai-isConsequential: false
      security:
        - AraLearnOAuth:
            - openid
            - email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties: {}
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema: *a1
        "400":
          description: Parâmetros inválidos.
        "401":
          description: Conecte a conta AraLearn.
        "403":
          description: Operação não autorizada para a conta.
        "409":
          description: A revisão mudou; releia antes de repetir a intenção.
        "413":
          description: Use um recorte estrutural menor.
        "429":
          description: Limite temporário; repita depois com o mesmo requestId.
        default:
          description: Falha estruturada da operação.
