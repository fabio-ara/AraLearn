 /criarWorkspaceDeAutoria:
  post: {operationId: criarWorkspaceDeAutoria, summary: Criar workspace, description: "Cria um workspace vazio, parte de um curso acessível ou abre uma revisão editorial assumida.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputCriarWorkspaceDeAutoria"}}}}, responses: {"200": {description: "Operação concluída. data contém: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent.", content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /lerWorkspaceDeAutoria:
  post: {operationId: lerWorkspaceDeAutoria, summary: Ler workspace, description: "Lê a árvore, uma entidade ou o documento composto atual do workspace.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputLerWorkspaceDeAutoria"}}}}, responses: {"200": {description: "Operação concluída. data contém: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent, brief, publications, view, content.", content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /revisarMicroteoriasDoWorkspace:
  post: {operationId: revisarMicroteoriasDoWorkspace, summary: Revisar microteorias, description: "Retorna as microteorias de uma lição ou uma microssequência, com conteúdo conceitual agregado e contagem de práticas; não enumera cards.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputRevisarMicroteoriasDoWorkspace"}}}}, responses: {"200": {description: "Operação concluída. data contém: workspaceId, title, revision, currentRevision, entityCount, createdAt, updatedAt, idempotent, brief, publications, view, content.", content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /listarCardsDaMicrossequencia:
  post: {operationId: listarCardsDaMicrossequencia, summary: Listar cards da microssequência, description: "Lista ids, posições, kinds, resources e resumos curtos dos cards diretamente das partes atuais de um workspace. Para curso publicado, abra ou importe primeiro em um workspace.", x-openai-isConsequential: false, security: [{AraLearnOAuth: [openid, email]}], requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/InputListarCardsDaMicrossequencia"}}}}, responses: {"200": {description: "Operação concluída. data contém: workspaceId, revision, microsequencePath, items, hasMore, nextCursor.", content: {application/json: {schema: {$ref: "#/components/schemas/AraLearnActionSuccess"}}}}, "400": {$ref: "#/components/responses/BadRequest"}, "401": {$ref: "#/components/responses/AuthenticationRequired"}, "403": {$ref: "#/components/responses/Forbidden"}, "409": {$ref: "#/components/responses/Conflict"}, "413": {$ref: "#/components/responses/PayloadTooLarge"}, "422": {$ref: "#/components/responses/UnprocessableEntity"}, "429": {$ref: "#/components/responses/RateLimited"}, default: {$ref: "#/components/responses/UnexpectedError"}}}
 /listarAlteracoesRecentesDoWorkspace:
