      operationId: importarCursoNoWorkspace
      summary: Importar curso
      description: Acrescenta um curso existente ao workspace para reaproveitar ou mover suas partes.
      x-openai-isConsequential: true
      security:
        - AraLearnOAuth:
            - openid
            - email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - requestId
                - workspaceId
                - expectedRevision
                - courseId
                - workspaceCourseId
              properties:
                requestId:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
                workspaceId: &a3
                  type: string
                  format: uuid
                expectedRevision:
                  type: integer
                  minimum: 1
                courseId: *a3
                workspaceCourseId:
                  type: string
                  minLength: 1
                  maxLength: 240
                  pattern: \S
                position:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema: *a1
