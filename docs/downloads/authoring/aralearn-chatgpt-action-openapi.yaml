      x-openai-isConsequential: false
      security:
        - AraLearnOAuth:
            - openid
            - email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - resource
              properties:
                resource:
                  type: string
                  enum:
                    - paragraph
                    - choice
                    - composite
                    - code
                    - table
                    - flow
                    - tree
                    - graph
                    - relation_map
                    - matrix
                    - plane
                    - formula
                    - chart
                    - sequence
                    - annotated_text
                    - linguistic_example
                    - system_map
                    - reaction
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema: *a1
        "400":
          description: Parâmetros inválidos.
        "401":
          description: Conecte a conta AraLearn.
        "403":
          description: Operação não autorizada para a conta.
        "409":
          description: A revisão mudou; releia antes de repetir a intenção.
        "413":
