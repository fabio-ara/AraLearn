  /inserirEntidadeNoWorkspace:
    post:
      operationId: inserirEntidadeNoWorkspace
      summary: Inserir entidade
      description: Insere um curso, módulo, lição, microssequência ou card completo no pai informado.
      x-openai-isConsequential: true
      security:
        - AraLearnOAuth:
            - openid
            - email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - requestId
                - workspaceId
                - expectedRevision
                - entityType
                - entity
              properties:
                requestId:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
                workspaceId:
                  type: string
                  format: uuid
                expectedRevision:
                  type: integer
                  minimum: 1
                entityType:
                  type: string
                  enum:
                    - course
                    - module
                    - lesson
                    - microsequence
                    - card
                parentPath:
                  type:
                    - array
                    - "null"
                  minItems: 1
                  maxItems: 4
                  items: &a4
                    type: string
                    minLength: 1
                    maxLength: 240
                    pattern: \S
                position:
                  type: integer
                  minimum: 0
                entity:
                  type: object
                  additionalProperties: true
              allOf:
                - if:
                    properties:
                      entityType:
                        const: course
                    required:
                      - entityType
                  then:
                    properties:
                      parentPath:
                        type: "null"
                - if:
                    properties:
                      entityType:
                        const: module
                    required:
                      - entityType
                  then:
                    required:
                      - parentPath
                    properties:
                      parentPath:
                        type: array
                        minItems: 1
                        maxItems: 1
                        items: *a4
                - if:
                    properties:
                      entityType:
                        const: lesson
                    required:
                      - entityType
                  then:
                    required:
                      - parentPath
                    properties:
                      parentPath:
                        type: array
                        minItems: 2
                        maxItems: 2
                        items: *a4
                - if:
                    properties:
                      entityType:
                        const: microsequence
                    required:
                      - entityType
                  then:
                    required:
                      - parentPath
                    properties:
                      parentPath:
                        type: array
                        minItems: 3
                        maxItems: 3
                        items: *a4
                - if:
                    properties:
                      entityType:
                        const: card
                    required:
                      - entityType
                  then:
                    required:
                      - parentPath
                    properties:
                      parentPath:
                        type: array
                        minItems: 4
                        maxItems: 4
                        items: *a4
      responses:
        "200":
          description: Operação concluída.
          content:
            application/json:
              schema: *a1
        "400":
          description: Parâmetros inválidos.
        "401":
          description: Conecte a conta AraLearn.
        "403":
          description: Operação não autorizada para a conta.
        "409":
          description: A revisão mudou; releia antes de repetir a intenção.
        "413":
          description: Use um recorte estrutural menor.
        "429":
          description: Limite temporário; repita depois com o mesmo requestId.
        default:
          description: Falha estruturada da operação.
  /substituirEntidadeNoWorkspace:
    post:
      operationId: substituirEntidadeNoWorkspace
      summary: Substituir entidade
      description: Substitui atomicamente uma entidade completa preservando seu id.
      x-openai-isConsequential: true
      security:
        - AraLearnOAuth:
            - openid
            - email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - requestId
                - workspaceId
                - expectedRevision
                - entityType
                - entityPath
                - entity
              properties:
                requestId:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$
                workspaceId:
                  type: string
                  format: uuid
                expectedRevision:
                  type: integer
                  minimum: 1
                entityType:
                  type: string
                  enum:
                    - course
                    - module
                    - lesson
                    - microsequence
                    - card
                entityPath:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: &a5
                    type: string
                    minLength: 1
                    maxLength: 240
                    pattern: \S
                entity:
                  type: object
                  additionalProperties: true
              allOf:
                - if:
                    properties:
                      entityType:
                        const: course
